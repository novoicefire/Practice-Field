<style>

y:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px}.upload-item.private{border-color:var(--orange);background:var(--orange2)}.commit-box{border:1px solid var(--line);background:#f6f8fa;border-radius:8px;padding:13px;margin-top:14px}.issue-row{border:1px solid var(--line);border-radius:8px;padding:13px;margin-bottom:9px}.issue-open{color:var(--green)}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;overflow:auto}.board-col{background:#f6f8fa;border:1px solid var(--line);border-radius:8px;padding:10px;min-height:240px}.board-card{background:#fff;border:1px solid var(--line);border-radius:7px;padding:10px;margin-top:8px}.diff{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;border:1px solid var(--line);border-radius:7px;overflow:hidden;font-size:13px}.diff-line{padding:7px 10px}.diff-line.add{background:#dafbe1}.diff-line.del{background:#ffebe9}.review-box{border:1px solid var(--line);border-radius:8px;padding:13px;margin-top:13px}.status-badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:700;background:var(--soft)}.status-badge.green{background:var(--green2);color:var(--green)}.status-badge.orange{background:var(--orange2);color:var(--orange)}.status-badge.purple{background:#fbefff;color:var(--purple)}

 {id:'owner',title:['沒人知道誰負責','Nobody knows who owns the task'],body:['群組裡只說「有人處理一下社群文案」，沒有負責人、期限或完成條件。','The chat only says “someone handle the social copy,” with no owner, deadline, or acceptance criteria.'],need:['明確任務與負責人','Clear tasks and ownership'],term:'Issue'},

function normalizePractice(value){const base=basePractice(),v=value&&typeof value==='object'?value:{};return {...base,...v,drafts:{...base.drafts,...(v.drafts||{})},review:{...base.review,...(v.review||{})}}}
function normalizeChallenge(value){const base=baseChallenge(),v=value&&typeof value==='object'?value:{};return {...base,...v,drafts:{...base.drafts,...(v.drafts||{})},missionA:{...base.missionA,...(v.missionA||{})},missionB:{...base.missionB,...(v.missionB||{}),understanding:{...base.missionB.understanding,...((v.missionB||{}).understanding||{})}}}}
function fresh(){return {version:VERSION,lang:'zh',phase:1,unlocked:1,scenarioFound:[],scenarioSelected:null,thinking:{},thinkingCurrent:'owner',demo:{index:0,played:false,auto:false,version:DEMO_VERSION},practice:basePractice(),challenge:baseChallenge(),termsOpen:false,modal:null,extension:null}}
function readPracticeBundle(fallbackPractice,fallbackChallenge){try{const version=Number(localStorage.getItem(PRACTICE_STORAGE_VERSION_KEY)),raw=localStorage.getItem(PRACTICE_STORAGE_KEY);if(version===PRACTICE_STORAGE_VERSION&&raw){const x=JSON.parse(raw);return {practice:normalizePractice(x.practice||fallbackPractice),challenge:normalizeChallenge(x.challenge||fallbackChallenge)}}}catch(e){}return {practice:normalizePractice(fallbackPractice),challenge:normalizeChallenge(fallbackChallenge)}}
let state=load();
let focusRequested=false;
let modalReturnFocus=null;
function load(){try{const x=JSON.parse(localStorage.getItem(STORE));if(x&&x.version===VERSION){const bundle=readPracticeBundle(x.practice,x.challenge);x.practice=bundle.practice;x.challenge=bundle.challenge;if(!x.demo||x.demo.version!==DEMO_VERSION)x.demo={index:0,played:false,auto:false,version:DEMO_VERSION};else x.demo.auto=false;return x}}catch(e){}return fresh()}
function persist(){try{localStorage.setItem(STORE,JSON.stringify(state));localStorage.setItem(PRACTICE_STORAGE_VERSION_KEY,String(PRACTICE_STORAGE_VERSION));localStorage.setItem(PRACTICE_STORAGE_KEY,JSON.stringify({practice:state.practice,challenge:state.challenge}))}catch(e){}}
function save(render=true){persist();if(render)draw()}
function draftPractice(key,value){state.practice.drafts[key]=value;persist()}
function draftChallenge(key,value){state.challenge.drafts[key]=value;persist()}
function draftPracticeFiles(){state.practice.drafts.files=[...document.querySelectorAll('.p-file:checked')].map(x=>x.value);persist()}
function draftChallengeFiles(){state.challenge.drafts.files=[...document.querySelectorAll('.ca-file:checked,.c-file:checked')].map(x=>x.value);persist()}
function practiceDraftValue(key){return state.practice.drafts[key]??''}
function challengeDraftValue(key){return state.challenge.drafts[key]??''}
function setLang(v){state.lang=v;save()}
function gotoPhase(n){if(n>state.unlocked)return;state.phase=n;state.modal=null;focusRequested=true;save();topNow()}
function unlock(n){state.unlocked=Math.max(state.unlocked,n);state.phase=n;focusRequested=true;save();topNow()}
function resetAll(){if(confirm(plain('確定清除全部學習進度？這會重設五個階段與表單草稿。','Clear all learning progress and form drafts?'))){state=fresh();focusRequested=true;save();topNow()}}
function resetPhase(){if(!confirm(plain('重新開始目前階段？目前階段的表單草稿與進度會被清除。','Restart this stage? Its drafts and progress will be cleared.')))return;if(state.phase===1){state.scenarioFound=[];state.scenarioSelected=null}if(state.phase===2){state.thinking={};state.thinkingCurrent='owner'}if(state.phase===3){state.demo={index:0,played:false,auto:false,version:DEMO_VERSION}}if(state.phase===4)state.practice=basePractice();if(state.phase===5)state.challenge=baseChallenge();focusRequested=true;save();topNow()}
function phaseName(i){const a=[['真實情境','Real context'],['引導思考','Guided thinking'],['完整示範','Watch once'],['引導練習','Guided practice'],['獨立挑戰','Independent challenge']];return tx(...a[i-1])}
function header(){return `<header class="app-header"><div class="header-main"><div class="brand"><div class="brand-mark">G</div><div><div class="brand-title">${tx('GitHub 協作練習場','GitHub Collaboration Lab')}</div><div class="brand-sub">${tx('零基礎商管學生教學','A zero-background course for business students')}</div></div></div><div class="header-spacer"></div><div class="header-actions"><label>${tx('教材語言','Course language')}</label><select onchange="setLang(this.value)"><option value="zh" ${state.lang==='zh'?'selected':''}>繁體中文</option><option value="bi" ${state.lang==='bi'?'selected':''}>中英對照</option><option value="en" ${state.lang==='en'?'selected':''}>English</option></select><button class="header-btn" onclick="gotoPhase(1)">${tx('返回課程起點','Return to course start')}</button><button class="header-btn" onclick="resetPhase()">${tx('重設本階段','Reset this stage')}</button></div></div><nav class="phasebar" aria-label="Course stages">${[1,2,3,4,5].map(i=>`<button class="phase-btn ${state.phase===i?'current':i<state.unlocked?'done':i>state.unlocked?'locked':''}" onclick="gotoPhase(${i})" ${i>state.unlocked?'disabled':''}><span class="phase-no">${i<state.unlocked?'✓':i}</span><span>${phaseName(i)}</span></button>`).join('')}</nav></header>`}
function resolveTermKey(k){return k==='Pull Request'?'PR':k}
function relevantTerms(){if(state.phase===1)return ['Collaboration','Version'];if(state.phase===2){const learned=pains.filter(p=>state.thinking[p.id]).map(p=>resolveTermKey(p.term));return ['Git','GitHub',...learned]}if(state.phase===3)return ['GitHub','Repository','main',demoSteps[state.demo.index].term];if(state.phase===4){const map=[['Repository','main'],['Upload','Commit'],['Issue'],['Project'],['Branch','main'],['Commit','Branch'],['PR','Branch','main'],['Review','PR'],['Merge','main']];return map[state.practice.step]||['GitHub']}return []}
function termPanel(){const list=[...new Set(relevantTerms())];return `<aside class="terms-panel card"><div class="terms-head"><b>${tx('目前專有名詞','Current terminology')}</b><span>${list.length}</span></div><div class="terms-body">${list.map((k,i)=>termCard(k,i===list.length-1)).join('')}</div></aside>`}
function termCard(k,active=false){const x=terms[k];if(!x)return'';return `<article class="term-card ${active?'active':''}"><h3><span class="term-en">${esc(x.en)}</span>｜${esc(x.zh)}</h3><p>${tx(esc(x.descZh),esc(x.descEn))}</p><div class="term-where">${tx(esc(x.whereZh),esc(x.whereEn))}</div></article>`}
function termsModal(){const list=state.phase<5?relevantTerms():Object.keys(terms);return `<div class="modal-wrap" role="presentation" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="terms-title"><div class="modal-head"><h2 id="terms-title">${tx('專有名詞字卡','Terminology cards')}</h2><button class="modal-close" onclick="closeModal()" aria-label="Close">×</button></div><div class="modal-body">${[...new Set(list)].map(k=>termCard(k)).join('')}</div></div></div>`}
function mobileTerms(){return state.phase<=4?`<button class="btn blue mobile-terms" onclick="openTerms()">${tx('名詞字卡','Terms')}</button>`:''}
function openTerms(){modalReturnFocus=document.activeElement;state.modal='terms';save()}
function closeModal(){const returnFocus=modalReturnFocus;modalReturnFocus=null;state.modal=null;save();requestAnimationFrame(()=>{if(returnFocus&&document.body.contains(returnFocus))returnFocus.focus()})}
function phaseFooter(prev,next,label){return `<div class="footer-nav"><div>${prev?`<button class="btn" onclick="${prev}">${tx('上一步','Back')}</button>`:''}</div><div>${next?`<button class="btn primary" onclick="${next}">${label||tx('繼續','Continue')}</button>`:''}</div></div>`}
function pageWrap(content,withTerms=true){return `<main class="page ${withTerms?'with-terms':''}"><div class="maincol">${content}</div>${withTerms?termPanel():''}</main>${mobileTerms()}`}
/* stage 1 */
function scenarioPage(){const all=state.scenarioFound.length===pains.length;return pageWrap(`<section class="hero card"><h1>${tx('你們的期末專案，正在失控。','Your final project is falling apart.')}</h1><p>${tx('行銷管理課要求四人完成「校園永續市集企劃」：企劃書、預算、社群文案、海報與活動網站都要在五天後繳交。先不要找 GitHub 按鈕，請看懂這個小組出了什麼問題。','A marketing course asks four students to deliver a sustainable campus market proposal, budget, social copy, poster, and event website in five days. Do not look for GitHub buttons yet—first understand what went wrong.')}</p><div class="hero-meta"><span class="meta-chip">${tx('管理學院分組作業','Business-school team project')}</span><span class="meta-chip">LINE + Google Drive + AI</span><span class="meta-chip">${tx('截止倒數 5 天','5 days to deadline')}</span></div></section><div class="section-head"><h2>${tx('查看群組與檔案，再找出五個合作問題','Inspect the chat and files, then find five collaboration problems')}</h2><p>${tx('每張問題卡都會產生不同分析；不是形式上的選擇題。','Each card reveals a different diagnosis, not the same generic result.')}</p></div><div class="story-layout"><section class="phone"><div class="phone-head"><span>${tx('校園永續市集｜期末專案','Sustainable Campus Market | Final Project')}</span><span>${tx('4 人','4 members')}</span></div><div class="chat"><div class="bubble"><small>${tx('小安｜組長','Xiao-An | Team lead')}</small>${tx('教授說除了企劃書，還要交活動網站。大家做完就丟群組。','The professor also wants an event website. Send your work to the group when finished.')}</div><div class="bubble me"><small>Alex</small>${tx('我先找競品資料，晚點傳。','I will research competitors and send it later.')}</div><div class="bubble"><small>${tx('佳芸','Jia-Yun')}</small>${tx('有人可以處理社群文案嗎？','Can someone handle the social-media copy?')}</div><div class="bubble"><small>${tx('志豪','Zhi-Hao')}</small>${tx('我改了預算，但不確定用哪一份企劃書。','I updated the budget, but I am not sure which proposal file to use.')}</div><div class="bubble"><small>${tx('小安','Xiao-An')}</small><div class="file-bubble">📄 ${tx('市集企劃書_最新版.docx','market_proposal_latest.docx')}</div><div class="file-bubble">📄 ${tx('市集企劃書_最新版_志豪改.docx','market_proposal_latest_ZhiHao.docx')}</div><div class="file-bubble">📄 ${tx('市集企劃書_真的最終版2.docx','market_proposal_REAL_final_2.docx')}</div></div><div class="bubble"><small>${tx('佳芸','Jia-Yun')}</small>${tx('我把活動日期改成 11/16 了。','I changed the event date to Nov 16.')}</div><div class="bubble me"><small>Alex</small>${tx('咦？教授公告是 11/23 吧？我也改了網站。','Wait, did the professor announce Nov 23? I also edited the website.')}</div><div class="bubble"><small>${tx('小安','Xiao-An')}</small>${tx('所以現在誰完成了？哪份要交？','So who has finished, and which file do we submit?')}</div></div></section><section><div class="problem-grid">${pains.map(p=>`<button class="problem-card ${state.scenarioFound.includes(p.id)?'found':''}" onclick="inspectPain('${p.id}')"><b>${tx(...p.title)}</b><p>${tx(...p.body)}</p></button>`).join('')}</div>${state.scenarioSelected?painResult(state.scenarioSelected):`<div class="notice" style="margin-top:15px">${tx('請點一張卡片，查看這個問題對專案造成的具體影響。','Select a card to inspect its concrete impact on the project.')}</div>`}<p class="progress-note">${tx(`已找出 ${state.scenarioFound.length} / ${pains.length} 個問題`,`Found ${state.scenarioFound.length} / ${pains.length} problems`)}</p></section></div>${phaseFooter(null,all?'unlock(2)':null,tx('進入引導思考','Continue to guided thinking'))}`)}
function inspectPain(id){state.scenarioSelected=id;if(!state.scenarioFound.includes(id))state.scenarioFound.push(id);save()}
function painResult(id){const p=pains.find(x=>x.id===id);const impacts={owner:['工作可能被所有人以為「別人會做」，最後無人交付。','Everyone may assume someone else will do it, leaving the task unfinished.'],version:['組長必須人工比對，且可能把舊資料當成正式內容。','The leader must compare manually and may adopt outdated content.'],collision:['兩人的修改互相覆蓋，正確日期也無法被可靠確認。','Edits overwrite one another, and the correct date cannot be verified reliably.'],review:['錯誤會直接進入最後成果，直到交件後才被發現。','Errors reach the final deliverable and may be found only after submission.'],progress:['截止前無法判斷瓶頸，也無法及時調整分工。','The team cannot identify bottlenecks or rebalance work before the deadline.']};return `<article class="card problem-result"><span class="status-badge orange">${tx('問題影響','Impact')}</span><h3>${tx(...p.title)}</h3><p>${tx(...impacts[id])}</p><div class="notice warn"><b>${tx('需要解決的不是「檔名」，而是協作規則。','The real problem is not the file name—it is the collaboration process.')}</b></div></article>`}
/* stage 2 */
function thinkingPage(){const current=pains.find(p=>p.id===state.thinkingCurrent);const done=Object.keys(state.thinking).length===pains.length;return pageWrap(`<section class="hero card"><h1>${tx('先定義需要，再認識工具。','Define the need before learning the tool.')}</h1><p>${tx('你已經找出五個問題。現在請判斷每個問題需要哪一種協作能力；答對後才會揭露 GitHub 對應的功能名稱。','You found five problems. Now identify the collaboration capability each one requires; the matching GitHub term is revealed only after a correct answer.')}</p></section><div class="section-head"><h2>${tx('把問題轉成協作需求','Turn problems into collaboration needs')}</h2><p>${tx('不同問題有不同需求，不會再出現「按哪張卡結果都一樣」。','Different problems map to different needs.')}</p></div><div class="think-shell"><aside class="card pain-list">${pains.map(p=>`<button class="pain-btn ${state.thinkingCurrent===p.id?'active':''} ${state.thinking[p.id]?'done':''}" onclick="selectThinking('${p.id}')"><b>${tx(...p.title)}</b><br><small>${state.thinking[p.id]?`✓ ${tx(...p.need)}`:tx('尚未完成','Not completed')}</small></button>`).join('')}</aside><section><article class="card" style="padding:20px"><span class="status-badge">${tx('目前問題','Current problem')}</span><h2>${tx(...current.title)}</h2><p>${tx(...current.body)}</p><h3>${tx('這個小組最需要什麼？','What does the team need most?')}</h3><div class="need-options">${shuffleNeeds(current.id).map(n=>`<button class="need-option" onclick="answerNeed('${current.id}','${n.id}')"><b>${tx(...n.need)}</b></button>`).join('')}</div></article>${state.thinking[current.id]?conceptReveal(current):''}${done?gitGithubReveal():''}</section></div>${phaseFooter('gotoPhase(1)',done?'unlock(3)':null,tx('觀看完整示範','Watch the complete demonstration'))}`)}
function selectThinking(id){state.thinkingCurrent=id;save()}
function shuffleNeeds(id){const current=pains.find(p=>p.id===id);const others=pains.filter(p=>p.id!==id).slice(0,3);return [current,...others].sort((a,b)=>a.id.localeCompare(b.id))}
function answerNeed(painId,answerId){if(painId===answerId){state.thinking[painId]=true;state.modal={type:'ok',title:['判斷正確','Correct'],body:pains.find(p=>p.id===painId).need}}else{const p=pains.find(x=>x.id===answerId);state.modal={type:'wrong',title:['再想一次','Try again'],body:[`「${p.need[0]}」解決的是另一種問題；請回到目前情境判斷。`,`“${p.need[1]}” solves a different problem. Reconsider the current context.`]}}save()}
function conceptReveal(p){const key=resolveTermKey(p.term),term=terms[key];if(!term)return `<article class="card concept-reveal"><div class="notice warn">${tx('名詞資料暫時無法載入，請切換題目後再試一次。','The terminology card could not be loaded. Switch questions and try again.')}</div></article>`;return `<article class="card concept-reveal"><span class="status-badge green">${tx('已揭露 GitHub 功能','GitHub feature revealed')}</span><h2>${esc(term.en)}｜${esc(term.zh)}</h2><p>${tx(esc(term.descZh),esc(term.descEn))}</p></article>`}
function gitGithubReveal(){return `<section class="git-github"><article class="card concept-box"><h3>Git</h3><p>${tx('負責記錄檔案變更與版本歷史。主課程先用網頁理解概念，完成後再解鎖指令延伸。','Records file changes and version history. The core course uses the web first; commands unlock afterward.')}</p></article><article class="card concept-box"><h3>GitHub</h3><p>${tx('把 Repository、Issue、Project、Pull Request 與 Review 放在同一個網頁協作空間。','Brings repositories, issues, projects, pull requests, and reviews into one web collaboration space.')}</p></article></section>`}
/* stage 3 */
function demoPage(){const i=state.demo.index,s=demoSteps[i];return pageWrap(`<div class="lesson-bar card"><div><h2>${tx('第三階段：先完整看一次','Stage 3: Watch the full workflow once')}</h2><p>${tx('此階段由系統操作，主介面不能點擊；請觀察每一步的問題、動作與結果。','The system operates here. The main interface is locked; observe the problem, action, and result.')}</p></div><div class="lesson-count">${i+1} / ${demoSteps.length}</div></div><div class="demo-shell"><aside class="demo-narrator card"><span class="status-badge purple">${tx('系統示範','System demonstration')}</span><h2>${tx(...s.title)}</h2><div class="demo-progress"><i style="width:${(i+1)/demoSteps.length*100}%"></i></div><div class="demo-block"><div class="demo-label">${tx('現在遇到的問題','Problem')}</div><p>${tx(...s.problem)}</p></div><div class="demo-block"><div class="demo-label">${tx('系統現在做什麼','Action')}</div><p>${tx(...s.action)}</p></div><div class="demo-block"><div class="demo-label">${tx('操作後發生什麼','Result')}</div><p>${tx(...s.result)}</p></div><div class="demo-controls"><button class="btn" onclick="demoPrev()" ${i===0?'disabled':''}>${tx('上一段','Previous')}</button><button class="btn blue" onclick="toggleDemoAuto()">${state.demo.auto?tx('暫停','Pause'):tx('自動播放','Auto play')}</button><button class="btn primary" onclick="demoNext()">${i===demoSteps.length-1?tx('完成示範','Finish demo'):tx('下一段','Next')}</button></div></aside><section class="demo-stage"><div class="demo-shield" aria-label="Demonstration only"></div>${renderDemoGithub(i)}</section></div>${phaseFooter('gotoPhase(2)',state.demo.played?'unlock(4)':null,tx('開始引導練習','Start guided practice'))}`)}
function demoPrev(){state.demo.auto=false;state.demo.index=Math.max(0,state.demo.index-1);save();topNow()}
function demoNext(){state.demo.auto=false;if(state.demo.index<demoSteps.length-1){state.demo.index++;save();topNow()}else{state.demo.played=true;save();topNow()}}
let demoTimer=null;
function toggleDemoAuto(){state.demo.auto=!state.demo.auto;save();if(state.demo.auto){clearInterval(demoTimer);demoTimer=setInterval(()=>{if(state.phase!==3||!state.demo.auto){clearInterval(demoTimer);return}if(state.demo.index<demoSteps.length-1){state.demo.index++;persist();draw()}else{state.demo.auto=false;state.demo.played=true;clearInterval(demoTimer);save()}topNow()},2500)}else clearInterval(demoTimer)}
function ghShell(active,body,repo=true){return `<div class="gh-window"><div class="gh-global"><span class="gh-logo">GH</span><span class="gh-search">Search or jump to...</span><span style="margin-left:auto">Alex</span></div>${repo?`<div class="gh-repohead"><div class="repo-name">alex / campus-market</div><div class="gh-tabs">${['Code','Issues','Pull requests','Projects'].map(x=>`<button class="gh-tab ${active===x?'active':''}">${x}</button>`).join('')}</div></div>`:''}<div class="gh-body">${body}</div></div>`}
function fileTable(extra=false){const rows=[['README.md',plain('建立專案說明','Add project overview'),'1 min ago'],['project-plan.md',plain('加入企劃架構','Add proposal structure'),'1 min ago'],['budget.xlsx',plain('加入預算表','Add budget sheet'),'1 min ago'],['index.html',plain('加入活動網站','Add event website'),'1 min ago']];if(extra)rows.push(['competitor-research.md',plain('新增三家競品分析','Add three competitor analyses'),'just now']);return `<div class="gh-toolbar"><span class="branch-pill">⌘ ${extra?'feature/competitor-research':'main'}</span><button class="btn">Add file</button></div><div class="file-table">${rows.map(r=>`<div class="file-row"><span class="file-name">${r[0]}</span><span>${r[1]}</span><span>${r[2]}</span></div>`).join('')}</div>`}

mpetitor-research → main</p><div class="diff"><div class="diff-line add">+ 競品 A：草悟道市集</div><div class="diff-line add">+ 攤位費：5000</div></div>`);if(v==='review')return ghShell('Pull requests',`<span class="status-badge orange">Changes requested</span><h2>${tx('新增三家競品分析','Add three competitor analyses')} #2</h2><div class="diff"><div class="diff-line add">+ 攤位費：5000</div></div><div class="review-box"><b>志豪：</b>${tx('請補上幣別與單位。','Please add currency and unit.')}</div>`);if(v==='approved')return ghShell('Pull requests',`<span class="status-badge green">Approved</span><div class="diff"><div class="diff-line del">- 攤位費：5000</div><div class="diff-line add">+ 攤位費：新台幣 5,000 元</div></div><div class="review-box">✓ ${tx('志豪已核准','Approved by Zhi-Hao')}</div>`);return ghShell('Projects',`<div class="notice success"><h2>${tx('Pull Request 已合併','Pull request merged')}</h2><p>${tx('main 已更新，Issue #1 關閉，Project 卡片移至 Done。','main is updated, Issue #1 is closed, and the project card moves to Done.')}</p></div><div class="board"><div class="board-col"><b>Todo</b></div><div class="board-col"><b>In progress</b></div><div class="board-col"><b>Done</b><div class="board-card">✓ #1 ${tx('完成三家競品分析','Complete three competitor analyses')}</div></div></div>`)}

function practicePage(){const p=state.practice,m=practiceMeta[p.step];return pageWrap(`<div class="lesson-bar card"><div><h2>${tx('第四階段：你操作，系統只在需要時提示','Stage 4: You operate; hints appear only when needed')}</h2><p>${tx('每一步都要先判斷、再操作、觀察結果，最後說出自己做了什麼。錯誤會產生真實後果與復原選項。','Each step requires prediction, action, observation, and reflection. Mistakes produce consequences and recovery options.')}</p></div><div class="lesson-count">${p.step+1} / ${practiceMeta.length}</div></div><div class="guided-layout"><aside class="mission card"><span class="status-badge purple">${tx('目前任務','Current mission')}</span><h3>${tx(...m.title)}</h3><p>${tx(...m.mission)}</p><div class="predict"><b>${tx('先想一想','Predict first')}</b><p>${tx(...m.q)}</p>${m.opts.map(o=>`<button class="predict-option ${p.prediction===o[0]?(p.predictionOK?'correct':'wrong'):''}" onclick="practicePredict('${esc(o[0])}')">${tx(o[0],o[1])}</button>`).join('')}</div>${p.predictionOK?`<div class="btn-row" style="margin-top:13px"><button class="btn" onclick="nextHint()">${tx(`提示 ${p.hint}/3`,`Hint ${p.hint}/3`)}</button></div>${p.hint?`<div class="hint-box">${practiceHint(p.step,p.hint)}</div>`:''}`:''}</aside><section>${p.error?practiceError(p.error):''}${renderPracticeWorkspace()}${p.result?practiceResult():''}</section></div>${phaseFooter('gotoPhase(3)',p.step===practiceMeta.length-1&&p.result&&p.reflection==='ok'?'unlock(5)':null,tx('進入獨立挑戰','Start independent challenge'))}`)}

function commitPracticeEdit(){const msg=document.getElementById('p-edit-msg')?.value.trim(),content=document.getElementById('p-editor')?.value,p=state.practice;if(p.branch==='main'){badEditMain();return}if(!msg||/^update$/i.test(msg)){p.error={title:['History 只會顯示模糊的 update','History would show only a vague “update”'],body:['半年後的你無法知道這筆 Commit 是新增競品、修正日期，還是修改預算。','Months later, nobody can tell whether the commit added competitors, fixed a date, or changed the budget.'],recover:'commit'};save();return}p.files['competitor-research.md']={content};p.commits.unshift({id:uid(),message:msg,branch:p.branch});completePracticeAction();save()}

function renderReviewPractice(){const p=state.practice;if(p.review.status==='approved')return ghShell('Pull requests',`<span class="status-badge green">Approved</span><div class="diff"><div class="diff-line del">- 攤位費：5000</div><div class="diff-line add">+ 攤位費：新台幣 5,000 元</div></div><div class="review-box">✓ ${tx('修正已確認','Fix verified')}</div>`);if(p.review.status==='changes_requested'&&!p.review.fixed)return ghShell('Pull requests',`<span class="status-badge orange">Changes requested</span><div class="review-box"><b>${tx('Review 留言','Review comment')}：</b>${tx('請補上幣別與單位。','Please add currency and unit.')}</div><div class="field" style="margin-top:14px"><label>${tx('回到 Branch 修正內容','Fix the branch content')}</label><textarea id="p-fix-editor" class="textarea">${esc(p.files['competitor-research.md']?.content||'')}</textarea></div><button class="btn primary" onclick="fixPracticeReview()">${tx('建立修正 Commit','Create fix commit')}</button>`);if(p.review.status==='changes_requested'&&p.review.fixed)return ghShell('Pull requests',`<div class="diff"><div class="diff-line del">- 攤位費：5000</div><div class="diff-line add">+ 攤位費：新台幣 5,000 元</div></div><div class="review-box"><h3>Submit review</h3><button class="btn primary" onclick="approvePracticeReview()">Approve</button></div>`);return ghShell('Pull requests',`<h2>Files changed</h2><div class="diff"><div class="diff-line add">+ 競品 A：草悟道市集</div><div class="diff-line add spotlight">+ 攤位費：5000</div></div><div class="review-box"><label>${tx('審核結果','Review decision')}</label><div class="btn-row" style="margin-top:8px"><button class="btn" onclick="requestPracticeChanges()">Request changes</button><button class="btn primary" onclick="badApprovePractice()">Approve</button></div></div>`)}
function badApprovePractice(){state.practice.error={title:['錯誤資料被核准','Incorrect data is approved'],body:['你沒有檢查 Files changed，就核准了缺少幣別的預算。','You approved a budget missing its currency because you did not inspect Files changed.'],consequence:[[['審核失去作用','Review loses its purpose'],['PR 有審核紀錄，但錯誤仍會進入正式版。','The PR looks reviewed, yet the error can still become official.']],[['正確做法','Correct action'],['回到差異畫面，對問題行 Request changes。','Return to the diff and request changes on the problematic line.']]],recover:'review'};save()}
