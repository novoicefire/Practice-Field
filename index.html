function challengeRepoView(){const d=state.challenge.drafts;return challengeShell(`<div class="gh-form"><h2>Create a new repository</h2>${challengeField('Repository name','ca-repo',d.repoName,'draftChallenge(\'repoName\',this.value)','campus-market-case')}<fieldset class="field"><legend>Visibility</legend><div class="radio-stack"><label class="radio-card"><input type="radio" name="ca-vis" value="public" ${d.repoVisibility==='public'?'checked':''} onchange="draftChallenge('repoVisibility',this.value)"> Public</label><label class="radio-card"><input type="radio" name="ca-vis" value="private" ${d.repoVisibility==='private'?'checked':''} onchange="draftChallenge('repoVisibility',this.value)"> Private</label></div></fieldset><label class="radio-card"><input id="ca-readme" type="checkbox" ${d.repoReadme?'checked':''} onchange="draftChallenge('repoReadme',this.checked)"> <span>Add a README file</span></label><button class="btn primary" style="margin-top:14px" onclick="challengeCreateRepo()">Create repository</button></div>`)}
function challengeCreateRepo(){const c=state.challenge,d=c.drafts,name=d.repoName.trim();if(!name||d.repoVisibility!=='private'||!d.repoReadme){challengeFailure(['Repository 設定不完整','Repository setup is incomplete'],['請選 Private、勾選 README，並填入 Repository 名稱。','Choose Private, add a README, and provide a repository name.']);return}c.missionA.repoCreated=true;c.missionA.repoName=name;c.missionA.repoVisibility='private';c.missionA.repoReadme=true;c.tab='Code';challengeRecord('repository_created',{name});save();topNow()}
function challengeMissionA(stage){const c=state.challenge,a=c.missionA,d=c.drafts;if(stage===0)return challengeShell(`<div class="notice">${tx('任務 A：你是 Alex，先建立自己的工作空間。','Task A: you are Alex; first create your work space.')}</div>`);if(stage===1){if(!a.filesCreated)return challengeShell(`<h2>Upload files to main</h2><p>${tx('選擇至少三個公開可分享的檔案，再建立初始 Commit。','Select at least three shareable files, then create the initial commit.')}</p><div class="upload-grid">${[['project-plan.md',true],['budget.xlsx',true],['index.html',true],['poster.png',true],['private-notes.txt',false]].map(([n,ok])=>`<label class="upload-item ${ok?'':'private'}"><input type="checkbox" class="ca-file" value="${n}" ${d.files.includes(n)?'checked':''} onchange="draftChallengeFiles()"><span><b>${n}</b><br><small>${ok?'Project material':'Contains private, unverified notes'}</small></span></label>`).join('')}</div><div class="commit-box">${challengeField('Initial Commit message','ca-commit',d.commitMessage,'draftChallenge(\'commitMessage\',this.value)','Add project materials')}<button class="btn primary" onclick="challengeCreateFiles()">Create initial commit</button></div>`);return challengeShell(`<div class="notice success"><b>main</b>：${a.initialCommitSha}<p>${tx('這不只是按下儲存：Commit 會留下作者、訊息和 SHA，之後查得到這次變更。','This is more than pressing save: a commit records an author, message, and SHA that you can look up later.')}</p></div>`)}if(stage===2){if(!a.issueCreated)return challengeShell(`<div class="gh-form"><h2>New Issue #1</h2>${challengeField('Title','ca-issue-title',d.issueTitle,'draftChallenge(\'issueTitle\',this.value)','Complete competitor analysis')}<div class="field"><label for="ca-issue-criteria">Acceptance criteria</label><textarea id="ca-issue-criteria" class="textarea" oninput="draftChallenge('issueCriteria',this.value)" placeholder="At least three competitors, prices, features, and sources">${esc(d.issueCriteria)}</textarea></div><div class="field"><label for="ca-issue-assignee">Assignee</label><select id="ca-issue-assignee" class="select" onchange="draftChallenge('issueAssignee',this.value)"><option value="">Unassigned</option><option value="Alex" ${d.issueAssignee==='Alex'?'selected':''}>Alex</option><option value="Jamie" ${d.issueAssignee==='Jamie'?'selected':''}>Jamie</option></select></div><button class="btn primary" onclick="challengeCreateIssue()">Create issue</button></div>`);return challengeShell(`<div class="issue-row"><span class="issue-open">Open</span> <b>#1 ${esc(a.issue.title)}</b><p>${esc(a.issue.criteria)}<br>Assignee: ${esc(a.issue.assignee)}</p></div>`)}if(stage===3){return challengeProjectView()}if(stage===4){return challengeShell(`<div class="gh-form"><h2>Create a branch from main</h2><p class="field-help">${tx('Branch 是同一 Repository 中的另一條工作線；不能把 main 當作新 Branch。','A branch is another line of work in the same repository; main itself is not a new branch.')}</p>${challengeField('Branch name','ca-branch',d.branchName,'draftChallenge(\'branchName\',this.value)','feature/budget-format')}<button class="btn primary" onclick="challengeCreateBranch()">Create branch</button></div>`)}if(stage===5){return challengeShell(`<div class="gh-toolbar"><span class="branch-pill">Branch: ${esc(a.branchName)}</span><span class="status-badge orange">Working tree on branch</span></div><div class="field"><label for="ca-edit">budget.md</label><textarea id="ca-edit" class="textarea" oninput="draftChallenge('editContent',this.value)">${esc(d.editContent||'攤位費：5000')}</textarea><p class="field-help">${tx('你會在 Jamie 的 Review 裡看到這個錯誤。','You will see this error in Jamie’s review.')}</p></div>${challengeField('Branch Commit message','ca-edit-message',d.editMessage,'draftChallenge(\'editMessage\',this.value)','Add budget details')}<button class="btn primary" onclick="challengeCommitOwn()">Create branch commit</button>`)}if(stage===6){return challengeShell(`<div class="gh-form"><h2>Open your Pull Request</h2><p class="field-help">${tx('你現在是 PR 作者 Alex，所以不能自己 Approve。','You are the PR author Alex, so you cannot approve your own PR.')}</p><div class="upload-grid"><div class="field"><label for="ca-base">base</label><select id="ca-base" class="select" onchange="draftChallenge('prBase',this.value)"><option value="main">main</option><option value="${esc(a.branchName)}">${esc(a.branchName)}</option></select></div><div class="field"><label for="ca-compare">compare</label><select id="ca-compare" class="select" onchange="draftChallenge('prCompare',this.value)"><option value="${esc(a.branchName)}">${esc(a.branchName)}</option><option value="main">main</option></select></div></div>${challengeField('Title','ca-pr-title',d.prTitle,'draftChallenge(\'prTitle\',this.value)','Fix campus-market budget')}<div class="field"><label for="ca-pr-body">Description</label><textarea id="ca-pr-body" class="textarea" oninput="draftChallenge('prBody',this.value)" placeholder="Closes #1">${esc(d.prBody)}</textarea></div><button class="btn primary" onclick="challengeCreateOwnPR()">Create pull request</button></div>`)}if(stage===7){return challengeShell(`<div class="review-box"><span class="status-badge orange">Request changes</span><h2>Jamie’s review</h2><p>${esc(a.jamieReview?.comment||'Please add currency and unit to the budget amount.')}</p><p class="field-help">${a.reviewRead?tx('已讀取。請回到原 Branch 建立新的修正 Commit。','Read. Return to the original branch and create a new fix commit.'):tx('先按下「查看 Jamie 的 Review」，再進行修正。','Read Jamie’s Review before making the fix.')}</p>${a.reviewRead?`${challengeField('Fix content','ca-fix-content',d.fixContent||'攤位費：新台幣 5,000 元','draftChallenge(\'fixContent\',this.value)')}<button class="btn primary" onclick="challengeFixOwn()">Create fix commit</button>`:`<button class="btn primary" onclick="challengeReadJamie()">Read Jamie review</button>`}</div>`)}if(stage===8){return challengeShell(a.merged?`<div class="notice success"><h2>Own PR merged</h2><p>${tx('Jamie 已核准最新修正，Alex 已把 PR 合併到 main。接著進入隊友 PR 的 Review 任務。','Jamie approved the latest fix and Alex merged the PR into main. Next, review the teammate PR.')}</p><button class="btn primary" onclick="challengeOpenTeammatePR()">Open teammate PR</button></div>`:`<div class="notice"><h2>Jamie approved the latest fix</h2><p>${tx('現在由 Alex 明確執行 Merge。Project 仍維持 In progress，需稍後手動移至 Done。','Alex must now execute Merge. Project remains In progress and must be moved to Done later.')}</p><button class="btn primary" onclick="challengeMergeOwn()">Merge own pull request</button></div>`)}return challengeShell(`<div class="notice success"><h2>Own PR merged</h2><p>${tx('Jamie 已核准最新修正，Alex 已把 PR 合併到 main。接著進入隊友 PR 的 Review 任務。','Jamie approved the latest fix and Alex merged the PR into main. Next, review the teammate PR.')}</p><button class="btn primary" onclick="challengeOpenTeammatePR()">Open teammate PR</button></div>`)}
function challengeCreateFiles(){const c=state.challenge,a=c.missionA,d=c.drafts,files=d.files,msg=d.commitMessage.trim(),required=['project-plan.md','budget.xlsx','index.html'];if(required.some(x=>!files.includes(x))||files.includes('private-notes.txt')||files.length<3||!msg||/^update$/i.test(msg)){challengeFailure(['初始檔案或 Commit 不合格','Initial files or commit are invalid'],['至少選三個必需檔案（不可包含 private-notes.txt），並寫清楚 Commit message。','Select at least three required files (not private-notes.txt) and write a clear commit message.']);return}a.filesCreated=true;a.files=Object.fromEntries(files.map(x=>[x,{content:'',branch:'main'}]));a.selectedFiles=files;a.initialCommitSha=uid();challengeRecord('initial_commit_created',{sha:a.initialCommitSha,files});save();topNow()}
function challengeCreateIssue(){const c=state.challenge,a=c.missionA,d=c.drafts,title=d.issueTitle.trim(),criteria=d.issueCriteria.trim();if(!title||!criteria||d.issueAssignee!=='Alex'){challengeFailure(['Issue 資訊不完整','Issue information is incomplete'],['Issue 必須有標題、驗收條件，且 assignee 必須是 Alex。','The Issue needs a title, acceptance criteria, and Alex as assignee.']);return}a.issueCreated=true;a.issue={number:1,title,criteria,assignee:'Alex',status:'open'};challengeRecord('issue_created',{number:1});save();topNow()}
function challengeProjectView(){const a=state.challenge.missionA,d=state.challenge.drafts,status=a.projectStatus;return challengeShell(`<h2>${a.projectCreated?esc(a.projectName):'New Project'}</h2>${!a.projectCreated?`<div class="gh-form">${challengeField('Project name','ca-project',d.projectName,'draftChallenge(\'projectName\',this.value)','Campus market launch')}<label class="radio-card"><input type="checkbox" ${d.addIssue?'checked':''} onchange="draftChallenge('addIssue',this.checked)"> Add Issue #1 to Todo</label><button class="btn primary" style="margin-top:14px" onclick="challengeCreateProject()">Create project</button></div>`:`<p>${tx('這張卡片目前必須手動移動；系統不會因為建立 PR 自動改狀態。','Move this card manually; the system will not change the status when a PR is created.')}</p><div class="board"><div class="board-col"><b>Todo</b>${status==='todo'?'<div class="board-card">#1 '+esc(a.issue.title)+'</div>':''}</div><div class="board-col"><b>In progress</b>${status==='in_progress'?'<div class="board-card">#1 '+esc(a.issue.title)+'</div>':''}</div><div class="board-col"><b>Done</b>${status==='done'?'<div class="board-card">#1 '+esc(a.issue.title)+'</div>':''}</div></div>${status==='todo'?'<button class="btn primary" style="margin-top:14px" onclick="challengeMoveProject()">Move Issue #1 to In progress</button>':''}`}`)}
function challengeCreateProject(){const c=state.challenge,a=c.missionA,d=c.drafts;if(!d.projectName.trim()||!d.addIssue){challengeFailure(['Project 設定不完整','Project setup is incomplete'],['請輸入名稱並把 Issue #1 加入 Todo。','Provide a name and add Issue #1 to Todo.']);return}a.projectCreated=true;a.projectName=d.projectName.trim();a.projectStatus='todo';challengeRecord('project_created',{name:a.projectName,status:'todo'});save();topNow()}
function challengeMoveProject(){const a=state.challenge.missionA;if(!a.projectCreated||a.projectStatus!=='todo')return;a.projectStatus='in_progress';challengeRecord('project_status_changed',{from:'todo',to:'in_progress',manual:true});save();topNow()}
function challengeCreateBranch(){const c=state.challenge,a=c.missionA,d=c.drafts,name=d.branchName.trim();if(!name||name==='main'){challengeFailure(['Branch 不合格','Invalid branch'],['請建立一個不同於 main 的 Branch。','Create a branch different from main.']);return}a.branchCreated=true;a.branchName=name;a.branchContent='攤位費：5000';d.prCompare=name;challengeRecord('branch_created',{name});save();topNow()}
function challengeCommitOwn(){const c=state.challenge,a=c.missionA,d=c.drafts,content=(document.getElementById('ca-edit')?.value||d.editContent||'').trim(),msg=(document.getElementById('ca-edit-message')?.value||d.editMessage||'').trim();d.editContent=content;d.editMessage=msg;if(!content||!content.includes('5000')||!msg||/^update$/i.test(msg)){challengeFailure(['Branch Commit 不合格','Invalid branch commit'],['請保留具體內容並寫出能說明變更的 Commit message。','Keep concrete content and use a commit message that explains the change.']);return}a.branchContent=content;a.branchCommitSha=uid();a.pr={headSha:a.branchCommitSha};challengeRecord('branch_commit_created',{sha:a.branchCommitSha});save();topNow()}
function challengeCreateOwnPR(){const c=state.challenge,a=c.missionA,d=c.drafts,title=d.prTitle.trim(),body=d.prBody.trim();if(d.prBase!=='main'||d.prCompare!==a.branchName||!title||!body||!body.includes('Closes #1')){challengeFailure(['PR 欄位不符合工作流','PR fields do not meet the workflow'],['base 必須是 main、compare 必須是原 Branch，body 必須包含 Closes #1。','base must be main, compare the original branch, and body must include Closes #1.']);return}a.prCreated=true;a.issueLinked=true;a.pr={number:2,title,body,base:'main',compare:a.branchName,headSha:a.branchCommitSha,status:'open'};a.jamieReviewReceived=true;a.jamieReview={author:'Jamie',state:'changes_requested',comment:'請補上攤位費的幣別與單位，例如：新台幣 5,000 元。'};challengeRecord('own_pr_opened',{headSha:a.pr.headSha});challengeRecord('jamie_requested_changes',{pr:2});save();topNow()}
function challengeReadJamie(){const a=state.challenge.missionA;if(!a.jamieReviewReceived)return;a.reviewRead=true;challengeRecord('jamie_review_read',{pr:2});save();topNow()}
function challengeFixOwn(){const c=state.challenge,a=c.missionA,d=c.drafts,content=(document.getElementById('ca-fix-content')?.value||d.fixContent||'').trim();d.fixContent=content;if(!content||!/(新台幣|NT\$|TWD)/i.test(content)||!content.includes('5,000')){challengeFailure(['修正尚未完成','The fix is not complete'],['請在原 Branch 的檔案裡補上幣別和單位，並寫成 5,000。','In the original Branch, add the currency and unit and use the 5,000 format.']);return}a.fixContent=content;a.fixCommitSha=uid();a.pr.headSha=a.fixCommitSha;a.reviewedSha=a.fixCommitSha;a.jamieApproved=true;a.jamieReview={author:'Jamie',state:'approved',comment:'已確認最新修正。'};challengeRecord('own_fix_commit_created',{sha:a.fixCommitSha});challengeRecord('jamie_approved',{reviewedSha:a.fixCommitSha});save();topNow()}
function challengeMergeOwn(){const c=state.challenge,a=c.missionA;if(!a.jamieApproved||a.reviewedSha!==a.pr.headSha){challengeFailure(['不能 Merge 尚未審查的版本','Cannot merge an unreviewed version'],['Jamie 必須核准目前 PR head SHA；新 Commit 會使舊核准失效。','Jamie must approve the current PR head SHA; a new commit invalidates an old approval.']);return}a.merged=true;a.pr.status='merged';if(a.issueLinked&&a.issue&&a.pr.body.includes('Closes #1'))a.issue.status='closed';challengeRecord('own_pr_merged',{sha:a.pr.headSha,issueClosed:a.issue.status==='closed'});save();topNow()}
function challengeOpenTeammatePR(){const c=state.challenge,b=c.missionB;if(b.prOpened)return;const sha=uid();b.prOpened=true;b.currentHeadSha=sha;b.pr={number:3,author:'Jamie',base:'main',compare:'feature/jamie-budget',title:'修正攤位費格式',body:'Please review the budget correction.',status:'open',diff:[['budget-line','-','攤位費：5000'],['context',' ','總預算將於下個版本確認。']]};b.diffViewedSha=null;challengeRecord('teammate_pr_opened',{sha});save();topNow()}
function challengeMissionB(stage){const c=state.challenge,b=c.missionB,d=c.drafts;if(stage===9)return challengeShell(`<div class="notice"><b>${tx('任務 B：扮演 Reviewer','Task B: act as the reviewer')}</b><p>${tx('Jamie 的 PR 還沒開啟。先開啟隊友 PR，再查看 Files changed。','Jamie’s PR is ready. Open the teammate PR, then view Files changed.')}</p><button class="btn primary" onclick="challengeOpenTeammatePR()">Open teammate PR</button></div>`);if(stage===10)return challengeShell(b.diffViewedSha===b.currentHeadSha?challengeBReviewView(false):challengeInitialDiffGate());if(stage===11)return challengeShell(challengeBReviewView(true));if(stage===12)return challengeShell(`<div class="review-box"><span class="status-badge orange">${tx('已送出 Request changes','Request changes submitted')}</span><h2>${tx('Jamie 建立了新的 Commit','Jamie created a new commit')}</h2><p>${tx('系統會模擬 Jamie 依照你的留言修改 Branch。按下按鈕查看修正紀錄後，PR 會出現新的 Commit。','The system simulates Jamie editing the Branch from your feedback. View the fix record to see the new commit on the PR.')}</p><button class="btn primary" onclick="challengeApplyJamieFix()">${tx('查看 Jamie 的修正紀錄','View Jamie’s fix record')}</button></div>`);if(stage===13)return challengeShell(challengeLatestDiffView());if(stage===14)return challengeShell(`<div class="review-box"><span class="status-badge green">${tx('修正已確認','Fix verified')}</span><p>${tx('最近查看的 SHA：','Latest reviewed SHA:')} <code>${esc(b.latestDiffViewedSha)}</code></p><button class="btn blue" onclick="challengeApproveTeammate()">${tx('Approve 最近查看的 Commit','Approve latest reviewed commit')}</button></div>`);if(stage===15)return challengeShell(`<div class="review-box"><span class="status-badge green">Approved</span><h2>${tx('Jamie 的 PR','Jamie’s PR')}</h2><p>${tx('現在可以 Merge。Merge 只會把修改合進 main，不會自動把 Project 卡片移到 Done。','You may merge now. Merge brings the change into main but does not automatically move the Project card to Done.')}</p><button class="btn primary" onclick="challengeMergeTeammate()">Merge pull request</button></div>`);if(stage===16)return challengeShell(challengeProjectDoneView());if(stage===17)return challengeShell(challengeUnderstandingView());return challengeShell(challengeComplete())}
function challengeInitialDiffGate(){const b=state.challenge.missionB;return `<div class="review-box"><span class="status-badge green">Open #${b.pr.number}</span><p>${tx('這個 PR 已有 head SHA，但你還沒打開它對應的 Diff。','The PR has a head SHA, but you have not opened its Diff yet.')}</p><button class="btn primary" onclick="challengeViewInitialDiff()">${tx('查看目前的 Files changed','Open current Files changed')}</button></div>`}
function challengeViewInitialDiff(){const b=state.challenge.missionB;b.diffViewedSha=b.currentHeadSha;challengeRecord('initial_diff_viewed',{sha:b.currentHeadSha});save();topNow()}
function challengeBReviewView(withForm){const b=state.challenge.missionB,d=state.challenge.drafts;const reviewForm=withForm?"<div class='field'><label for='b-review-comment'>"+tx("Review 留言","Review comment")+"</label><textarea id='b-review-comment' class='textarea' oninput='draftChallenge(\"reviewComment\",this.value)' placeholder='"+plain("請說明哪一行有問題、少了什麼，以及建議怎麼改。","Explain what is wrong, what is missing, and what the author should change.")+"'>"+esc(d.reviewComment)+"</textarea></div><button class='btn primary' onclick='challengeSubmitBReview()'>Request changes</button>":"<p class='field-help'>"+tx("選出正確的行和問題類型後，才能留下 Review。","Select the correct line and issue category to unlock the review form.")+"</p>";return "<div class='gh-toolbar'><span class='status-badge green'>Open #"+b.pr.number+"</span><span>head SHA: <code>"+esc(b.currentHeadSha)+"</code></span></div><h2>"+esc(b.pr.title)+"</h2><p>"+tx("先選出真的有問題的那一行，再選擇問題類型。","Select the line with the real problem, then choose the issue type.")+"</p><div class='diff diff-scroll'>"+b.pr.diff.map(([id,sign,line])=>challengeDiffLine(id,sign,line,b.selectedDiffLine===id)).join("")+"</div><p>"+tx("已選取的行：","Selected line:")+" <b>"+esc(b.selectedDiffLine||"none")+"</b></p><div class='field'><label for='b-issue-category'>"+tx("問題類型","Issue category")+"</label><select id='b-issue-category' class='select' onchange='challengeSetBCategory(this.value)'><option value=''>"+tx("選擇問題類型","Choose category")+"</option><option value='missing-currency'"+(b.issueCategory==="missing-currency"?" selected":"")+">"+tx("缺少幣別和單位","Missing currency and unit")+"</option><option value='spelling'"+(b.issueCategory==="spelling"?" selected":"")+">"+tx("拼字","Spelling")+"</option><option value='style'"+(b.issueCategory==="style"?" selected":"")+">"+tx("只有格式問題","Style only")+"</option></select></div>"+reviewForm+"</div>";}
function challengeSelectDiffLine(id){state.challenge.missionB.selectedDiffLine=id;persist();draw()}
function challengeSelectLatestDiffLine(id){state.challenge.missionB.latestDiffLine=id;persist();draw()}
function challengeSetBCategory(value){state.challenge.missionB.issueCategory=value;save()}
function challengeSubmitBReview(){const c=state.challenge,b=c.missionB,comment=c.drafts.reviewComment.trim(),generic=['請修改','有問題','錯了','不正確','改一下'];if(b.diffViewedSha!==b.currentHeadSha||b.selectedDiffLine!=='budget-line'||b.issueCategory!=='missing-currency'){challengeFailure(['Review 證據不足','Review evidence is incomplete'],['請在目前 head SHA 的 Diff 選正確錯誤行，並選擇「Missing currency and unit」。','On the current head SHA, select the correct bad line and choose “Missing currency and unit”.']);return}if(comment.length<12||generic.includes(comment)){challengeFailure(['Review 留言太籠統','Review comment is too vague'],['請指出哪一行、少了什麼，以及要怎麼改；只寫「有問題」不夠具體。','Point to the line, say what is missing, and explain how to fix it; “there is a problem” is not specific enough.']);return}b.reviewComment=comment;b.changesRequested=true;challengeRecord('review_submitted',{line:b.selectedDiffLine,category:b.issueCategory,comment});save();topNow()}
function challengeApplyJamieFix(){const c=state.challenge,b=c.missionB;if(!b.changesRequested)return;b.jamieFixCommitSha=uid();b.jamieFixEventRead=true;b.currentHeadSha=b.jamieFixCommitSha;b.pr.diff=[['budget-line','+','攤位費：新台幣 5,000 元'],['context',' ','總預算將於下個版本確認。']];b.latestDiffViewedSha=null;b.latestDiffLine=null;b.fixVerified=false;b.approved=false;b.reviewedSha=null;challengeRecord('jamie_fix_commit_created',{sha:b.jamieFixCommitSha,previousSha:b.diffViewedSha});save();topNow()}
function challengeLatestDiffView(){const b=state.challenge.missionB;return `<div class="review-box"><span class="status-badge orange">New commit: ${esc(b.jamieFixCommitSha)}</span><p>${tx('這是新的 head；舊 Diff 和舊核准都不再代表目前內容。','This is a new head; the old Diff and approval no longer represent the current content.')}</p>${!b.latestDiffViewedSha?`<button class="btn primary" onclick="challengeViewLatestDiff()">${tx('查看最新的 Files changed','Open latest Files changed')}</button>`:`<div><p>${tx('最新 Diff 的 SHA：','Latest Diff SHA:')} <code>${esc(b.latestDiffViewedSha)}</code></p><div class="diff diff-scroll">${b.pr.diff.map(([id,sign,line])=>challengeDiffLine(id,sign,line,b.latestDiffLine===id,'challengeSelectLatestDiffLine')).join('')}</div><p>${tx('已選取的行：','Selected line:')} <b>${esc(b.latestDiffLine||'none')}</b></p><div class="field"><label for="b-fix-confirmation">${tx('確認修正','Verification')}</label><select id="b-fix-confirmation" class="select" onchange="challengeSetFixConfirmation(this.value)"><option value="">${tx('選擇確認結果','Choose verification')}</option><option value="fixed" ${b.fixConfirmation==='fixed'?'selected':''}>${tx('幣別和單位都已寫清楚','The currency and unit are now explicit')}</option><option value="not-fixed" ${b.fixConfirmation==='not-fixed'?'selected':''}>${tx('問題還在','The problem remains')}</option></select></div><button class="btn primary" onclick="challengeConfirmFix()">${tx('確認修正完成','Confirm the fix')}</button></div>`}</div>`}

function challengeUnderstandingView(){const u=state.challenge.missionB.understanding;return `<div class="understanding-grid"><article class="understanding-card"><h2>${tx('理解檢查','Understanding check')}</h2><p>${tx('請根據情境選答案，再用自己的話說明原因。不要只背定義。','Choose an answer for each scenario and explain why in your own words. Do not just memorize definitions.')}</p>${challengeUnderstandingSelect('u-q1','q1',u.q1,'你在 main 上修改檔案並按下儲存，但還沒有建立 Commit。哪一個動作，才會留下隊友查得到的版本紀錄？',['','Commit','Project status'],['選擇','Commit','Project status'])}${challengeUnderstandingReason('u-r1','r1',u.r1,'請說明你的判斷。')} </article><article class="understanding-card">${challengeUnderstandingSelect('u-q2','q2',u.q2,'PR 建立後，作者又建立了一個新的修正 Commit。你已經看過舊 Diff，現在可以直接 Approve 嗎？',['','review-again','approve-old'],['選擇','先查看最新 Diff','直接 Approve'])}${challengeUnderstandingReason('u-r2','r2',u.r2,'為什麼？')}</article><article class="understanding-card">${challengeUnderstandingSelect('u-q3','q3',u.q3,'PR 因為包含 Closes #1 而合併後，Issue 已關閉，但 Project 卡片仍在 In progress。這代表什麼？',['','different','same'],['選擇','兩者是不同狀態，Project 要依流程更新','Issue 關閉會自動代表 Project Done'])}${challengeUnderstandingReason('u-r3','r3',u.r3,'請用這次流程說明。')}<button class="btn primary" onclick="challengeSubmitUnderstanding()">${tx('送出理解檢查','Submit understanding check')}</button></article></div>`}

function extensionModal(){const e=state.extension||{},lesson=extLessons[e.step||0];return `<div class="modal-wrap"><div class="modal" style="max-width:960px"><div class="modal-head"><h2>${tx('Git 指令延伸課','Git command extension')}</h2><button class="modal-close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="notice"><b>${tx('主課程已完成。','The core course is complete.')}</b> ${tx('現在才引入本機、遠端與 push，避免初學時混淆。','Local, remote, and push are introduced only now to avoid early confusion.')}</div><div class="section-head"><h2>${e.step+1} / ${extLessons.length} · ${tx(lesson[0],lesson[1])}</h2><p>${tx('建議指令','Suggested commands')}</p></div><pre class="card" style="padding:13px;overflow:auto">${esc(lesson[2])}</pre><div class="terminal"><div class="terminal-head">Terminal</div><div class="terminal-output" id="ext-out">${(e.lines||[]).map(x=>`<div class="${x.kind||''}">${esc(x.text)}</div>`).join('')}</div><div class="terminal-row"><span class="prompt">alex@laptop:${esc(e.cwd||'~')}$</span><input id="ext-input" onkeydown="if(event.key==='Enter')runExt()" placeholder="git status"><button class="btn primary" onclick="runExt()">Enter</button></div></div><div class="btn-row" style="margin-top:14px"><button class="btn" onclick="extStep(-1)" ${e.step===0?'disabled':''}>${tx('上一課','Previous lesson')}</button><button class="btn blue" onclick="extStep(1)" ${e.step===extLessons.length-1?'disabled':''}>${tx('下一課','Next lesson')}</button></div></div></div></div>`}

function runExt(){const e=state.extension,input=document.getElementById('ext-input')?.value.trim();if(!input)return;e.lines.push({kind:'cmd',text:'$ '+input});let out='';if(input==='help')out='git --version | git config | git init | git status | git add . | git commit -m "..." | git remote add origin URL | git push | git switch -c NAME | git diff | git log --oneline | git pull | git restore | git revert';else if(input==='git --version')out='git version 2.48.1';else if(input.startsWith('git config'))out='設定已儲存';else if(input.startsWith('mkdir ')){e.cwd='~/'+input.slice(6);out='資料夾已建立'}else if(input.startsWith('cd ')){e.cwd='~/'+input.slice(3);out='已切換資料夾'}else if(input==='git init'){e.repo=true;out='Initialized empty Git repository'}else if(input==='git status')out=e.committed?'nothing to commit, working tree clean':e.staged?'Changes to be committed':'Untracked files: project files';else if(input==='git add .'){e.staged=true;out='已將目前修改加入暫存區'}else if(input.startsWith('git commit -m')){if(!e.staged)out='error: nothing added to commit';else{e.committed=true;e.staged=false;out='[main a1b2c3d] '+(input.match(/"(.+)"/)?.[1]||'commit')}}else if(input.startsWith('git remote add origin')){e.remote=true;out='遠端 origin 已設定'}else if(input.startsWith('git push')){if(!e.remote||!e.committed)out='error: 請先建立 Commit 並設定 remote';else{e.pushed=true;out='main -> origin/main'}}else if(input.startsWith('git switch -c ')){e.branch=input.slice(14);out='Switched to a new branch '+e.branch}else if(input==='git diff')out='diff --git a/file.md b/file.md\n+ 新增競爭者分析';else if(input==='git log --oneline')out=e.committed?'a1b2c3d 建立個案競賽專案':'尚未有 Commit';else if(input.startsWith('git switch main')){e.branch='main';out='Switched to branch main'}else if(input.startsWith('git pull'))out='Already up to date.';else if(input.startsWith('git restore'))out='工作目錄檔案已還原';else if(input.startsWith('git revert'))out='建立一筆反向 Commit，保留歷史';else out='找不到指令。輸入 help 查看支援的教學指令。';e.lines.push({kind:out.startsWith('error')?'err':'ok',text:out});save();setTimeout(()=>{const x=document.getElementById('ext-out');if(x)x.scrollTop=x.scrollHeight},0)}

function scenarioInsight(id){if(!id)return `<div class="diagnosis-insight" aria-live="polite"><p>${tx('選擇一張問題卡，這裡會顯示它對專案造成的實際影響。','Choose a problem card to see its concrete impact on the project.')}</p></div>`;const p=pains.find(x=>x.id===id),impacts={owner:['工作可能被所有人以為「別人會做」，最後無人交付。','Everyone may assume someone else will do it, leaving the task unfinished.'],version:['組長必須人工比對，而且可能把舊資料當成正式內容。','The lead must compare files manually and may adopt outdated content.'],collision:['兩人的修改互相覆蓋，正確日期也無法可靠確認。','Edits overwrite one another, so the correct date cannot be verified.'],review:['錯誤會直接進入最後成果，可能直到交件後才被發現。','Errors can reach the final deliverable and remain unnoticed until submission.'],progress:['截止前無法判斷瓶頸，也無法及時調整分工。','The team cannot identify bottlenecks or rebalance work before the deadline.']};return `<article class="diagnosis-insight" aria-live="polite"><div class="diagnosis-insight-head"><h3>${tx(...p.title)}</h3><span class="status-badge orange">${tx('問題影響','Impact')}</span></div><p>${tx(...impacts[id])}</p><p><b>${tx('重點：','Takeaway:')}</b> ${tx('真正要修正的是協作規則，不是再發明一個「最終版」檔名。','The collaboration process—not another “final” filename—needs to change.')}</p></article>`}

function conceptMapping(p){const key=resolveTermKey(p.term),term=terms[key];if(!term)return'';return `<article class="concept-mapping"><span class="concept-code">MATCH</span><div><h3>${esc(term.en)}｜${esc(term.zh)}</h3><p>${tx(esc(term.descZh),esc(term.descEn))}</p></div></article>`}
function gitRelation(){return `<div class="git-relation"><article class="relation-card"><h3>Git</h3><p>${tx('Git 會記錄檔案怎麼改、什麼時候改。這門課先用網頁操作，指令之後再學。','Git records what changed in a file and when. This course starts with the web; commands come later.')}</p></article><article class="relation-card"><h3>GitHub</h3><p>${tx('GitHub 把 Repository、Issue、Project、Pull Request 和 Review 集中在同一個協作網站裡。','GitHub brings repositories, issues, projects, pull requests, and reviews together in one collaboration site.')}</p></article></div>`}
function redesignThinkingPage(){const current=pains.find(p=>p.id===state.thinkingCurrent),done=Object.keys(state.thinking).length===pains.length,content=`${stageHeading('STAGE 2 · GUIDED THINKING',tx('先搞清楚需要什麼，再認識工具。','Clarify the need before learning the tool.'),tx('請判斷每個問題需要哪種協作能力；答對後，你就會看到對應的 GitHub 功能。','Decide which collaboration capability each problem needs; the matching GitHub feature appears after a correct answer.'),Math.min(Math.max(Object.keys(state.thinking).length-1,0),pains.length-1),pains.length)}<div class="mapping-workbench"><nav class="problem-index card" aria-label="${plain('合作問題清單','Collaboration problem list')}">${pains.map((p,i)=>`<button class="${state.thinkingCurrent===p.id?'active':''} ${state.thinking[p.id]?'done':''}" onclick="selectThinking('${p.id}')"><span class="index-state">${state.thinking[p.id]?'✓':i+1}</span><span><b>${tx(...p.title)}</b><small>${state.thinking[p.id]?tx(...p.need):tx('還沒完成','Not matched')}</small></span></button>`).join('')}</nav><section class="decision-canvas card"><span class="status-badge">${tx('現在看的問題','Current problem')}</span><h2>${tx(...current.title)}</h2><p>${tx(...current.body)}</p><div class="decision-question"><b>${tx('這個小組最需要什麼？','What does this team need most?')}</b></div><div class="need-options">${shuffleNeeds(current.id).map((n,i)=>`<button class="need-option ${state.thinking[current.id]&&n.id===current.id?'correct':''}" ${state.thinking[current.id]?'disabled':''} aria-pressed="${state.thinking[current.id]&&n.id===current.id}" onclick="answerNeed('${current.id}','${n.id}')"><span class="sr-only">${String.fromCharCode(65+i)}. </span><b>${tx(...n.need)}</b></button>`).join('')}</div></section></div>`;const learned=pains.filter(p=>state.thinking[p.id]).map(p=>resolveTermKey(p.term));return redesignPage(content,['Git','GitHub',...learned],redesignActionBar('gotoPhase(1)',done?'unlock(3)':null,tx('觀看完整示範','Watch the complete demonstration')))}

function demoChapterInfo(index){const groups=[];demoSteps.forEach((step,i)=>{const name=step.group[0];let group=groups.find(x=>x.name===name);if(!group){group={name,labels:step.group,indexes:[]};groups.push(group)}group.indexes.push(i)});const currentGroup=groups.find(x=>x.indexes.includes(index));return {groups,currentGroup,chapter:groups.indexOf(currentGroup),local:currentGroup.indexes.indexOf(index),total:currentGroup.indexes.length}}
function redesignDemoPage(){const i=state.demo.index,s=demoSteps[i],chapter=demoChapterInfo(i),content=`${stageHeading(`STAGE 3 · ${tx('完整示範','FULL DEMONSTRATION')}`,tx(`3.${chapter.chapter+1} ${s.group[0]}`,`3.${chapter.chapter+1} ${s.group[1]}`),tx('系統會逐步操作右側 GitHub 模擬器。橘色框只標示這一步要看的位置；這一階段不能操作。','The system operates the GitHub simulator. The orange frame marks what to watch; this stage is view-only.'),chapter.local,chapter.total)}<div class="course-workbench"><aside class="task-console card"><div class="task-console-header"><span class="status-badge purple">${tx('系統示範中','System demo')} · ${i+1}/${demoSteps.length}</span><h2>${tx(...s.title)}</h2></div><div class="task-section"><div class="task-label">${tx('這一步在做什麼','What happens now')}</div><p>${tx(...s.action)}</p></div><div class="task-section"><div class="task-label">${tx('這一步看哪裡','Where to look')}</div><p>${tx('看右側橘色框標出的按鈕、欄位或資料；這裡先不用操作。','Look at the control, field, or data outlined in orange; do not interact yet.')}</p></div><div class="task-section"><div class="task-label">${tx('完成後會怎樣','What happens next')}</div><p>${tx(...s.result)}</p></div><div class="task-console-actions"><button class="btn" onclick="demoPrev()" ${i===0?'disabled':''}>${tx('上一步','Previous step')}</button><button class="btn" onclick="toggleDemoAuto()">${state.demo.auto?tx('暫停','Pause'):tx('自動播放','Auto play')}</button><button class="btn primary" onclick="demoNext()">${i===demoSteps.length-1?tx('完成示範','Finish demo'):tx('下一步','Next step')}</button></div></aside><section class="workspace-surface"><div class="demo-shield" aria-label="${plain('僅供示範，無法操作','Demonstration only')}"></div>${renderDemoGithub(i)}</section></div>`;return redesignPage(content,['GitHub','Repository','main',resolveTermKey(s.term)],redesignActionBar('gotoPhase(2)',state.demo.played?'unlock(4)':null,tx('開始引導練習','Start guided practice')))}

function redesignPracticeWorkspace(){if(!state.practice.predictionOK)return `<div class="workspace-lock"><div class="workspace-lock-inner"><span class="workspace-lock-label">${tx('先想再操作','THINK BEFORE CLICKING')}</span><h2>${tx('操作區尚未解鎖','Workspace locked')}</h2><p>${tx('先完成左側的情境判斷。答對後，GitHub 模擬器會在這裡開啟。','Complete the scenario judgment on the left. The GitHub simulator opens here after a correct answer.')}</p></div></div>`;return renderPracticeWorkspace()}
function redesignPracticePage(){const p=state.practice,m=practiceMeta[p.step],content=`${stageHeading('STAGE 4 · GUIDED PRACTICE',tx(`4.${p.step+1} ${m.title[0]}`,`4.${p.step+1} ${m.title[1]}`),tx('先想、再操作 GitHub 模擬器；需要時再看提示。做錯時，請看清楚後果並回頭修正。','Predict, operate the GitHub simulator, and use hints when needed. When something goes wrong, read the consequence and fix it.'),p.step,practiceMeta.length)}<div class="course-workbench"><aside class="task-console card"><div class="task-console-header"><span class="status-badge purple">${tx('目前任務','Current task')} · ${p.step+1}/${practiceMeta.length}</span><h2>${tx(...m.title)}</h2></div><div class="task-section"><div class="task-label">${tx('任務目標','Objective')}</div><p>${tx(...m.mission)}</p></div><div class="task-section"><div class="task-label">${tx('操作前先想一想','Predict before acting')}</div><p>${tx(...m.q)}</p><div class="predict">${m.opts.map(o=>`<button class="predict-option ${p.prediction===o[0]?(p.predictionOK?'correct':'wrong'):''}" onclick="practicePredict('${esc(o[0])}')">${tx(o[0],o[1])}</button>`).join('')}</div></div>${p.predictionOK?`<div class="task-section"><button class="btn" onclick="nextHint()">${tx(`展開提示 ${p.hint}/3`,`Show hint ${p.hint}/3`)}</button>${p.hint?`<div class="hint-box">${practiceHint(p.step,p.hint)}</div>`:''}</div>`:''}</aside><section class="workspace-surface">${p.error?practiceError(p.error):''}${redesignPracticeWorkspace()}${p.result?practiceResult():''}</section></div>`;const canContinue=p.step===practiceMeta.length-1&&p.result&&p.reflection==='ok';return redesignPage(content,[resolveTermKey(m.term),'main','Commit','Review'].filter(k=>terms[k]),redesignActionBar('gotoPhase(3)',canContinue?'unlock(5)':null,tx('進入獨立挑戰','Start independent challenge')))}

function challengeTermKeys(stage){if(stage<=1)return ['Repository','Commit'];if(stage===2)return ['Issue'];if(stage===3)return ['Project','Issue'];if(stage<=5)return ['Branch','main','Commit'];if(stage<=8)return ['PR','Review','Merge'];if(stage<=15)return ['PR','Review','Commit'];return ['Merge','Issue','Project']}
function redesignChallengePage(){const stage=challengeStage(),names=challengeStepNames(),complete=state.challenge.done,currentName=stage===18?tx('挑戰完成','Challenge complete'):tx(...names[stage]),content=`${stageHeading('STAGE 5 · INDEPENDENT CHALLENGE',tx(`5.${Math.min(stage+1,18)} ${stage===18?'完成獨立挑戰':names[stage][0]}`,`5.${Math.min(stage+1,18)} ${stage===18?'Challenge complete':names[stage][1]}`),tx('先完成自己的 PR，再審查隊友的 PR。新 Commit 會改變 head；每次都要重新查看最新 Diff，才可以 Approve 和 Merge。','Complete your own PR, then review a teammate PR. Every new commit changes the head, so reopen the latest Diff before approving or merging.'),Math.min(stage,17),18)}<div class="course-workbench"><aside class="task-console card"><div class="task-console-header"><span class="status-badge purple">${tx('獨立任務','Independent task')} · ${Math.min(stage+1,18)}/18</span><h2>${currentName}</h2><div class="challenge-role"><b>Alex</b><span>${tx('你扮演 Alex，Jamie 由系統模擬。','You act as Alex; Jamie is simulated.')}</span></div></div><div class="task-section"><div class="task-label">${tx('成功條件','Success criteria')}</div>${challengeObjective(stage)}</div><div class="task-section"><div class="task-label">${tx('流程限制','Workflow constraint')}</div><p>${tx('不能跳過最新 Diff、直接 Approve，或只照按鈕順序亂點。Project 狀態要手動確認；Issue 只有在含 Closes #1 的 PR 合併到 main 後才會關閉。','You cannot skip the latest Diff, approve directly, or pass by clicking buttons in order. Project status must be checked manually; the Issue closes only after a PR containing Closes #1 merges into main.')}</p></div><details class="challenge-evidence"><summary>${tx('查看證據狀態','View evidence state')}</summary>${challengeStatusList()}</details></aside><section class="workspace-surface">${challengeErrorBox()}${renderChallengeGithub()}</section></div>`;return redesignPage(content,challengeTermKeys(stage),redesignActionBar('gotoPhase(4)',null,complete?tx('課程已完成','Course complete'):tx('完成目前任務','Complete current task'),false))}

function draw(){const app=document.getElementById('app');const content=state.phase===1?redesignScenarioPage():state.phase===2?redesignThinkingPage():state.phase===3?redesignDemoPage():state.phase===4?redesignPracticePage():redesignChallengePage();app.innerHTML=redesignHeader()+`<div class="course-shell">${redesignCourseRail()}<div class="course-content">${content}</div></div>`+modalView();requestAnimationFrame(()=>{if(state.modal){const first=document.querySelector('.modal button,.modal input,.modal textarea,.modal select');if(first)first.focus();return}if(focusRequested){const heading=document.querySelector('main h1,main h2');if(heading){heading.setAttribute('tabindex','-1');heading.focus()}focusRequested=false}})}
document.addEventListener('keydown',event=>{if(state.modal){if(event.key==='Escape'){event.preventDefault();closeModal();return}if(event.key==='Tab'){const focusable=[...document.querySelectorAll('.modal button:not([disabled]),.modal input:not([disabled]),.modal textarea:not([disabled]),.modal select:not([disabled])')];if(!focusable.length)return;const first=focusable[0],last=focusable[focusable.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}return}if(state.termsOpen){if(event.key==='Escape'){event.preventDefault();closeScenarioGlossary();return}if(event.key==='Tab'){const focusable=[...document.querySelectorAll('#scenario-glossary-drawer button:not([disabled])')];if(!focusable.length)return;const first=focusable[0],last=focusable[focusable.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}}})
draw();

function scenarioBubble(id,problemId,author,body,self=false,normal=false){const found=problemId&&state.scenarioFound.includes(problemId),wrong=state.scenarioWrong===id;return `<button type="button" class="scenario-message ${self?'self ':''}${found?'found ':''}${wrong?'wrong':''}" onclick="inspectScenarioBubble('${id}','${problemId||''}')" aria-pressed="${!!found}"><span class="scenario-message-author">${author}</span><span class="scenario-message-body">${body}</span><span class="scenario-message-cue" aria-hidden="true">${found?'✓':normal?tx('普通訊息','Normal'):tx('點一下查看','Tap to inspect')}</span></button>`}
function scenarioFilesMarkup(){return `<span class="scenario-file-stack"><span class="scenario-file"><span class="file-type">DOCX</span><span>${tx('市集企劃書_最新版.docx','market_proposal_latest.docx')}</span></span><span class="scenario-file"><span class="file-type">DOCX</span><span>${tx('市集企劃書_最新版_志豪改.docx','market_proposal_latest_ZhiHao.docx')}</span></span><span class="scenario-file"><span class="file-type">DOCX</span><span>${tx('市集企劃書_真的最終版2.docx','market_proposal_REAL_final_2.docx')}</span></span></span>`}
function scenarioChatMarkup(){return `<div class="scenario-device"><div class="scenario-device-top" aria-hidden="true"><span class="scenario-device-camera"></span><span class="scenario-device-speaker"></span></div><section class="scenario-phone" aria-label="${plain('互動式手機對話','Interactive phone conversation')}"><div class="scenario-phone-head"><span>${tx('校園永續市集｜期末專案','Campus Market | Final Project')}</span><span>${tx('4 人','4 members')}</span></div><div class="conversation scenario-conversation">${scenarioBubble('brief',null,tx('小安｜組長','Xiao-An | Lead'),tx('教授說除了企劃書，還要交活動網站。大家做完就丟群組。','The professor also wants a website. Send your work to the group when done.'),true)}${scenarioBubble('competitor',null,'Alex',tx('我先找競品資料，晚點傳。','I will research competitors and send it later.'),false,true)}${scenarioBubble('owner','owner',tx('佳芸','Jia-Yun'),tx('有人可以處理社群文案嗎？','Can someone handle the social copy?'))}${scenarioBubble('version-note','version',tx('志豪','Zhi-Hao'),tx('我改了預算，但不確定用哪一份企劃書。','I updated the budget, but I am not sure which proposal file to use.'))}${scenarioBubble('version-files','version',tx('小安','Xiao-An'),scenarioFilesMarkup(),true)}${scenarioBubble('review','review',tx('志豪','Zhi-Hao'),tx('預算少了幣別，但我先放進最後版本，應該沒問題。','The budget is missing a currency unit, but I put it in the final version. It should be fine.'))}${scenarioBubble('normal','',tx('佳芸','Jia-Yun'),tx('大家辛苦了，我們先休息一下。','Everyone worked hard. Let’s take a break.'),false,true)}${scenarioBubble('collision-a','collision',tx('佳芸','Jia-Yun'),tx('我把活動日期改成 11/16 了。','I changed the event date to Nov 16.'))}${scenarioBubble('collision-b','collision','Alex',tx('教授公告是 11/23 吧？我也改了網站。','Wasn’t the announced date Nov 23? I also edited the website.'))}${scenarioBubble('progress','progress',tx('小安','Xiao-An'),tx('所以現在誰完成了？哪份要交？','So who has finished, and which file do we submit?'),true)}</div></section><div class="scenario-device-home" aria-hidden="true"></div></div>`}
function inspectScenarioBubble(bubbleId,problemId){if(!problemId){state.scenarioWrong=bubbleId;state.scenarioSelected=null;save();window.setTimeout(()=>{if(state.phase===1&&state.scenarioWrong===bubbleId){state.scenarioWrong='';save()}},620);return}state.scenarioWrong='';state.scenarioSelected=problemId;if(!state.scenarioFound.includes(problemId))state.scenarioFound.push(problemId);save()}
function scenarioFeedback(){if(state.scenarioWrong)return `<p class="scenario-feedback wrong" role="alert">${tx('這句只是一般對話，不是問題線索。再找找看。','This is an ordinary message, not a problem clue. Keep looking.')}</p>`;return''}
function scenarioImpactText(id){const impacts={owner:['工作可能被所有人以為「別人會做」，最後無人交付。','Everyone may assume someone else will do it, leaving the task unfinished.'],version:['組長必須人工比對，而且可能把舊資料當成正式內容。','The lead must compare files manually and may adopt outdated content.'],collision:['兩人的修改互相覆蓋，正確日期也無法可靠確認。','Edits overwrite one another, so the correct date cannot be verified.'],review:['錯誤會直接進入最後成果，可能直到交件後才被發現。','Errors can reach the final deliverable and remain unnoticed until submission.'],progress:['截止前無法判斷瓶頸，也無法及時調整分工。','The team cannot identify bottlenecks or rebalance work before the deadline.']};return impacts[id]||['','']}
function scenarioCollectionCard(p,i){const found=state.scenarioFound.includes(p.id),impact=scenarioImpactText(p.id);return `<article class="scenario-collection-card ${found?'unlocked':''}" aria-label="${found?plain(...p.title):plain(`問題 ${i+1} 尚未解鎖`,`Problem ${i+1} locked`)}">${found?`<div class="scenario-card-state">✓ ${tx('已解鎖','Unlocked')}</div><h3>${tx(...p.title)}</h3><p>${tx(...impact)}</p>`:`<div class="scenario-lock-mark" aria-hidden="true">${tx('尚未解鎖','Locked')}</div><h3>${tx(`問題 ${i+1} 尚未解鎖`,`Problem ${i+1} is locked`)}</h3><p>${tx('回到聊天裡，找出能說明合作出了問題的訊息。','Return to the chat and find the message that shows a collaboration problem.')}</p>`}</article>`}
function toggleScenarioGlossary(){if(state.termsOpen){closeScenarioGlossary();return}state.termsOpen=true;save();requestAnimationFrame(()=>document.querySelector('.scenario-glossary-close')?.focus())}
function closeScenarioGlossary(){if(!state.termsOpen)return;state.termsOpen=false;save();requestAnimationFrame(()=>document.querySelector('.scenario-glossary-toggle')?.focus())}

    const raw=localStorage.getItem(STORE),x=raw?JSON.parse(raw):null;
    if(x&&(Number(x.version)===VERSION||Number(x.version)===VERSION-1)){

function appendLearningEvent(event){

  state.learningEvidence.events=[...(state.learningEvidence.events||[]),e].slice(-200);

}
function recordLearningEvent(event){appendLearningEvent(event);persist()}

  }catch(e){}
}
function save(render=true){

    const signature=JSON.stringify([p.step,p.error.type,p.error.title,p.error.body]);
    if(p._lastErrorSignature!==signature){
      appendLearningEvent({stage:4,concept:reviewConceptForPracticeStep(p.step),action:'operation-error',itemId:'practice-step-'+p.step});

function reviewConceptForProblem(id){
  if(id==='owner'||id==='progress')return 'workTracking';
  if(id==='review')return 'prMergeGate';

}
function reviewConceptForPracticeStep(step){
  const term=practiceMeta[step]?.term||'';
  if(term==='Issue'||term==='Project')return 'workTracking';
  if(term==='PR'||term==='Review'||term==='Merge')return 'prMergeGate';
  return 'versionRelations';
}
function reviewWeakness(evidence){
  const e=evidence||baseLearningEvidence(),score={versionRelations:0,prMergeGate:0,workTracking:0};
  score.versionRelations=Math.min(2,Number(e.stage1?.wrongBubbleClicks)||0);
  Object.entries(e.stage2?.byProblem||{}).forEach(function(pair){const id=pair[0],s=pair[1]||{},d=reviewConceptForProblem(id);score[d]+=Math.min(4,(Number(s.wrong)||0)*2)});
  Object.entries(e.stage4?.byStep||{}).forEach(function(pair){
    const s=pair[1]||{},d=reviewConceptForPracticeStep(Number(pair[0])),wrong=Number(s.wrongPredictions)||0,errors=Array.isArray(s.operationErrors)?s.operationErrors.length:0,hints=Math.min(Number(s.hintsUsed)||0,3);
    score[d]+=Math.min(6,wrong*2+errors*3+hints);
    if((Number(s.predictionAttempts)||0)>0&&!wrong&&!errors&&!hints)score[d]=Math.max(0,score[d]-2);
  });
  return score;
}
function buildReviewRoute(evidence){

  const repairs=priority.filter(function(d){return score[d]>=3}).slice(0,2);
  const route=['footprint','version','pr','tracking','explain','report'];
  repairs.forEach(function(d){const page=d==='versionRelations'?'version-repair':d==='prMergeGate'?'pr-repair':'tracking-repair';const after=d==='versionRelations'?'version':d==='prMergeGate'?'pr':'tracking';route.splice(route.indexOf(after)+1,0,page)});
  return route;
}

    r.route=buildReviewRoute(e);
    r.sourceEvidenceRevision=e.revision;
    r.cursor=Math.min(r.cursor,r.route.length-1);

function reviewPage(){const r=ensureReviewRoute();return r.route[r.cursor]||'footprint'}
function reviewPageDomain(page){if(page.indexOf('version')===0)return 'versionRelations';if(page.indexOf('pr')===0)return 'prMergeGate';if(page.indexOf('tracking')===0)return 'workTracking';if(page==='explain')return 'explanation';return null}

function reviewDomainStatus(domain){

function reviewTextLooksInvalid(value){
  const normalized=String(value||'').replace(/\s+/g,'').trim();
  if(normalized.length<20)return true;
  if(/^(.)\1+$/.test(normalized))return true;
  if(normalized.length>8&&new Set(normalized.split('')).size<=3)return true;
  return false;
}
function reviewValidateExplanation(){

}

  state.practice.predictionOK=false;

}
function reviewReportReturnButton(domain,result){
  if(result!=='needs-review')return '';
  return '<div class="review-result-actions"><button type="button" class="btn" onclick="reviewReturnToDomain(\''+domain+'\')">'+reviewReportLink(domain)+'</button></div>'
}
function reviewResultCard(domain,title,description){
  const result=state.review.domainResults[domain]||'needs-review',labels={mastered:['已掌握','Mastered'],clarified:['已釐清','Clarified'],'needs-review':['建議回顧','Review again'],unassessed:['尚未完成','Not assessed']},label=labels[result]||labels['needs-review'];
  return '<article class=\"review-result '+(result==='needs-review'?'needs-review':result)+'\"><h3>'+title+' <span class=\"review-domain-status\">'+tx(...label)+'</span></h3><p>'+description+'</p>'+reviewReportReturnButton(domain,result)+'</article>';
}
function reviewReportView(){
  const r=state.review;
  const body='<div class=\"review-result-grid\">'+reviewResultCard('versionRelations',tx('版本與分支','Versions and branches'),tx('Repository、main、Branch、Commit、普通儲存、Upload files 與 Push。','Repository, main, Branch, Commit, saving, Upload files, and Push.'))+reviewResultCard('prMergeGate',tx('審查與合併','Review and merge'),tx('最新 Diff、Review、Request changes、Approve 與 Merge。','Latest Diff, Review, Request changes, Approve, and Merge.'))+reviewResultCard('workTracking',tx('任務與進度','Tasks and progress'),tx('Issue、Assignee、Project 與 Project status automation。','Issue, Assignee, Project, and Project status automation.'))+'</div><div class=\"review-answer-review\"><article><h3>'+tx('你的第一段說明','Your first explanation')+'</h3><p>'+esc(r.answers.explain1||plain('尚未填寫','Not written'))+'</p></article><article><h3>'+tx('你的第二段說明','Your second explanation')+'</h3><p>'+esc(r.answers.explain2||plain('尚未填寫','Not written'))+'</p></article></div><div class=\"review-verify-note\" style=\"margin-top:14px\">'+tx('開放題已完成結構化自我核對；文字內容是否真的表達正確理解，仍需要真人驗證。','The open responses completed a structured self-check; whether the wording shows correct understanding still needs human validation.')+'</div><div class=\"review-actions\"><button type=\"button\" class=\"btn\" onclick=\"reviewReset()\">'+tx('重新做一次綜合回顧','Redo the adaptive review')+'</button><button type=\"button\" class=\"btn primary\" onclick=\"gotoPhase(4)\">'+tx('回到 Stage 4 複習','Return to Stage 4')+'</button></div>';
  return '<section class=\"review-report\"><span class=\"status-badge green\">'+tx('回顧完成','Review complete')+'</span><h2>'+tx('這次你已經能判斷什麼？','What can you judge now?')+'</h2><p>'+tx('這份報告不給分數，只把你在不同概念上的狀態與下一步整理出來。','This report does not give a score. It summarizes your concept status and next steps.')+'</p>'+body+'</section>';
}
function reviewReportLink(domain){
  if(domain==='versionRelations')return tx('回到 Stage 4 的版本與 Branch 操作','Return to Stage 4 version and Branch practice');
  if(domain==='prMergeGate')return tx('回到 Stage 4 的 Diff 與 Review 操作','Return to Stage 4 Diff and Review practice');
  return tx('回到 Stage 4 的 Issue 與 Project 操作','Return to Stage 4 Issue and Project practice');
}
function reviewValidateVersion(){
  const a=state.review.answers.version,order=(a.order||[]).join(',');
  return a.repoPlacement==='repository'&&a.mainPlacement==='main'&&a.branchPlacement==='branch'&&order==='save,commit,pr,merge'&&a.reasons.includes('trace')&&a.reasons.includes('working-file')&&!a.reasons.includes('same')&&a.upload==='web-commit'&&a.push==='local-remote';
}
function reviewValidateVersionRepair(){
  const a=state.review.answers.versionRepair;
  return a.choice==='committed'&&a.evidence.includes('message')&&a.evidence.includes('sha')&&!a.evidence.includes('autosave');
}
function reviewValidatePr(){
  const a=state.review.answers.pr;
  return a.mergeDecision==='not-yet'&&a.blockers.includes('latest-review')&&a.blockers.includes('request-changes')&&!a.blockers.includes('comment-only')&&a.diffViewedSha==='f4e5d6a'&&a.selectedLine==='date-line'&&a.fixConfirmed&&a.approvedSha==='f4e5d6a'&&a.approvedSha===a.diffViewedSha&&a.merged;
}
function reviewValidatePrRepair(){
  const a=state.review.answers.prRepair;
  return a.choice==='b'&&a.reasons.includes('sha')&&a.reasons.includes('changes')&&!a.reasons.includes('position');
}
function reviewValidateTracking(){
  const a=state.review.answers.tracking;
  return a.issuePlacement==='issue'&&a.projectPlacement==='project'&&a.automationPlacement==='workflow'&&a.assignee==='Alex'&&a.automationDecision==='not-always'&&a.automationConditions.includes('closes')&&a.automationConditions.includes('workflow')&&!a.automationConditions.includes('merge-only');
}
function reviewValidateTrackingRepair(){
  const a=state.review.answers.trackingRepair;
  return a.reasons.includes('link')&&a.reasons.includes('workflow')&&!a.reasons.includes('broken');
}
function reviewMarkPassed(page){
  const d=reviewPageDomain(page),r=state.review,attempt=Number(r.attempts[page])||0;
  if(d)r.domainResults[d]=attempt>0||page.indexOf('-repair')>-1?'clarified':'mastered';
}
function reviewNext(){
  const r=ensureReviewRoute(),page=reviewPage();
  if(page==='footprint'){r.status='in-progress';reviewAdvance();return}
  if(page==='version'){if(!reviewValidateVersion()){reviewFail(page,['先把版本關係補完整','Complete the version relationships'],['請確認 Repository 裡有 main 和工作 Branch；再檢查操作順序、Commit／儲存，以及 Upload files／Push 的差異。','Confirm that main and the work Branch are inside the Repository, then check the order, Commit versus saving, and Upload files versus Push.']);return}reviewMarkPassed(page);reviewAdvance();return}
  if(page==='version-repair'){if(!reviewValidateVersionRepair()){reviewFail(page,['還需要更多版本證據','More version evidence is needed'],['請找出 Commit message 和 SHA；普通儲存本身不會留下這兩項 Git 紀錄。','Look for the Commit message and SHA; ordinary saving does not create those Git records by itself.']);return}state.review.repairsCompleted[page]=true;state.review.domainResults.versionRelations='clarified';reviewAdvance();return}
  if(page==='pr'){if(!reviewValidatePr()){reviewFail(page,['PR 還沒通過最新版本檢查','The PR has not passed the latest-version check'],['請選「還不行」、指出 Request changes 與舊 SHA 的阻擋，打開 f4e5d6a 的最新 Diff，確認修正後才 Approve 和 Merge。','Choose “not yet,” identify Request changes and the old SHA as blockers, open the f4e5d6a latest Diff, verify the fix, then Approve and Merge.']);return}reviewMarkPassed(page);reviewAdvance();return}
  if(page==='pr-repair'){if(!reviewValidatePrRepair()){reviewFail(page,['還沒抓到舊核准的問題','The old approval problem is not clear yet'],['只有新增 Commit 後重新看最新 Diff，並以最新 SHA Approve，才是可以合併的狀態。','Only a latest-Diff review followed by approval on the latest SHA is ready to merge.']);return}state.review.repairsCompleted[page]=true;state.review.domainResults.prMergeGate='clarified';reviewAdvance();return}
  if(page==='tracking'){if(!reviewValidateTracking()){reviewFail(page,['Issue 和 Project 的分工還沒對上','Issue and Project roles are not matched yet'],['Issue 記錄具體工作與負責人；Project 集中看多件工作；自動更新還要看關聯和 workflow 設定。','An Issue records a concrete task and owner; a Project tracks many tasks; automation still depends on links and workflow settings.']);return}reviewMarkPassed(page);reviewAdvance();return}
  if(page==='tracking-repair'){if(!reviewValidateTrackingRepair()){reviewFail(page,['還需要檢查自動化設定','The automation checks are incomplete'],['先查 PR 與 Issue 的關聯，再查 Project 是否啟用 workflow automation；Merge 本身不保證狀態移動。','Check the PR-Issue link, then check whether the Project enables workflow automation; Merge alone does not guarantee a status move.']);return}state.review.repairsCompleted[page]=true;state.review.domainResults.workTracking='clarified';reviewAdvance();return}
  if(page==='explain'){if(!reviewValidateExplanation()){reviewFail(page,['再把理由寫完整一點','Make the reasoning more complete'],['兩段都要有足夠的情境文字，並各自核對至少兩項具體理由；不要只貼題目或重複字元。','Both responses need enough scenario text and at least two concrete checks each; do not paste the prompt or repeat characters.']);return}state.review.domainResults.explanation='self-check';r.report=reviewBuildReport();r.completed=true;r.status='completed';state.unlocked=Math.max(state.unlocked,5);reviewAdvance();return}
}
function reviewReset(){if(!confirm(plain('重新做一次綜合回顧？前四階段不會被清除。','Redo the adaptive review? Stages 1–4 will not be cleared.')))return;state.review=baseReview();state.termsOpen=false;ensureReviewRoute();focusRequested=true;save();topNow()}

/* Evidence instrumentation and Stage 5 course shell */
function inspectScenarioBubble(bubbleId,problemId){
  if(!problemId){
    state.scenarioWrong=bubbleId;state.scenarioSelected=null;
    if(!state.learningEvidence)state.learningEvidence=baseLearningEvidence();
    state.learningEvidence.stage1.wrongBubbleClicks++;
    if(!state.learningEvidence.stage1.wrongBubbleIds.includes(bubbleId))state.learningEvidence.stage1.wrongBubbleIds.push(bubbleId);
    appendLearningEvent({stage:1,concept:'versionRelations',action:'wrong-bubble',itemId:bubbleId});
    save();
    window.setTimeout(function(){if(state.phase===1&&state.scenarioWrong===bubbleId){state.scenarioWrong='';save()}},620);
    return;
  }
  state.scenarioWrong='';state.scenarioSelected=problemId;
  if(!state.scenarioFound.includes(problemId)){
    state.scenarioFound.push(problemId);
    if(!state.learningEvidence)state.learningEvidence=baseLearningEvidence();
    state.learningEvidence.stage1.discoveryOrder.push(problemId);
    appendLearningEvent({stage:1,concept:reviewConceptForProblem(problemId),action:'found-clue',itemId:bubbleId});
  }
  if(state.scenarioFound.length===pains.length)state.learningEvidence.stage1.completed=true;
  save();
}
function answerNeed(painId,answerId){
  const p=state.learningEvidence?.stage2?.byProblem?.[painId]||(state.learningEvidence.stage2.byProblem[painId]={attempts:0,wrong:0,solved:false});
  p.attempts++;
  if(painId===answerId){
    p.solved=true;state.thinking[painId]=true;state.modal=null;
    appendLearningEvent({stage:2,concept:reviewConceptForProblem(painId),action:'solved-match',itemId:painId});
  }else{
    p.wrong++;
    appendLearningEvent({stage:2,concept:reviewConceptForProblem(painId),action:'wrong-match',itemId:painId});
    const wrong=pains.find(function(x){return x.id===answerId});
    state.modal={type:'wrong',title:['再想一次','Try again'],body:['你選的「'+wrong.need[0]+'」是在解決另一個問題，回頭看看目前情境再選一次。','“'+wrong.need[1]+'” addresses a different problem. Look at the current situation again and choose once more.']};
  }
  save();
}
function markDemoViewed(index){
  if(!state.learningEvidence)state.learningEvidence=baseLearningEvidence();
  if(state.learningEvidence.stage3.viewedSteps.includes(index))return;
  state.learningEvidence.stage3.viewedSteps.push(index);
  const term=resolveTermKey(demoSteps[index]?.term||'');
  if(term&&!state.learningEvidence.stage3.viewedConcepts.includes(term))state.learningEvidence.stage3.viewedConcepts.push(term);
  if(index===demoSteps.length-1)state.learningEvidence.stage3.completed=true;
  appendLearningEvent({stage:3,concept:term||'versionRelations',action:'viewed-demo-step',itemId:'demo-step-'+index});
  persist();
}
function practicePredict(value){
  const p=state.practice,m=practiceMeta[p.step],s=ensurePracticeEvidence(p.step);
  p.prediction=value;p.predictionOK=value===m.answer;s.predictionAttempts++;
  if(p.predictionOK){
    appendLearningEvent({stage:4,concept:reviewConceptForPracticeStep(p.step),action:'prediction-correct',itemId:'practice-step-'+p.step});
    p.error=null;
  }else{
    s.wrongPredictions++;
    appendLearningEvent({stage:4,concept:reviewConceptForPracticeStep(p.step),action:'wrong-prediction',itemId:'practice-step-'+p.step});
    p.error={type:'prediction',title:['這個選項是在解決另一個問題。','This option solves a different problem.'],body:['回頭看看這一步要解決什麼，再選一次。','Look again at what this step is meant to solve, then choose again.'],recover:'dismiss'};
  }
  save();
}
function nextHint(){
  const p=state.practice,s=ensurePracticeEvidence(p.step);
  p.hint=Math.min(3,p.hint+1);s.hintsUsed++;
  appendLearningEvent({stage:4,concept:reviewConceptForPracticeStep(p.step),action:'used-hint',itemId:'practice-step-'+p.step});
  save();
}
function applyPracticeAutofill(key,id){
  const meta=practiceAutofillExamples[key],field=document.getElementById(id);if(!meta||!field)return;
  const value=state.lang==='en'?meta.value[1]:meta.value[0],s=ensurePracticeEvidence(state.practice.step);
  state.practice.drafts[key]=value;s.autofillUses++;
  appendLearningEvent({stage:4,concept:reviewConceptForPracticeStep(state.practice.step),action:'used-autofill',itemId:'practice-step-'+state.practice.step});
  field.value=value;field.dispatchEvent(new Event('input',{bubbles:true}));persist();
  const button=document.querySelector('[data-autofill-for="'+id+'"]'),status=document.getElementById(id+'-autofill-status');
  if(status)status.textContent=plain('已填入'+meta.label[0],meta.label[1]+' filled');
  if(button){button.textContent=plain('已填入','Filled');button.classList.add('filled');window.setTimeout(function(){if(document.body.contains(button)){button.textContent=plain('幫我填','Fill it');button.classList.remove('filled')}},1200)}
}
function phaseName(index){const names=[['真實情境','Real context'],['引導思考','Guided thinking'],['完整示範','Watch once'],['引導練習','Guided practice'],['綜合回顧','Adaptive review']];return tx(...names[index-1])}
function phaseNameText(index){const names=[['真實情境','Real context'],['引導思考','Guided thinking'],['完整示範','Watch once'],['引導練習','Guided practice'],['綜合回顧','Adaptive review']],n=names[index-1]||names[0];return state.lang==='en'?n[1]:n[0]}
function confirmResetPhase(){
  state.modal=null;modalReturnFocus=null;modalReturnFocusSelector=null;state.termsOpen=false;state.scenarioWrong='';
  if(state.phase===1){state.scenarioIntro=true;state.scenarioFound=[];state.scenarioSelected=null}
  if(state.phase===2){state.thinking={};state.thinkingCurrent='owner'}
  if(state.phase===3){state.demo={index:0,played:false,auto:false,version:DEMO_VERSION}}
  if(state.phase===4)state.practice=basePractice();
  if(state.phase===5)state.review=baseReview();
  focusRequested=true;save();topNow();
}
function reviewTermKeys(){return ['Git','GitHub','Repository','main','Branch','Commit','Upload','Push','PR','Review','Merge','Issue','Assignee','Project','ProjectAutomation'].filter(function(k){return terms[k]})}
function reviewHeading(page){
  const r=ensureReviewRoute(),index=r.cursor,total=r.route.length,label=reviewPageLabel(page),title=page==='footprint'?tx('先看看你走過的學習路線','Review the learning path you have taken'):tx('5.'+(index+1)+' '+label[0],'5.'+(index+1)+' '+label[1]),desc=page==='footprint'?tx('這不是另一場考試；系統會把前面做過的判斷串起來，必要時多給你一個釐清步驟。','This is not another exam. The route connects your earlier decisions and adds a repair step only when needed.'):page==='explain'?tx('請用自己的話說明判斷理由，讓理解不只停在按鈕位置。','Explain your reasoning so understanding does not stop at button positions.'):page==='report'?tx('回看你在版本、審查合併、任務進度上的狀態。','Review your status across versions, review and merge, and task progress.'):tx('做出判斷後，讀懂回饋，再決定下一步。','Make a judgment, read the feedback, and decide what comes next.');
  return stageHeading('STAGE 5 · ADAPTIVE REVIEW',title,desc,index,total);
}
function reviewFootprintView(){
  return '<div class="review-intro"><article class="review-brief"><span class="status-badge purple">'+tx('自適應回顧','Adaptive review')+'</span><h2>'+tx('我真的懂了嗎？','Do I really understand it?')+'</h2><p>'+tx('你會重新整理三個最重要的關係：版本與分支、審查與合併、任務與進度。系統會參考前面留下的學習紀錄，但不把看過示範或使用自動填寫當成已掌握。','You will connect three important relationships: versions and branches, review and merge, and tasks and progress. Earlier learning evidence guides the route, but watching a demo or using auto-fill is not treated as mastery.')+'</p><div class="review-actions"><button type="button" class="btn primary" onclick="reviewNext()">'+tx('開始回顧','Start review')+'</button></div></article><aside class="review-route-card"><h3>'+tx('這次的回顧路線','This review route')+'</h3>'+reviewRouteList()+'<p class="field-help">'+tx('有弱項時會多一個釐清頁，最多兩頁。','Weak concepts add a repair page, up to two.')+'</p></aside></div>';
}
function renderReviewPage(){
  const page=reviewPage(),body=page==='footprint'?reviewFootprintView():page==='version'?reviewVersionView():page==='version-repair'?reviewVersionRepairView():page==='pr'?reviewPrView():page==='pr-repair'?reviewPrRepairView():page==='tracking'?reviewTrackingView():page==='tracking-repair'?reviewTrackingRepairView():page==='explain'?reviewExplanationView():reviewReportView();
  const content=reviewHeading(page)+(page==='footprint'?body:page==='report'?'<div class="review-page">'+body+'</div>':'<div class="review-workbench">'+reviewSidebar()+body+'</div>');
  return redesignPage(content,reviewTermKeys(),redesignActionBar('gotoPhase(4)',null,null,false));
}
function redesignChallengePage(){return renderReviewPage()}
function headerCourseActionState(){
  if(state.phase===1){if(state.scenarioIntro)return {prev:null,next:null,label:null,showNext:false};const ready=state.scenarioFound.length===pains.length;return {prev:'showScenarioIntro()',next:ready?'unlock(2)':null,label:tx('進入引導思考','Continue to guided thinking'),showNext:true}}
  if(state.phase===2){const ready=Object.keys(state.thinking).length===pains.length;return {prev:'gotoPhase(1)',next:ready?'unlock(3)':null,label:tx('觀看完整示範','Watch the complete demonstration'),showNext:true}}
  if(state.phase===3){markDemoViewed(state.demo.index);return {prev:'gotoPhase(2)',next:state.demo.played?'unlock(4)':null,label:tx('開始引導練習','Start guided practice'),showNext:true}}
  if(state.phase===4){const p=state.practice,ready=p.step===practiceMeta.length-1&&p.result&&p.reflection==='ok';return {prev:'gotoPhase(3)',next:ready?'unlock(5)':null,label:tx('開始綜合回顧','Start adaptive review'),showNext:true}}
  const page=reviewPage(),r=state.review;
  if(page==='report')return {prev:'gotoPhase(4)',next:'reviewJumpToReport()',label:tx('重看回顧報告','Review the report again'),showNext:true};
  const label=page==='footprint'?tx('開始回顧','Start review'):r.error&&r.error.page===page?tx('再檢查一次','Check again'):tx('檢查目前答案','Check this checkpoint');
  return {prev:'gotoPhase(4)',next:'reviewNext()',label:label,showNext:true};
}
function reviewJumpToReport(){const r=ensureReviewRoute(),index=r.route.indexOf('report');if(index>=0){r.cursor=index;r.error=null;save()}}
function draw(){
  const app=document.getElementById('app'),content=state.phase===1?redesignScenarioPage():state.phase===2?redesignThinkingPage():state.phase===3?redesignDemoPage():state.phase===4?redesignPracticePage():redesignChallengePage();
  app.innerHTML=redesignHeader()+'<div class="course-shell">'+redesignCourseRail()+'<div class="course-content">'+content+'</div></div>'+modalView();
  requestAnimationFrame(function(){
    if(state.modal){const first=document.querySelector('.modal button,.modal input,.modal textarea,.modal select');if(first)first.focus();return}
    if(focusRequested){const heading=document.querySelector('main h1,main h2');if(heading){heading.setAttribute('tabindex','-1');heading.focus()}focusRequested=false}
  });
}
/* Local QA shortcut: intentionally invisible in the course UI and never persisted. */
var alexTestMode=false;
function isLocalTestHost(){
  const host=location.hostname;
  return location.protocol==='file:'||host===''||host==='localhost'||host==='127.0.0.1'||host==='[::1]';
}
function persist(){
  if(alexTestMode)return;
  try{
    localStorage.setItem(STORE,JSON.stringify(state));
    localStorage.setItem(PRACTICE_STORAGE_VERSION_KEY,String(PRACTICE_STORAGE_VERSION));
    localStorage.setItem(PRACTICE_STORAGE_KEY,JSON.stringify({practice:state.practice,challenge:state.challenge}));
  }catch(e){}
}
function gotoPhase(n){
  if(!alexTestMode&&n>state.unlocked)return;
  state.phase=n;state.modal=null;state.navOpen=false;state.termsOpen=false;state.scenarioWrong='';
  navReturnFocus=null;navReturnFocusSelector=null;focusRequested=true;save();topNow();
}
function redesignCourseNavItems(){
  return [1,2,3,4,5].map(i=>{
    const completedStage5=!alexTestMode&&i===5&&state.review?.completed;
    const current=state.phase===i&&!completedStage5;
    const done=!alexTestMode&&(completedStage5||(i<state.unlocked&&!current));
    const locked=!alexTestMode&&i>state.unlocked;
    const available=!current&&!done&&!locked;
    const statusPair=alexTestMode
      ?(current?['測試中','Test mode']:['可跳轉','Available'])
      :(current?['進行中','In progress']:done?['已完成','Completed']:available?['可開始','Ready']:['尚未開始','Not started']);
    const status=tx(...statusPair),statusText=plain(...statusPair);
    const label=plain(`第 ${i} 階段：${phaseNameText(i)}，${statusText}`,`Stage ${i}: ${phaseNameText(i)}, ${statusText}`);
    return `<button class="course-nav-item ${current?'current':done?'done':available?'available':'locked'}" onclick="gotoPhase(${i})" ${locked?'disabled':''} ${current?'aria-current="step"':''} aria-label="${esc(label)}"><span class="phase-no" aria-hidden="true">${done?'✓':i}</span><span><b>${phaseName(i)}</b><small>${status}</small></span></button>`;
  }).join('');
}
function activateAlexTestMode(){
  if(!isLocalTestHost())return 'ALEX is available only on a local development page.';
  if(alexTestMode)return 'ALEX test mode is already active. Reload the page to exit.';
  alexTestMode=true;
  state.phase=5;
  state.unlocked=5;
  state.review=baseReview();
  state.modal=null;state.navOpen=false;state.termsOpen=false;state.scenarioWrong='';
  ensureReviewRoute();
  focusRequested=true;draw();topNow();
  return 'ALEX test mode enabled. All stages are available; reload to exit.';
}
function installLocalTestShortcut(){
  try{
    Object.defineProperty(window,'ALEX',{configurable:false,enumerable:false,get:activateAlexTestMode});
  }catch(e){}
}
installLocalTestShortcut();
draw();
