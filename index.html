/* practice draft-preserving renderers: later declarations intentionally replace the original renderers */
function renderFilesPractice(){const p=state.practice,d=p.drafts;if(p.commits.length)return ghShell('Code',`${fileTable(false)}<div class="notice success">${tx('已建立 Commit：','Commit created:')} ${esc(p.commits[0].message)}</div>`);if(p.sub===0)return ghShell('Code',`<h2>Upload files</h2><p>${tx('請選擇要加入專案的檔案。','Select files to add to the project.')}</p><div class="upload-grid">${[['project-plan.md',true],['budget.xlsx',true],['index.html',true],['poster.png',true],['draft-notes.txt',false]].map(([name,req])=>`<label class="upload-item ${!req?'private':''}"><input type="checkbox" class="p-file" value="${name}" ${d.files.includes(name)?'checked':''} onchange="draftPracticeFiles()"> <span><b>${name}</b><br><small>${req?tx('必要檔案','Required file'):tx('含私人電話與未確認報價','Contains a private phone number and unconfirmed quote')}</small></span></label>`).join('')}</div><div class="btn-row" style="margin-top:14px"><button class="btn primary" onclick="selectPracticeFiles()">${tx('確認待上傳清單','Confirm upload list')}</button></div>`);return ghShell('Code',`<h2>${tx('確認檔案與 Commit','Review files and commit')}</h2><div class="file-table">${Object.keys(p.files).map(n=>`<div class="file-row"><span class="file-name">${esc(n)}</span><span>${tx('待上傳','Pending')}</span><span>✓</span></div>`).join('')}</div><div class="commit-box"><label for="p-commit-message"><b>Commit message</b></label><input id="p-commit-message" class="input" placeholder="${plain('建立校園市集初始檔案','Add initial campus-market files')}" value="${esc(d.commitMessage)}" oninput="draftPractice('commitMessage',this.value)"><div class="btn-row" style="margin-top:10px"><button class="btn primary" onclick="commitPracticeFiles()">Commit changes</button></div></div>`)}
function selectPracticeFiles(){const selected=state.practice.drafts.files,required=['project-plan.md','budget.xlsx','index.html','poster.png'],p=state.practice;if(required.some(x=>!selected.includes(x))){p.error={title:['必要檔案缺漏','Required files are missing'],body:['專案無法完整呈現企劃、預算、網站與海報。','The project would be missing part of the proposal, budget, website, or poster.'],recover:'files'};save();return}if(selected.includes('draft-notes.txt')){p.error={title:['私人草稿即將被加入 Repository','A private draft is about to enter the repository'],body:['draft-notes.txt 內含私人電話與未確認報價。即使之後刪除，Commit 歷史仍可能保留紀錄。','draft-notes.txt contains a private phone number and unconfirmed quote. Even if deleted later, the commit history may retain it.'],consequence:[[['公開風險','Exposure risk'],['團隊成員可能下載或轉傳不應公開的內容。','Team members may download or share information that should stay private.']],[['正確做法','Correct action'],['回到選擇畫面，不要上傳這份草稿。','Return to file selection and exclude the draft.']]],recover:'files'};save();return}p.files=Object.fromEntries(selected.map(n=>[n,{content:n==='project-plan.md'?'# 校園永續市集企劃\n':''}]));p.sub=1;save();topNow()}
function commitPracticeFiles(){const msg=state.practice.drafts.commitMessage.trim(),p=state.practice;if(!msg||/^update$/i.test(msg)){p.error={title:['Commit 訊息無法辨認內容','The commit message does not explain the change'],body:['如果 History 出現多筆 update，未來無法快速找到這次加入初始檔案的版本。','If history contains several “update” entries, nobody can quickly identify this initial-files commit.'],recover:'files'};save();return}p.commits.unshift({id:uid(),message:msg,branch:'main'});completePracticeAction();save()}
function renderIssuePractice(){const p=state.practice,d=p.drafts;if(p.issue)return ghShell('Issues',`<div class="issue-row"><span class="issue-open">●</span> <b>#1 ${esc(p.issue.title)}</b><p>${tx('負責人','Assignee')}：${esc(p.issue.assignee)}<br>${tx('完成條件','Acceptance criteria')}：${esc(p.issue.criteria)}</p></div>`);return ghShell('Issues',`<div class="gh-form"><h2>New issue</h2><div class="field"><label for="p-issue-title">Title</label><input id="p-issue-title" class="input" placeholder="${plain('完成三家競品分析','Complete three competitor analyses')}" value="${esc(d.issueTitle)}" oninput="draftPractice('issueTitle',this.value)"></div><div class="field"><label for="p-issue-criteria">Description / Acceptance criteria</label><textarea id="p-issue-criteria" class="textarea" placeholder="${plain('至少三家競品、價格、活動特色與資料來源','At least three competitors, prices, features, and sources')}" oninput="draftPractice('issueCriteria',this.value)">${esc(d.issueCriteria)}</textarea></div><div class="field"><label for="p-issue-assignee">Assignee</label><select id="p-issue-assignee" class="select" onchange="draftPractice('issueAssignee',this.value)"><option value="">${plain('尚未指派','Unassigned')}</option><option ${d.issueAssignee==='Alex'?'selected':''}>Alex</option><option ${d.issueAssignee==='志豪'?'selected':''}>志豪</option></select></div><button class="btn primary" onclick="createPracticeIssue()">Submit new issue</button></div>`)}
function createPracticeIssue(){const d=state.practice.drafts,title=d.issueTitle.trim(),criteria=d.issueCriteria.trim(),assignee=d.issueAssignee,p=state.practice;if(!title||!criteria||!assignee||assignee!=='Alex'){p.error={title:['任務仍然模糊','The task is still ambiguous'],body:[assignee&&assignee!=='Alex'?'這個任務指定的負責人必須是 Alex。':'缺少標題、負責人或完成條件時，Issue 仍可能像 LINE 裡的「有人處理一下」。','The issue must have Alex as its assignee, plus a title and acceptance criteria.'],recover:'dismiss'};save();return}p.issue={title,criteria,assignee,status:'open'};completePracticeAction();save()}
function renderProjectPractice(){const p=state.practice,d=p.drafts;if(p.project)return ghShell('Projects',`<h2>${esc(p.project.name)}</h2><div class="board"><div class="board-col"><b>Todo</b><div class="board-card">#1 ${esc(p.issue.title)}<br><small>${esc(p.issue.assignee)}</small></div></div><div class="board-col"><b>In progress</b></div><div class="board-col"><b>Done</b></div></div>`);return ghShell('Projects',`<div class="gh-form"><h2>New project</h2><div class="field"><label for="p-project-name">Project name</label><input id="p-project-name" class="input" value="${esc(d.projectName)}" oninput="draftPractice('projectName',this.value)"></div><label class="radio-card"><input id="p-add-issue" type="checkbox" ${d.addIssue?'checked':''} onchange="draftPractice('addIssue',this.checked)"> <span>${tx('將 Issue #1 加入 Todo','Add Issue #1 to Todo')}</span></label><div class="btn-row" style="margin-top:14px"><button class="btn primary" onclick="createPracticeProject()">Create project</button></div></div>`)}
function createPracticeProject(){const d=state.practice.drafts,name=d.projectName.trim(),add=d.addIssue,p=state.practice;if(!name||!add){p.error={title:['看板建立了，但沒有工作','The board exists but contains no work'],body:['Project 若沒有加入 Issue，就無法呈現真正進度。','A project without issues cannot show real progress.'],recover:'dismiss'};save();return}p.project={name,status:'Todo',issueAdded:true};completePracticeAction();save()}
function renderEditPractice(){const p=state.practice,d=p.drafts;if(p.commits.some(c=>c.branch==='feature/competitor-research'))return ghShell('Code',`${fileTable(true)}<div class="notice success">${tx('Branch 已新增 Commit','A commit was added to the branch')}</div>`);const content=d.editContent||'# 競品分析\n\n- 競品 A：草悟道市集\n- 競品 B：逢甲週末企劃\n- 競品 C：審計新村市集\n- 攤位費：5000';return ghShell('Code',`<div class="gh-toolbar"><span class="branch-pill">⌘ ${esc(p.branch)}</span></div><div class="field"><label for="p-editor">competitor-research.md</label><textarea id="p-editor" class="textarea" oninput="draftPractice('editContent',this.value)">${esc(content)}</textarea></div><div class="commit-box"><label for="p-edit-msg">Commit message</label><input id="p-edit-msg" class="input" placeholder="${plain('新增三家競品分析','Add three competitor analyses')}" value="${esc(d.editMessage)}" oninput="draftPractice('editMessage',this.value)"><button class="btn primary" style="margin-top:10px" onclick="commitPracticeEdit()">Commit changes</button></div>`)}
function commitPracticeEdit(){const d=state.practice.drafts,msg=d.editMessage.trim(),content=d.editContent||'# 競品分析\n\n- 競品 A：草悟道市集\n- 競品 B：逢甲週末企劃\n- 競品 C：審計新村市集\n- 攤位費：5000',p=state.practice;if(p.branch==='main'){badEditMain();return}if(!msg||/^update$/i.test(msg)){p.error={title:['History 只會顯示模糊的 update','History would show only a vague “update”'],body:['半年後的你無法知道這筆 Commit 是新增競品、修正日期，還是修改預算。','Months later, nobody can tell whether this commit added competitors, fixed a date, or changed the budget.'],recover:'commit'};save();return}p.files['competitor-research.md']={content};p.commits.unshift({id:uid(),message:msg,branch:p.branch});completePracticeAction();save()}
function renderPRPractice(){const p=state.practice,d=p.drafts;if(p.pr)return ghShell('Pull requests',`<span class="status-badge green">Open</span><h2>${esc(p.pr.title)} #2</h2><p>${esc(p.pr.compare)} → ${esc(p.pr.base)}</p><p>${esc(p.pr.body)}</p>`);return ghShell('Pull requests',`<div class="gh-form"><h2>Open a pull request</h2><div class="upload-grid"><div class="field"><label for="p-pr-base">base</label><select id="p-pr-base" class="select" onchange="draftPractice('prBase',this.value)"><option>main</option><option ${d.prBase==='feature/competitor-research'?'selected':''}>feature/competitor-research</option></select></div><div class="field"><label for="p-pr-compare">compare</label><select id="p-pr-compare" class="select" onchange="draftPractice('prCompare',this.value)"><option>feature/competitor-research</option><option ${d.prCompare==='main'?'selected':''}>main</option></select></div></div><div class="field"><label for="p-pr-title">Title</label><input id="p-pr-title" class="input" value="${esc(d.prTitle)}" oninput="draftPractice('prTitle',this.value)"></div><div class="field"><label for="p-pr-body">Description</label><textarea id="p-pr-body" class="textarea" oninput="draftPractice('prBody',this.value)">${esc(d.prBody)}</textarea></div><button class="btn primary" onclick="createPracticePR()">Create pull request</button></div>`)}
function createPracticePR(){const d=state.practice.drafts,base=d.prBase,compare=d.prCompare,title=d.prTitle.trim(),body=d.prBody.trim(),p=state.practice;if(base!=='main'||compare!=='feature/competitor-research'){p.error={title:['比較方向顛倒','The comparison direction is reversed'],body:['base 應是要接收修改的正式版本 main；compare 才是你的工作 Branch。','base should be the receiving official branch, main; compare should be your work branch.'],recover:'pr'};save();return}if(!title||!body){p.error={title:['隊友不知道這份 PR 的目的','Teammates cannot understand this pull request'],body:['標題與說明缺漏時，reviewer 只能自己猜修改原因。','Without a title and description, reviewers must guess the purpose.'],recover:'dismiss'};save();return}p.pr={base,compare,title,body,status:'open'};completePracticeAction();save()}
/* challenge */
function challengeStage(){const c=state.challenge;if(!c.repo)return 0;if(c.commits.length===0)return 1;if(!c.issue||!c.project)return 2;if(c.branches.length===1)return 3;if(!c.pr)return 4;if(c.pr.status!=='merged')return 5;return 6}
function challengePage(){const c=state.challenge,stage=challengeStage();const names=[['建立專案','Create project'],['準備檔案','Prepare files'],['規劃工作','Plan work'],['安全修改','Edit safely'],['提交審核','Request review'],['完成整合','Complete integration']];return `<main class="page"><section class="challenge-brief card"><span class="status-badge purple">${tx('第五階段：無提示挑戰','Stage 5: No-hint challenge')}</span><h1>${tx('國際企業個案競賽專案','International Business Case Competition')}</h1><p>${tx('建立新的 Repository，整理初始檔案，建立任務與看板，在 Branch 完成競爭者分析，送出 Pull Request，處理 Review，最後 Merge 並完成進度。此階段沒有紅框、箭頭、自動填入或按鈕提示。','Create a new repository, prepare files, build a task and board, complete competitor analysis on a branch, open a pull request, handle review, and merge. There are no highlights, arrows, autofill, or button hints.')}</p><div class="stage-strip">${names.map((n,i)=>`<div class="stage-chip ${i<stage?'done':i===stage?'current':''}">${i+1}. ${tx(...n)}</div>`).join('')}</div></section><div class="challenge-layout"><aside class="objective-panel card"><h3>${stage<6?tx(...names[stage]):tx('挑戰完成','Challenge complete')}</h3>${challengeObjectives(stage)}<hr style="border:0;border-top:1px solid var(--line);margin:15px 0"><p><b>${tx('目前狀態','Current state')}</b></p><ul class="objective-list"><li>Repository：${c.repo?'✓':'—'}</li><li>Commit：${c.commits.length}</li><li>Issue：${c.issue?'✓':'—'}</li><li>Project：${c.project?'✓':'—'}</li><li>Branch：${c.branches.length>1?'✓':'—'}</li><li>PR：${c.pr?c.pr.status:'—'}</li></ul>${stage===6?`<div class="challenge-score">100%</div><button class="btn blue btn-block" onclick="openExtension()">${tx('解鎖 Git 指令延伸課','Unlock Git command extension')}</button>`:''}</aside><section>${renderChallengeGithub()}</section></div></main>`}
function challengeObjectives(stage){const arr=[
 ['目標：建立 private Repository，名稱由你決定，並加入 README。','Goal: Create a private repository with your own name and add a README.'],
 ['目標：透過網頁建立或上傳至少三個檔案，留下清楚 Commit 訊息。','Goal: Create or upload at least three files on the web and write a clear commit message.'],
 ['目標：建立有負責人與完成條件的 Issue，再建立 Project 並加入該 Issue。','Goal: Create an issue with an owner and criteria, then create a project and add the issue.'],
 ['目標：從 main 建立新 Branch，在 Branch 修改文件並 Commit。','Goal: Create a branch from main, edit a file there, and commit.'],
 ['目標：建立 PR，完成 Review；若發現問題，修正後再 Approve。','Goal: Open a PR and complete review; fix any problem before approving.'],
 ['目標：Merge，並確認 Issue 關閉、Project 移至 Done。','Goal: Merge, then verify the issue is closed and the project card is Done.'],
 ['你已能在沒有逐步指引的情況下完成完整流程。','You completed the workflow without step-by-step guidance.']
 ];return `<p>${tx(...arr[stage])}</p>`}
function challengeTabs(){const c=state.challenge;return `<div class="gh-tabs">${['Code','Issues','Pull requests','Projects'].map(x=>`<button class="gh-tab ${c.tab===x?'active':''}" onclick="challengeTab('${x}')">${x}</button>`).join('')}</div>`}
function challengeTab(t){state.challenge.tab=t;save();topNow()}
function renderChallengeGithub(){const c=state.challenge;if(!c.repo)return `<div class="gh-window"><div class="gh-global"><span class="gh-logo">GH</span><span>GitHub</span></div><div class="gh-body"><div class="gh-form"><h2>Create a new repository</h2><input id="c-repo" class="input" placeholder="repository-name"><div class="radio-stack" style="margin:12px 0"><label class="radio-card"><input type="radio" name="c-vis" value="public"> Public</label><label class="radio-card"><input type="radio" name="c-vis" value="private"> Private</label></div><label><input id="c-readme" type="checkbox"> Add a README file</label><div style="margin-top:13px"><button class="btn primary" onclick="challengeCreateRepo()">Create repository</button></div></div></div></div>`;let body='';if(c.tab==='Code')body=challengeCode();if(c.tab==='Issues')body=challengeIssues();if(c.tab==='Projects')body=challengeProjects();if(c.tab==='Pull requests')body=challengePR();return `<div class="gh-window"><div class="gh-global"><span class="gh-logo">GH</span><span class="gh-search">Search</span><span style="margin-left:auto">Alex</span></div><div class="gh-repohead"><div class="repo-name">alex / ${esc(c.repo.name)}</div>${challengeTabs()}</div><div class="gh-body">${body}</div></div>`}
function challengeCreateRepo(){const name=document.getElementById('c-repo')?.value.trim(),vis=document.querySelector('input[name=c-vis]:checked')?.value,readme=document.getElementById('c-readme')?.checked;if(!name||vis!=='private'||!readme){alert(plain('請依任務目標建立 Private Repository 並加入 README。','Create a private repository with a README as required.'));return}state.challenge.repo={name,visibility:'Private'};state.challenge.tab='Code';save();topNow()}
function challengeCode(){const c=state.challenge;if(c.commits.length===0)return `<h2>Add files</h2><div class="upload-grid">${['case-brief.md','competitor-analysis.md','presentation.html','private-notes.txt'].map(n=>`<label class="upload-item ${n==='private-notes.txt'?'private':''}"><input type="checkbox" class="c-file" value="${n}"> ${n}</label>`).join('')}</div><div class="commit-box"><input id="c-msg" class="input" placeholder="Commit message"><button class="btn primary" style="margin-top:9px" onclick="challengeCommitFiles()">Commit changes</button></div>`;if(c.branches.length===1)return `${challengeFileList()}<div class="btn-row" style="margin-top:14px"><input id="c-branch" class="input" style="max-width:320px" placeholder="new-branch-name"><button class="btn" onclick="challengeCreateBranch()">Create branch</button></div>`;if(!c.files['competitor-analysis.md']?.edited)return `${challengeFileList()}<div class="field" style="margin-top:14px"><label>competitor-analysis.md</label><textarea id="c-edit" class="textarea"># Competitor analysis\n\nAdd your analysis here.</textarea></div><input id="c-edit-msg" class="input" placeholder="Commit message"><button class="btn primary" style="margin-top:9px" onclick="challengeEditCommit()">Commit changes</button>`;return `${challengeFileList()}<div class="notice success">${tx('Branch 修改已完成，請自行判斷下一個功能。','Branch work is complete. Decide which feature comes next.')}</div>`}
function challengeFileList(){const c=state.challenge;return `<div class="gh-toolbar"><span class="branch-pill">⌘ ${esc(c.branch)}</span></div><div class="file-table">${Object.keys(c.files).map(n=>`<div class="file-row"><span class="file-name">${esc(n)}</span><span>${c.files[n].edited?'edited':'initial'}</span><span>✓</span></div>`).join('')}</div>`}
function challengeCommitFiles(){const files=[...document.querySelectorAll('.c-file:checked')].map(x=>x.value),msg=document.getElementById('c-msg')?.value.trim();if(files.length<3||files.includes('private-notes.txt')||!msg||/^update$/i.test(msg)){alert(plain('請依目標選擇至少三個適合公開於團隊的檔案，排除私人筆記，並填寫清楚訊息。','Select at least three suitable files, exclude the private note, and write a clear message.'));return}state.challenge.files=Object.fromEntries(files.map(n=>[n,{content:'',edited:false}]));state.challenge.commits.push({message:msg,branch:'main'});save();topNow()}
function challengeCreateBranch(){const name=document.getElementById('c-branch')?.value.trim();if(!name||name==='main'){alert(plain('請建立一個不同於 main 的工作 Branch。','Create a work branch different from main.'));return}state.challenge.branches.push(name);state.challenge.branch=name;save();topNow()}
function challengeEditCommit(){const content=document.getElementById('c-edit')?.value,msg=document.getElementById('c-edit-msg')?.value.trim();if(!content||!/競爭|compet/i.test(content)||!msg||/^update$/i.test(msg)){alert(plain('請實際加入競爭者分析，並使用清楚的 Commit 訊息。','Add real competitor analysis and use a clear commit message.'));return}state.challenge.files['competitor-analysis.md']={content,edited:true};state.challenge.commits.push({message:msg,branch:state.challenge.branch});save();topNow()}
function challengeIssues(){const c=state.challenge;if(c.issue)return `<div class="issue-row"><span class="issue-open">●</span> <b>#1 ${esc(c.issue.title)}</b><p>${esc(c.issue.assignee)} · ${esc(c.issue.criteria)}</p></div>`;return `<div class="gh-form"><h2>New issue</h2><input id="c-issue-title" class="input" placeholder="Title"><textarea id="c-issue-criteria" class="textarea" placeholder="Acceptance criteria"></textarea><select id="c-assignee" class="select"><option value="">Unassigned</option><option>Alex</option><option>志豪</option></select><button class="btn primary" style="margin-top:10px" onclick="challengeCreateIssue()">Submit new issue</button></div>`}
function challengeCreateIssue(){const title=document.getElementById('c-issue-title')?.value.trim(),criteria=document.getElementById('c-issue-criteria')?.value.trim(),assignee=document.getElementById('c-assignee')?.value;if(!title||!criteria||!assignee){alert(plain('Issue 必須有標題、負責人與完成條件。','The issue needs a title, assignee, and acceptance criteria.'));return}state.challenge.issue={title,criteria,assignee,status:'open'};save();topNow()}
function challengeProjects(){const c=state.challenge;if(c.project)return `<h2>${esc(c.project.name)}</h2><div class="board"><div class="board-col"><b>Todo</b>${c.project.status==='Todo'?`<div class="board-card">#1 ${esc(c.issue.title)}</div>`:''}</div><div class="board-col"><b>In progress</b>${c.project.status==='In progress'?`<div class="board-card">#1 ${esc(c.issue.title)}</div>`:''}</div><div class="board-col"><b>Done</b>${c.project.status==='Done'?`<div class="board-card">✓ #1 ${esc(c.issue.title)}</div>`:''}</div></div>`;return `<div class="gh-form"><h2>New project</h2><input id="c-project" class="input" placeholder="Project name"><label class="radio-card" style="margin-top:10px"><input id="c-add-issue" type="checkbox"> Add Issue #1 to Todo</label><button class="btn primary" style="margin-top:10px" onclick="challengeCreateProject()">Create project</button></div>`}
function challengeCreateProject(){if(!state.challenge.issue){alert(plain('請先建立 Issue。','Create an issue first.'));return}const name=document.getElementById('c-project')?.value.trim(),add=document.getElementById('c-add-issue')?.checked;if(!name||!add){alert(plain('Project 必須命名並加入 Issue。','Name the project and add the issue.'));return}state.challenge.project={name,status:'Todo'};save();topNow()}
function challengePR(){const c=state.challenge;if(c.branches.length===1||!c.files['competitor-analysis.md']?.edited)return `<div class="gh-empty">${tx('目前沒有可比較的 Branch 修改。','There are no branch changes to compare yet.')}</div>`;if(!c.pr)return `<div class="gh-form"><h2>Open a pull request</h2><div class="upload-grid"><select id="c-base" class="select"><option>main</option><option>${esc(c.branch)}</option></select><select id="c-compare" class="select"><option>${esc(c.branch)}</option><option>main</option></select></div><input id="c-pr-title" class="input" style="margin-top:10px" placeholder="Title"><textarea id="c-pr-body" class="textarea" placeholder="Description"></textarea><button class="btn primary" onclick="challengeCreatePR()">Create pull request</button></div>`;if(c.pr.status==='merged')return `<div class="notice success"><h2>Merged</h2><p>${tx('main、Issue 與 Project 已同步完成。','main, the issue, and the project are complete.')}</p></div>`;if(c.review==='none')return `<span class="status-badge green">Open</span><h2>${esc(c.pr.title)}</h2><div class="diff"><div class="diff-line add">+ Competitor A</div><div class="diff-line add">+ Budget: NT$5,000</div></div><div class="review-box"><button class="btn primary" onclick="challengeApprove()">Approve</button></div>`;return `<span class="status-badge green">Approved</span><h2>${esc(c.pr.title)}</h2><button class="btn primary" onclick="challengeMerge()">Merge pull request</button>`}
function challengeCreatePR(){const c=state.challenge,base=document.getElementById('c-base')?.value,compare=document.getElementById('c-compare')?.value,title=document.getElementById('c-pr-title')?.value.trim(),body=document.getElementById('c-pr-body')?.value.trim();if(base!=='main'||compare!==c.branch||!title||!body){alert(plain('請正確設定 base/compare，並填寫標題與說明。','Set base/compare correctly and provide a title and description.'));return}c.pr={title,body,status:'open'};if(c.project)c.project.status='In progress';save();topNow()}
function challengeApprove(){state.challenge.review='approved';save();topNow()}
function challengeMerge(){const c=state.challenge;if(c.review!=='approved')return;c.pr.status='merged';c.branch='main';if(c.issue)c.issue.status='closed';if(c.project)c.project.status='Done';c.done=true;save();topNow()}
/* Stage 5 replacement: two evidence-based review missions */
function challengeStepNames(){return [
 ['建立 Repository','Create repository'],['準備檔案與 Commit','Prepare files and commit'],['建立 Issue','Create issue'],
 ['建立 Project 並手動移動','Create project and move it manually'],['建立 Branch','Create branch'],
 ['在 Branch 上提交變更','Commit branch work'],['建立自己的 PR','Open your PR'],['讀取 Review 並修正','Read review and fix'],
 ['合併自己的 PR','Merge your PR'],['開啟隊友的 PR','Open teammate PR'],['查看最新 Diff','View latest diff'],
 ['留下 Review 並要求修改','Request changes'],['閱讀修正事件','Read the fix event'],['再次查看最新 Diff','Recheck latest diff'],
 ['Approve 最新版本','Approve latest version'],['Merge 隊友 PR','Merge teammate PR'],['Project 手動 Done','Set Project Done'],
 ['理解驗收','Understanding check'],['完成','Complete']
]}
function challengeStage(){const c=state.challenge,a=c.missionA,b=c.missionB;
 if(!a.repoCreated)return 0;if(!a.filesCreated)return 1;if(!a.issueCreated)return 2;
 if(!a.projectCreated||a.projectStatus!=='in_progress')return 3;if(!a.branchCreated)return 4;
 if(!a.branchCommitSha)return 5;if(!a.prCreated)return 6;
 if(!a.reviewRead||!a.fixCommitSha)return 7;if(!a.jamieApproved||!a.merged)return 8;
 if(!b.prOpened)return 9;if(!b.jamieFixCommitSha&&(b.diffViewedSha!==b.currentHeadSha||b.selectedDiffLine!=='budget-line'||b.issueCategory!=='missing-currency'))return 10;
 if(!b.reviewComment||!b.changesRequested)return 11;if(!b.jamieFixCommitSha)return 12;
 if(b.latestDiffViewedSha!==b.currentHeadSha||!b.latestDiffLine||!b.fixVerified)return 13;
 if(!b.approved)return 14;if(!b.merged)return 15;if(!b.projectStatusVerified||!b.issueClosureVerified)return 16;
 if(!b.understanding.passed)return 17;return 18
}
function challengeRecord(type,data={}){const c=state.challenge;c.events.push({at:new Date().toISOString(),type,...data});c.progress=Math.min(100,Math.round((challengeStage()/18)*100));persist()}
function challengeFailure(title,body){const c=state.challenge;c.error={title,body};c.errorCount++;challengeRecord('validation_error',{title,body});draw()}
function challengeDismissError(){state.challenge.error=null;save()}
function challengeErrorBox(){const e=state.challenge.error;if(!e)return'';return `<article class="error-scene" role="alert" aria-live="assertive"><h3>${tx(...e.title)}</h3><p>${tx(...e.body)}</p><button class="btn" onclick="challengeDismissError()">${tx('我知道了，回到目前步驟','Close and return to this step')}</button></article>`}
function challengeStatusList(){const c=state.challenge,a=c.missionA,b=c.missionB;
 const rows=[['Repository',a.repoCreated],['main 初始 Commit',a.initialCommitSha],['Issue #1',a.issueCreated],['Project In progress',a.projectStatus==='in_progress'],['Branch Commit',a.branchCommitSha],['自己的 PR 已 Merge',a.merged],['隊友 PR 最新 Diff',b.latestDiffViewedSha===b.currentHeadSha&&!!b.fixVerified],['隊友 PR 已 Approve/Merge',b.merged],['Project Done',b.projectStatusVerified],['Issue closure 已確認',b.issueClosureVerified]];
 return `<ul class="objective-list status-log">${rows.map(([label,ok])=>`<li>${ok?'✓':'○'} ${label}</li>`).join('')}</ul>`}
function challengeObjective(stage){const names=challengeStepNames();const text=[
 ['建立一個 Private Repository，填入名稱並勾選 README。','Create a private repository, give it a name, and add a README.'],
 ['在 main 準備至少三個檔案，寫出有意義的初始 Commit message。','Prepare at least three files on main and write a meaningful initial commit message.'],
 ['建立有標題、驗收條件與 Alex assignee 的 Issue #1。','Create Issue #1 with a title, acceptance criteria, and Alex as assignee.'],
 ['建立 Project、加入 Issue #1，並明確手動把卡片由 Todo 移到 In progress。','Create a Project, add Issue #1, and manually move its card from Todo to In progress.'],
 ['從 main 建立非 main 的工作 Branch。','Create a work branch from main; it must not be main.'],
 ['在原 Branch 編輯檔案，留下包含錯誤預算格式的有意義 Commit。','Edit a file on the original branch and make a meaningful commit containing the intentional budget-format error.'],
 ['建立自己的 PR：base 必須是 main、compare 必須是工作 Branch，並在 body 寫入 Closes #1。','Open your PR with base main, compare your work branch, and include Closes #1 in the body.'],
 ['閱讀 Jamie 的 Request changes，回到原 Branch 修正，並建立新的 fix Commit。','Read Jamie’s request for changes, fix the original branch, and create a new fix commit.'],
 ['確認最新修正已被 Jamie 審查，再由 Alex Merge；不要讓系統自動完成 Project 狀態。','Confirm Jamie reviewed the latest fix, then merge as Alex; Project status must remain manual.'],
 ['開啟系統建立的 Jamie PR，準備扮演 Reviewer。','Open the system-created Jamie PR and act as the reviewer.'],
 ['先查看目前 head SHA 對應的 Files changed / Diff，選取實際錯誤行並分類。','View Files changed / Diff for the current head SHA, select the actual bad line, and classify it.'],
 ['留下具體 Review comment，再選擇 Request changes。','Leave a concrete review comment, then select Request changes.'],
 ['讀取 Jamie 的修正事件，注意新 Commit 會讓舊的審查結果失效。','Read Jamie’s fix event and notice that a new commit invalidates the old review.'],
 ['重新查看最新 SHA 的 Diff，選取修正行並說明已修正。','Reopen the latest SHA’s Diff, select the corrected line, and confirm the fix.'],
 ['只對已查看且確認最新 SHA 的 PR Approve。','Approve only after reviewing and confirming the latest SHA.'],
 ['Merge 隊友 PR，知道 Merge 是把 PR 內容整合進 main。','Merge the teammate PR and understand that Merge integrates the PR into main.'],
 ['手動把 Project 從 In progress 移到 Done，並確認 Issue 關閉原因。','Manually move the Project from In progress to Done and verify why the Issue closed.'],
 ['用三個情境題說明 Commit/main、最新 Diff、Issue/Project 的關係。','Explain the Commit/main, latest Diff, and Issue/Project relationships in three scenarios.'],
 ['完成：你是依證據完成協作流程，不是依按鈕順序通關。','Complete: you finished from evidence, not by following button order.']
 ];return `<p>${tx(...text[stage]||text[18])}</p><p class="field-help">${stage<names.length?`${stage+1}/18：${tx(...names[stage])}`:''}</p>`}
function challengePage(){const c=state.challenge,stage=challengeStage(),names=challengeStepNames();return `<main class="page"><section class="challenge-brief card"><span class="status-badge purple">${tx('第五階段：兩個真實工作任務','Stage 5: two evidence-based tasks')}</span><h1>${tx('國際商務個案競賽協作','International Business Case collaboration')}</h1><p>${tx('你會先完成自己的 PR，再審查隊友的 PR。系統不提供依序亂點就能通關的捷徑：新的 Commit 會改變 head，必須重新查看最新 Diff。','First complete your own PR, then review a teammate PR. There is no sequence-click shortcut: a new commit changes the head, so you must reopen the latest Diff.')}</p><div class="challenge-role"><b>Alex</b><span>${tx('目前學習者角色；Jamie 由系統扮演','Learner role; Jamie is simulated by the system')}</span></div><div class="stage-strip challenge-steps">${names.map((n,i)=>`<div class="stage-chip ${i<stage?'done':i===stage?'current':''}">${i+1}. ${tx(...n)}</div>`).join('')}</div></section><div class="challenge-layout"><aside class="objective-panel card"><h3>${stage===18?tx('挑戰完成','Challenge complete'):tx(...names[stage])}</h3>${challengeObjective(stage)}<hr style="border:0;border-top:1px solid var(--line);margin:15px 0"><p><b>${tx('證據狀態','Evidence state')}</b></p>${challengeStatusList()}<p class="field-help">${tx('Project 狀態必須由你手動移動；Issue 只有在含 Closes #1 的 PR 合併到 main 後才關閉。','Project movement is manual; an Issue closes only when a PR containing Closes #1 is merged into main.')}</p></aside><section>${challengeErrorBox()}${renderChallengeGithub()}</section></div></main>`}
function challengeTabs(){const c=state.challenge;return `<div class="gh-tabs" role="tablist">${['Code','Issues','Pull requests','Projects'].map(x=>`<button class="gh-tab ${c.tab===x?'active':''}" role="tab" aria-selected="${c.tab===x}" onclick="challengeTab('${x}')">${x}</button>`).join('')}</div>`}
function challengeTab(t){state.challenge.tab=t;state.challenge.error=null;save();topNow()}
function challengeShell(body){const c=state.challenge,a=c.missionA;return `<div class="gh-window"><div class="gh-global"><span class="gh-logo" aria-label="GitHub">GH</span><span class="gh-search">Search</span><span style="margin-left:auto">Alex</span></div>${a.repoCreated?`<div class="gh-repohead"><div class="repo-name">alex / ${esc(a.repoName)}</div>${challengeTabs()}</div>`:''}<div class="gh-body">${body}</div></div>`}
function challengeField(label,id,value,handler,placeholder=''){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" class="input" value="${esc(value)}" placeholder="${placeholder}" oninput="${handler}"></div>`}
function challengeDiffLine(id,sign,text,selected=false){return `<button type="button" class="diff-line ${sign==='+'?'add':'del'} ${selected?'selected':''}" aria-pressed="${selected}" onclick="challengeSelectDiffLine('${id}')">${sign} ${esc(text)}</button>`}
function renderChallengeGithub(){const c=state.challenge,stage=challengeStage();if(!c.missionA.repoCreated)return challengeRepoView();if(stage<=8)return challengeMissionA(stage);if(stage<=17)return challengeMissionB(stage);return challengeComplete()}
function challengeRepoView(){const d=state.challenge.drafts;return challengeShell(`<div class="gh-form"><h2>Create a new repository</h2>${challengeField('Repository name','ca-repo',d.repoName,'draftChallenge(\'repoName\',this.value)','campus-market-case')}<fieldset class="field"><legend>Visibility</legend><div class="radio-stack"><label class="radio-card"><input type="radio" name="ca-vis" value="public" ${d.repoVisibility==='public'?'checked':''} onchange="draftChallenge('repoVisibility',this.value)"> Public</label><label class="radio-card"><input type="radio" name="ca-vis" value="private" ${d.repoVisibility==='private'?'checked':''} onchange="draftChallenge('repoVisibility',this.value)"> Private</label></div></fieldset><label class="radio-card"><input id="ca-readme" type="checkbox" ${d.repoReadme?'checked':''} onchange="draftChallenge('repoReadme',this.checked)"> <span>Add a README file</span></label><button class="btn primary" style="margin-top:14px" onclick="challengeCreateRepo()">Create repository</button></div>`)}
function challengeCreateRepo(){const c=state.challenge,d=c.drafts,name=d.repoName.trim();if(!name||d.repoVisibility!=='private'||!d.repoReadme){challengeFailure(['Repository 設定不完整','Repository setup is incomplete'],['請選 Private、勾選 README，並填入 Repository 名稱。','Choose Private, add a README, and provide a repository name.']);return}c.missionA.repoCreated=true;c.missionA.repoName=name;c.missionA.repoVisibility='private';c.missionA.repoReadme=true;c.tab='Code';challengeRecord('repository_created',{name});save();topNow()}
function challengeMissionA(stage){const c=state.challenge,a=c.missionA,d=c.drafts;if(stage===0)return challengeShell(`<div class="notice">${tx('任務 A：你是 Alex，先建立自己的協作空間。','Task A: you are Alex; first create your collaboration space.')}</div>`);if(stage===1){if(!a.filesCreated)return challengeShell(`<h2>Upload files to main</h2><p>${tx('選擇至少三個公開可分享的檔案，再建立初始 Commit。','Select at least three shareable files, then create the initial commit.')}</p><div class="upload-grid">${[['project-plan.md',true],['budget.xlsx',true],['index.html',true],['poster.png',true],['private-notes.txt',false]].map(([n,ok])=>`<label class="upload-item ${ok?'':'private'}"><input type="checkbox" class="ca-file" value="${n}" ${d.files.includes(n)?'checked':''} onchange="draftChallengeFiles()"><span><b>${n}</b><br><small>${ok?'Project material':'Contains private, unverified notes'}</small></span></label>`).join('')}</div><div class="commit-box">${challengeField('Initial Commit message','ca-commit',d.commitMessage,'draftChallenge(\'commitMessage\',this.value)','Add project materials')}<button class="btn primary" onclick="challengeCreateFiles()">Create initial commit</button></div>`);return challengeShell(`<div class="notice success"><b>main</b>：${a.initialCommitSha}<p>${tx('這是普通儲存之外的版本紀錄：Commit 會留下作者、訊息與 SHA。','This is more than ordinary saving: a commit records an author, message, and SHA.')}</p></div>`)}if(stage===2){if(!a.issueCreated)return challengeShell(`<div class="gh-form"><h2>New Issue #1</h2>${challengeField('Title','ca-issue-title',d.issueTitle,'draftChallenge(\'issueTitle\',this.value)','Complete competitor analysis')}<div class="field"><label for="ca-issue-criteria">Acceptance criteria</label><textarea id="ca-issue-criteria" class="textarea" oninput="draftChallenge('issueCriteria',this.value)" placeholder="At least three competitors, prices, features, and sources">${esc(d.issueCriteria)}</textarea></div><div class="field"><label for="ca-issue-assignee">Assignee</label><select id="ca-issue-assignee" class="select" onchange="draftChallenge('issueAssignee',this.value)"><option value="">Unassigned</option><option value="Alex" ${d.issueAssignee==='Alex'?'selected':''}>Alex</option><option value="Jamie" ${d.issueAssignee==='Jamie'?'selected':''}>Jamie</option></select></div><button class="btn primary" onclick="challengeCreateIssue()">Create issue</button></div>`);return challengeShell(`<div class="issue-row"><span class="issue-open">Open</span> <b>#1 ${esc(a.issue.title)}</b><p>${esc(a.issue.criteria)}<br>Assignee: ${esc(a.issue.assignee)}</p></div>`)}if(stage===3){return challengeProjectView()}if(stage===4){return challengeShell(`<div class="gh-form"><h2>Create a branch from main</h2><p class="field-help">${tx('Branch 是同一 Repository 中的另一條工作線；不能把 main 當作新 Branch。','A branch is another line of work in the same repository; main itself is not a new branch.')}</p>${challengeField('Branch name','ca-branch',d.branchName,'draftChallenge(\'branchName\',this.value)','feature/budget-format')}<button class="btn primary" onclick="challengeCreateBranch()">Create branch</button></div>`)}if(stage===5){return challengeShell(`<div class="gh-toolbar"><span class="branch-pill">Branch: ${esc(a.branchName)}</span><span class="status-badge orange">Working tree on branch</span></div><div class="field"><label for="ca-edit">budget.md</label><textarea id="ca-edit" class="textarea" oninput="draftChallenge('editContent',this.value)">${esc(d.editContent||'攤位費：5000')}</textarea><p class="field-help">${tx('這個刻意放入的錯誤會在 Jamie 的 Review 中被指出。','This intentional error will be identified in Jamie’s review.')}</p></div>${challengeField('Branch Commit message','ca-edit-message',d.editMessage,'draftChallenge(\'editMessage\',this.value)','Add budget details')}<button class="btn primary" onclick="challengeCommitOwn()">Create branch commit</button></div>`)}if(stage===6){return challengeShell(`<div class="gh-form"><h2>Open your Pull Request</h2><p class="field-help">${tx('你是 PR 作者 Alex；自己的 PR 不能由 Alex 直接 Approve。','You are the PR author Alex; Alex cannot approve their own PR.')}</p><div class="upload-grid"><div class="field"><label for="ca-base">base</label><select id="ca-base" class="select" onchange="draftChallenge('prBase',this.value)"><option value="main">main</option><option value="${esc(a.branchName)}">${esc(a.branchName)}</option></select></div><div class="field"><label for="ca-compare">compare</label><select id="ca-compare" class="select" onchange="draftChallenge('prCompare',this.value)"><option value="${esc(a.branchName)}">${esc(a.branchName)}</option><option value="main">main</option></select></div></div>${challengeField('Title','ca-pr-title',d.prTitle,'draftChallenge(\'prTitle\',this.value)','Fix campus-market budget')}<div class="field"><label for="ca-pr-body">Description</label><textarea id="ca-pr-body" class="textarea" oninput="draftChallenge('prBody',this.value)" placeholder="Closes #1">${esc(d.prBody)}</textarea></div><button class="btn primary" onclick="challengeCreateOwnPR()">Create pull request</button></div>`)}if(stage===7){return challengeShell(`<div class="review-box"><span class="status-badge orange">Request changes</span><h2>Jamie’s review</h2><p>${esc(a.jamieReview?.comment||'Please add currency and unit to the budget amount.')}</p><p class="field-help">${a.reviewRead?tx('已讀取。請回到原 Branch 建立新的修正 Commit。','Read. Return to the original branch and create a new fix commit.'):tx('先按下「Read Jamie review」，再進行修正。','Read Jamie review before making the fix.')}</p>${a.reviewRead?`${challengeField('Fix content','ca-fix-content',d.fixContent||'攤位費：新台幣 5,000 元','draftChallenge(\'fixContent\',this.value)')}<button class="btn primary" onclick="challengeFixOwn()">Create fix commit</button>`:`<button class="btn primary" onclick="challengeReadJamie()">Read Jamie review</button>`}</div>`)}if(stage===8){return challengeShell(a.merged?`<div class="notice success"><h2>Own PR merged</h2><p>${tx('Jamie 已核准最新修正，Alex 已把 PR 合併到 main。接著進入隊友 PR 的 Review 任務。','Jamie approved the latest fix and Alex merged the PR into main. Next, review the teammate PR.')}</p><button class="btn primary" onclick="challengeOpenTeammatePR()">Open teammate PR</button></div>`:`<div class="notice"><h2>Jamie approved the latest fix</h2><p>${tx('現在由 Alex 明確執行 Merge。Project 仍維持 In progress，需稍後手動移至 Done。','Alex must now execute Merge. Project remains In progress and must be moved to Done later.')}</p><button class="btn primary" onclick="challengeMergeOwn()">Merge own pull request</button></div>`)}return challengeShell(`<div class="notice success"><h2>Own PR merged</h2><p>${tx('Jamie 已核准最新修正，Alex 已把 PR 合併到 main。接著進入隊友 PR 的 Review 任務。','Jamie approved the latest fix and Alex merged the PR into main. Next, review the teammate PR.')}</p><button class="btn primary" onclick="challengeOpenTeammatePR()">Open teammate PR</button></div>`)}
function challengeCreateFiles(){const c=state.challenge,a=c.missionA,d=c.drafts,files=d.files,msg=d.commitMessage.trim(),required=['project-plan.md','budget.xlsx','index.html'];if(required.some(x=>!files.includes(x))||files.includes('private-notes.txt')||files.length<3||!msg||/^update$/i.test(msg)){challengeFailure(['初始檔案或 Commit 不合格','Initial files or commit are invalid'],['至少選三個必需檔案（不可包含 private-notes.txt），並寫清楚 Commit message。','Select at least three required files (not private-notes.txt) and write a clear commit message.']);return}a.filesCreated=true;a.files=Object.fromEntries(files.map(x=>[x,{content:'',branch:'main'}]));a.selectedFiles=files;a.initialCommitSha=uid();challengeRecord('initial_commit_created',{sha:a.initialCommitSha,files});save();topNow()}
function challengeCreateIssue(){const c=state.challenge,a=c.missionA,d=c.drafts,title=d.issueTitle.trim(),criteria=d.issueCriteria.trim();if(!title||!criteria||d.issueAssignee!=='Alex'){challengeFailure(['Issue 資訊不完整','Issue information is incomplete'],['Issue 必須有標題、驗收條件，且 assignee 必須是 Alex。','The Issue needs a title, acceptance criteria, and Alex as assignee.']);return}a.issueCreated=true;a.issue={number:1,title,criteria,assignee:'Alex',status:'open'};challengeRecord('issue_created',{number:1});save();topNow()}
function challengeProjectView(){const a=state.challenge.missionA,d=state.challenge.drafts,status=a.projectStatus;return challengeShell(`<h2>${a.projectCreated?esc(a.projectName):'New Project'}</h2>${!a.projectCreated?`<div class="gh-form">${challengeField('Project name','ca-project',d.projectName,'draftChallenge(\'projectName\',this.value)','Campus market launch')}<label class="radio-card"><input type="checkbox" ${d.addIssue?'checked':''} onchange="draftChallenge('addIssue',this.checked)"> Add Issue #1 to Todo</label><button class="btn primary" style="margin-top:14px" onclick="challengeCreateProject()">Create project</button></div>`:`<p>${tx('這張卡片目前必須手動移動；系統不會因為建立 PR 自動改狀態。','Move this card manually; the system will not change the status when a PR is created.')}</p><div class="board"><div class="board-col"><b>Todo</b>${status==='todo'?'<div class="board-card">#1 '+esc(a.issue.title)+'</div>':''}</div><div class="board-col"><b>In progress</b>${status==='in_progress'?'<div class="board-card">#1 '+esc(a.issue.title)+'</div>':''}</div><div class="board-col"><b>Done</b>${status==='done'?'<div class="board-card">#1 '+esc(a.issue.title)+'</div>':''}</div></div>${status==='todo'?'<button class="btn primary" style="margin-top:14px" onclick="challengeMoveProject()">Move Issue #1 to In progress</button>':''}`}</div>`)}
function challengeCreateProject(){const c=state.challenge,a=c.missionA,d=c.drafts;if(!d.projectName.trim()||!d.addIssue){challengeFailure(['Project 設定不完整','Project setup is incomplete'],['請輸入名稱並把 Issue #1 加入 Todo。','Provide a name and add Issue #1 to Todo.']);return}a.projectCreated=true;a.projectName=d.projectName.trim();a.projectStatus='todo';challengeRecord('project_created',{name:a.projectName,status:'todo'});save();topNow()}
function challengeMoveProject(){const a=state.challenge.missionA;if(!a.projectCreated||a.projectStatus!=='todo')return;a.projectStatus='in_progress';challengeRecord('project_status_changed',{from:'todo',to:'in_progress',manual:true});save();topNow()}
function challengeCreateBranch(){const c=state.challenge,a=c.missionA,d=c.drafts,name=d.branchName.trim();if(!name||name==='main'){challengeFailure(['Branch 不合格','Invalid branch'],['請建立一個不同於 main 的 Branch。','Create a branch different from main.']);return}a.branchCreated=true;a.branchName=name;a.branchContent='攤位費：5000';d.prCompare=name;challengeRecord('branch_created',{name});save();topNow()}
function challengeCommitOwn(){const c=state.challenge,a=c.missionA,d=c.drafts,content=(document.getElementById('ca-edit')?.value||d.editContent||'').trim(),msg=(document.getElementById('ca-edit-message')?.value||d.editMessage||'').trim();d.editContent=content;d.editMessage=msg;if(!content||!content.includes('5000')||!msg||/^update$/i.test(msg)){challengeFailure(['Branch Commit 不合格','Invalid branch commit'],['請保留具體內容並寫出能說明變更的 Commit message。','Keep concrete content and use a commit message that explains the change.']);return}a.branchContent=content;a.branchCommitSha=uid();a.pr={headSha:a.branchCommitSha};challengeRecord('branch_commit_created',{sha:a.branchCommitSha});save();topNow()}
function challengeCreateOwnPR(){const c=state.challenge,a=c.missionA,d=c.drafts,title=d.prTitle.trim(),body=d.prBody.trim();if(d.prBase!=='main'||d.prCompare!==a.branchName||!title||!body||!body.includes('Closes #1')){challengeFailure(['PR 欄位不符合工作流','PR fields do not meet the workflow'],['base 必須是 main、compare 必須是原 Branch，body 必須包含 Closes #1。','base must be main, compare the original branch, and body must include Closes #1.']);return}a.prCreated=true;a.issueLinked=true;a.pr={number:2,title,body,base:'main',compare:a.branchName,headSha:a.branchCommitSha,status:'open'};a.jamieReviewReceived=true;a.jamieReview={author:'Jamie',state:'changes_requested',comment:'請補上攤位費的幣別與單位，例如：新台幣 5,000 元。'};challengeRecord('own_pr_opened',{headSha:a.pr.headSha});challengeRecord('jamie_requested_changes',{pr:2});save();topNow()}
function challengeReadJamie(){const a=state.challenge.missionA;if(!a.jamieReviewReceived)return;a.reviewRead=true;challengeRecord('jamie_review_read',{pr:2});save();topNow()}
function challengeFixOwn(){const c=state.challenge,a=c.missionA,d=c.drafts,content=(document.getElementById('ca-fix-content')?.value||d.fixContent||'').trim();d.fixContent=content;if(!content||!/(新台幣|NT\$|TWD)/i.test(content)||!content.includes('5,000')){challengeFailure(['修正尚未完成','The fix is not complete'],['請在原 Branch 的內容中補上幣別與單位，並使用 5,000 這個格式。','On the original branch, add currency and unit and use the 5,000 format.']);return}a.fixContent=content;a.fixCommitSha=uid();a.pr.headSha=a.fixCommitSha;a.reviewedSha=a.fixCommitSha;a.jamieApproved=true;a.jamieReview={author:'Jamie',state:'approved',comment:'已確認最新修正。'};challengeRecord('own_fix_commit_created',{sha:a.fixCommitSha});challengeRecord('jamie_approved',{reviewedSha:a.fixCommitSha});save();topNow()}
function challengeMergeOwn(){const c=state.challenge,a=c.missionA;if(!a.jamieApproved||a.reviewedSha!==a.pr.headSha){challengeFailure(['不能 Merge 尚未審查的版本','Cannot merge an unreviewed version'],['Jamie 必須核准目前 PR head SHA；新 Commit 會使舊核准失效。','Jamie must approve the current PR head SHA; a new commit invalidates an old approval.']);return}a.merged=true;a.pr.status='merged';if(a.issueLinked&&a.issue&&a.pr.body.includes('Closes #1'))a.issue.status='closed';challengeRecord('own_pr_merged',{sha:a.pr.headSha,issueClosed:a.issue.status==='closed'});save();topNow()}
function challengeOpenTeammatePR(){const c=state.challenge,b=c.missionB;if(b.prOpened)return;const sha=uid();b.prOpened=true;b.currentHeadSha=sha;b.pr={number:3,author:'Jamie',base:'main',compare:'feature/jamie-budget',title:'修正攤位費格式',body:'Please review the budget correction.',status:'open',diff:[['budget-line','-','攤位費：5000'],['context',' ','總預算將於下個版本確認。']]};b.diffViewedSha=null;challengeRecord('teammate_pr_opened',{sha});save();topNow()}
function challengeMissionB(stage){const c=state.challenge,b=c.missionB,d=c.drafts;if(stage===9)return challengeShell(`<div class="notice"><b>Task B：Reviewer</b><p>${tx('Jamie 的 PR 尚未開啟。先開啟隊友 PR，再進入 Files changed。','Jamie’s PR is ready to open. Open the teammate PR, then enter Files changed.')}</p><button class="btn primary" onclick="challengeOpenTeammatePR()">Open teammate PR</button></div>`);if(stage===10)return challengeShell(b.diffViewedSha===b.currentHeadSha?challengeBReviewView(false):challengeInitialDiffGate());if(stage===11)return challengeShell(challengeBReviewView(true));if(stage===12)return challengeShell(`<div class="review-box"><span class="status-badge orange">Request changes 已送出</span><h2>Jamie 的新 Commit</h2><p>${tx('系統模擬 Jamie 依照具體意見修正原 Branch。按下按鈕讀取事件後，head SHA 會更新。','The system simulates Jamie fixing the original branch from your concrete feedback. Read the event; the head SHA will update.')}</p><button class="btn primary" onclick="challengeApplyJamieFix()">Read Jamie fix event</button></div>`);if(stage===13)return challengeShell(challengeLatestDiffView());if(stage===14)return challengeShell(`<div class="review-box"><span class="status-badge green">Fix verified</span><p>Latest reviewed SHA: <code>${esc(b.latestDiffViewedSha)}</code></p><button class="btn blue" onclick="challengeApproveTeammate()">Approve latest reviewed commit</button></div>`);if(stage===15)return challengeShell(`<div class="review-box"><span class="status-badge green">Approved</span><h2>Jamie’s PR</h2><p>${tx('現在可以 Merge；Merge 只會整合到 main，不會自動把 Project 卡片變成 Done。','You may merge now; Merge integrates into main but does not automatically make the Project card Done.')}</p><button class="btn primary" onclick="challengeMergeTeammate()">Merge pull request</button></div>`);if(stage===16)return challengeShell(challengeProjectDoneView());if(stage===17)return challengeShell(challengeUnderstandingView());return challengeShell(challengeComplete())}
function challengeInitialDiffGate(){const b=state.challenge.missionB;return `<div class="review-box"><span class="status-badge green">Open #${b.pr.number}</span><p>${tx('目前 head SHA 已建立，但尚未留下「已查看這個 SHA 的 Diff」證據。','The current head SHA exists, but there is no evidence that you viewed its Diff yet.')}</p><button class="btn primary" onclick="challengeViewInitialDiff()">Open current Files changed</button></div>`}
function challengeViewInitialDiff(){const b=state.challenge.missionB;b.diffViewedSha=b.currentHeadSha;challengeRecord('initial_diff_viewed',{sha:b.currentHeadSha});save();topNow()}
function challengeBReviewView(withForm){const b=state.challenge.missionB,d=state.challenge.drafts;return `<div class="gh-toolbar"><span class="status-badge green">Open #${b.pr.number}</span><span>head SHA: <code>${esc(b.currentHeadSha)}</code></span></div><h2>${esc(b.pr.title)}</h2><p>${tx('請選取真正有問題的刪除行，再分類問題。','Select the actual bad deletion line, then classify the problem.')}</p><div class="diff diff-scroll">${b.pr.diff.map(([id,sign,line])=>challengeDiffLine(id,sign,line,b.selectedDiffLine===id)).join('')}</div><p>Selected line: <b>${esc(b.selectedDiffLine||'none')}</b></p><div class="field"><label for="b-issue-category">Issue category</label><select id="b-issue-category" class="select" onchange="challengeSetBCategory(this.value)"><option value="">Choose category</option><option value="missing-currency" ${b.issueCategory==='missing-currency'?'selected':''}>Missing currency and unit</option><option value="spelling" ${b.issueCategory==='spelling'?'selected':''}>Spelling</option><option value="style" ${b.issueCategory==='style'?'selected':''}>Style only</option></select></div>${withForm?`<div class="field"><label for="b-review-comment">Review comment</label><textarea id="b-review-comment" class="textarea" oninput="draftChallenge('reviewComment',this.value)" placeholder="Explain what is wrong and what the author should change.">${esc(d.reviewComment)}</textarea></div><button class="btn primary" onclick="challengeSubmitBReview()">Request changes</button>`:'<p class="field-help">Select the correct line and issue category to unlock the review form.</p>'}`}
function challengeSelectDiffLine(id){state.challenge.missionB.selectedDiffLine=id;persist();draw()}
function challengeSetBCategory(value){state.challenge.missionB.issueCategory=value;persist()}
function challengeSubmitBReview(){const c=state.challenge,b=c.missionB,comment=c.drafts.reviewComment.trim(),generic=['請修改','有問題','錯了','不正確','改一下'];if(b.diffViewedSha!==b.currentHeadSha||b.selectedDiffLine!=='budget-line'||b.issueCategory!=='missing-currency'){challengeFailure(['Review 證據不足','Review evidence is incomplete'],['請在目前 head SHA 的 Diff 選正確錯誤行，並選擇「Missing currency and unit」。','On the current head SHA, select the correct bad line and choose “Missing currency and unit”.']);return}if(comment.length<12||generic.includes(comment)){challengeFailure(['Review comment 太籠統','Review comment is too vague'],['請說明哪一行、缺少什麼，以及建議的修正；不能只寫「有問題」。','State which line is wrong, what is missing, and the suggested fix; “there is a problem” is not enough.']);return}b.reviewComment=comment;b.changesRequested=true;challengeRecord('review_submitted',{line:b.selectedDiffLine,category:b.issueCategory,comment});save();topNow()}
function challengeApplyJamieFix(){const c=state.challenge,b=c.missionB;if(!b.changesRequested)return;b.jamieFixCommitSha=uid();b.jamieFixEventRead=true;b.currentHeadSha=b.jamieFixCommitSha;b.pr.diff=[['budget-line','+','攤位費：新台幣 5,000 元'],['context',' ','總預算將於下個版本確認。']];b.latestDiffViewedSha=null;b.latestDiffLine=null;b.fixVerified=false;b.approved=false;b.reviewedSha=null;challengeRecord('jamie_fix_commit_created',{sha:b.jamieFixCommitSha,previousSha:b.diffViewedSha});save();topNow()}
function challengeLatestDiffView(){const b=state.challenge.missionB;return `<div class="review-box"><span class="status-badge orange">New commit: ${esc(b.jamieFixCommitSha)}</span><p>${tx('這是新的 head；舊 Diff 與舊核准都不再代表目前內容。','This is a new head; the old Diff and approval no longer represent the current content.')}</p>${!b.latestDiffViewedSha?`<button class="btn primary" onclick="challengeViewLatestDiff()">Open latest Files changed</button>`:`<div><p>Latest Diff SHA: <code>${esc(b.latestDiffViewedSha)}</code></p><div class="diff diff-scroll">${b.pr.diff.map(([id,sign,line])=>challengeDiffLine(id,sign,line,b.latestDiffLine===id)).join('')}</div><p>Selected line: <b>${esc(b.latestDiffLine||'none')}</b></p><div class="field"><label for="b-fix-confirmation">Verification</label><select id="b-fix-confirmation" class="select" onchange="challengeSetFixConfirmation(this.value)"><option value="">Choose verification</option><option value="fixed" ${b.fixConfirmation==='fixed'?'selected':''}>The currency and unit are now explicit</option><option value="not-fixed" ${b.fixConfirmation==='not-fixed'?'selected':''}>The problem remains</option></select></div><button class="btn primary" onclick="challengeConfirmFix()">Confirm the fix</button></div>`}</div>`}
function challengeViewLatestDiff(){const b=state.challenge.missionB;b.latestDiffViewedSha=b.currentHeadSha;challengeRecord('latest_diff_viewed',{sha:b.currentHeadSha});save();topNow()}
function challengeSetFixConfirmation(value){state.challenge.missionB.fixConfirmation=value;persist()}
function challengeConfirmFix(){const b=state.challenge.missionB;if(b.latestDiffViewedSha!==b.currentHeadSha||b.latestDiffLine!=='budget-line'||b.fixConfirmation!=='fixed'){challengeFailure(['修正驗證不足','Fix verification is incomplete'],['請重新查看最新 Diff、選取修正行，並確認幣別與單位已明確。','Reopen the latest Diff, select the corrected line, and confirm that currency and unit are explicit.']);return}b.fixVerified=true;challengeRecord('fix_verified',{sha:b.currentHeadSha});save();topNow()}
function challengeApproveTeammate(){const b=state.challenge.missionB;if(!b.fixVerified||b.latestDiffViewedSha!==b.currentHeadSha){challengeFailure(['不能 Approve 舊版本','Cannot approve an old version'],['Approve 前必須查看並確認目前 head SHA 的最新 Diff。','Before approving, review and confirm the latest Diff for the current head SHA.']);return}b.approved=true;b.reviewedSha=b.currentHeadSha;challengeRecord('approved',{reviewedSha:b.reviewedSha});save();topNow()}
function challengeMergeTeammate(){const c=state.challenge,b=c.missionB;if(!b.approved||b.reviewedSha!==b.currentHeadSha){challengeFailure(['不能 Merge 未審查的 head','Cannot merge an unreviewed head'],['目前 head SHA 尚未被 Approve；請重新查看最新 Diff。','The current head SHA is not approved; reopen the latest Diff.']);return}b.merged=true;challengeRecord('teammate_pr_merged',{sha:b.currentHeadSha});save();topNow()}
function challengeProjectDoneView(){const c=state.challenge,a=c.missionA,b=c.missionB;return `<div class="notice ${a.projectStatus==='done'?'success':'warn'}"><h2>Project status</h2><p>Current: <b>${esc(a.projectStatus)}</b></p><p>${tx('真實 GitHub Projects 可以設定 workflow automation，自動依 Issue 或 PR 事件更新狀態；本挑戰要求手動更新，是為了確認你理解每個狀態的意義。','Real GitHub Projects can configure workflow automation to update status from Issue or PR events; this challenge requires a manual update so you demonstrate what each status means.')}</p>${a.projectStatus!=='done'?'<button class="btn primary" onclick="challengeSetProjectDone()">Move Project to Done manually</button>':'<button class="btn primary" onclick="challengeVerifyProjectDone()">Verify Project and Issue status</button>'}</div><div class="status-log"><p><b>Issue #1</b>：${esc(a.issue?.status||'unknown')}</p><p>${tx('Closes #1 只在 PR 合併到 main 後才會讓 Issue 關閉；Merge 不會無條件關閉任意 Issue。','Closes #1 closes the Issue only after the PR merges into main; Merge does not unconditionally close any Issue.')}</p>${b.issueClosureVerified?'<p class="notice success">Issue closure verified.</p>':''}</div>`}
function challengeSetProjectDone(){const a=state.challenge.missionA;if(a.projectStatus!=='in_progress')return; a.projectStatus='done';challengeRecord('project_status_changed',{from:'in_progress',to:'done',manual:true});save();topNow()}
function challengeVerifyProjectDone(){const c=state.challenge,a=c.missionA,b=c.missionB;if(a.projectStatus!=='done'||!b.merged){challengeFailure(['Project 尚未能驗收','Project is not ready to verify'],['請先 Merge 隊友 PR，再手動把 Project 設為 Done。','Merge the teammate PR, then manually set Project to Done.']);return}b.projectStatusVerified=true;b.issueClosureVerified=a.issue?.status==='closed'&&a.issueLinked;challengeRecord('status_verified',{projectDone:b.projectStatusVerified,issueClosed:b.issueClosureVerified});save();topNow()}
function challengeUnderstandingView(){const u=state.challenge.missionB.understanding;return `<div class="understanding-grid"><article class="understanding-card"><h2>Understanding check</h2><p>${tx('請用情境判斷並寫理由；不是重複定義。','Use scenario reasoning and explain why; do not repeat definitions.')}</p>${challengeUnderstandingSelect('u-q1','q1',u.q1,'你在 main 上按儲存，但尚未建立 Commit。隊友問「什麼能讓他看到可追蹤的版本？」',['','Commit','Project status'],['選擇','Commit','Project status'])}${challengeUnderstandingReason('u-r1','r1',u.r1,'說明你的判斷。')} </article><article class="understanding-card">${challengeUnderstandingSelect('u-q2','q2',u.q2,'PR 建立後，作者又推了一個新的修正 Commit。你已看過舊 Diff；現在要 Approve 嗎？',['','review-again','approve-old'],['選擇','先查看最新 Diff','直接 Approve'])}${challengeUnderstandingReason('u-r2','r2',u.r2,'為什麼？')}</article><article class="understanding-card">${challengeUnderstandingSelect('u-q3','q3',u.q3,'Issue 已因 Closes #1 合併而關閉，但 Project 卡片仍在 In progress。這代表什麼？',['','different','same'],['選擇','兩者是不同狀態，Project 要依流程更新','Issue 關閉會自動代表 Project Done'])}${challengeUnderstandingReason('u-r3','r3',u.r3,'請用本次流程說明。')}<button class="btn primary" onclick="challengeSubmitUnderstanding()">Submit understanding check</button></article></div>`}
function challengeUnderstandingSelect(id,key,value,label,values,labels){return `<div class="field"><label for="${id}">${label}</label><select id="${id}" class="select" onchange="challengeDraftUnderstanding('${key}',this.value)">${values.map((v,i)=>`<option value="${v}" ${value===v?'selected':''}>${labels[i]}</option>`).join('')}</select></div>`}
function challengeUnderstandingReason(id,key,value,label){return `<div class="field"><label for="${id}">${label}</label><textarea id="${id}" class="textarea" oninput="challengeDraftUnderstanding('${key}',this.value)">${esc(value)}</textarea></div>`}
function challengeDraftUnderstanding(key,value){state.challenge.missionB.understanding[key]=value;persist()}
function challengeSubmitUnderstanding(){const u=state.challenge.missionB.understanding;if(u.q1!=='Commit'||u.q2!=='review-again'||u.q3!=='different'||[u.r1,u.r2,u.r3].some(x=>x.trim().length<8)){challengeFailure(['請補完情境理由','Complete the scenario explanations'],['三題都要選對，且每個理由至少說明一個因果關係。','Choose all three correctly and give each reason at least one causal explanation.']);return}u.passed=true;state.challenge.done=true;challengeRecord('understanding_passed');save();topNow()}
function challengeComplete(){return `<div class="notice success"><h2>${tx('第五階段完成','Stage 5 complete')}</h2><p>${tx('你已經查看最新 Diff、留下具體 Review、要求修改、重新驗證、Approve、Merge，並分別確認 Issue 與 Project 狀態。','You viewed the latest Diff, left a concrete Review, requested changes, re-verified, approved, merged, and confirmed Issue and Project separately.')}</p><div class="challenge-score">100%</div><button class="btn blue" onclick="openExtension()">Open Git command extension</button></div>`}

function renderReviewPractice(){const p=state.practice,d=p.drafts;if(p.review.status==='approved')return ghShell('Pull requests',`<span class="status-badge green">Approved</span><div class="diff"><div class="diff-line del">- 攤位費：5000</div><div class="diff-line add">+ 攤位費：新台幣 5,000 元</div></div><div class="review-box">✓ ${tx('修正已確認','Fix verified')}</div>`);if(p.review.status==='changes_requested'&&!p.review.fixed)return ghShell('Pull requests',`<span class="status-badge orange">Changes requested</span><div class="review-box"><b>${tx('Review 留言','Review comment')}：</b>${tx('請補上幣別與單位。','Please add currency and unit.')}</div><div class="field" style="margin-top:14px"><label for="p-fix-editor">${tx('回到 Branch 修正內容','Fix the branch content')}</label><textarea id="p-fix-editor" class="textarea" oninput="draftPractice('fixContent',this.value)">${esc(d.fixContent||p.files['competitor-research.md']?.content||'')}</textarea></div><button class="btn primary" onclick="fixPracticeReview()">${tx('建立修正 Commit','Create fix commit')}</button>`);if(p.review.status==='changes_requested'&&p.review.fixed)return ghShell('Pull requests',`<div class="diff"><div class="diff-line del">- 攤位費：5000</div><div class="diff-line add">+ 攤位費：新台幣 5,000 元</div></div><div class="review-box"><h3>Submit review</h3><button class="btn primary" onclick="approvePracticeReview()">Approve</button></div>`);return ghShell('Pull requests',`<h2>Files changed</h2><div class="diff"><div class="diff-line add">+ 競品 A：草悟道市集</div><div class="diff-line add spotlight">+ 攤位費：5000</div></div><div class="review-box"><label>${tx('審核結果','Review decision')}</label><div class="btn-row" style="margin-top:8px"><button class="btn" onclick="requestPracticeChanges()">Request changes</button><button class="btn primary" onclick="badApprovePractice()">Approve</button></div></div>`)}
function fixPracticeReview(){const p=state.practice,content=(p.drafts.fixContent||'').trim();if(!/新台幣\s*5,?000\s*元/.test(content)){p.error={title:['回饋尚未被處理','The feedback is not resolved'],body:['內容仍缺少「新台幣」與「元」。請真正修改檔案後再提交。','The content still lacks “NT$” and the currency unit. Edit the file before submitting.'],recover:'dismiss'};save();return}p.files['competitor-research.md'].content=content;p.commits.unshift({id:uid(),message:'補上攤位費幣別與單位',branch:p.branch});p.review.fixed=true;p.drafts.fixContent='';save();topNow()}

function openExtension(){if(!state.challenge.done)return;state.extension=state.extension||{step:0,input:'',lines:[{kind:'ok',text:'Git command extension ready.'}],cwd:'~',repo:false,staged:false,committed:false,remote:false,pushed:false,branch:'main'};state.modal='extension';save()}
const extLessons=[
 ['確認 Git 與設定作者','Check Git and configure identity','git --version\ngit config --global user.name "Alex"\ngit config --global user.email "alex@example.com"'],
 ['建立本機專案','Create a local project','mkdir case-project\ncd case-project\ngit init'],
 ['查看、暫存與 Commit','Inspect, stage, and commit','git status\ngit add .\ngit commit -m "建立個案競賽專案"'],
 ['連接遠端與 Push','Connect remote and push','git remote add origin https://github.com/alex/case-project.git\ngit push -u origin main'],
 ['建立 Branch','Create a branch','git switch -c feature/competitor-analysis'],
 ['查看差異與歷史','Inspect differences and history','git diff\ngit log --oneline'],
 ['同步正式版本','Synchronize the official branch','git switch main\ngit pull origin main'],
 ['復原安全觀念','Learn safe recovery','git restore file.md\ngit revert <commit-id>']
];
function extensionModal(){const e=state.extension||{},lesson=extLessons[e.step||0];return `<div class="modal-wrap"><div class="modal" style="max-width:960px"><div class="modal-head"><h2>${tx('Git 指令延伸課','Git command extension')}</h2><button class="modal-close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="notice"><b>${tx('主課程已完成。','The core course is complete.')}</b> ${tx('現在才引入本機、遠端與 push，避免初學時混淆。','Local, remote, and push are introduced only now to avoid early confusion.')}</div><div class="section-head"><h2>${e.step+1} / ${extLessons.length} · ${tx(lesson[0],lesson[1])}</h2><p>${tx('建議指令','Suggested commands')}</p></div><pre class="card" style="padding:13px;overflow:auto">${esc(lesson[2])}</pre><div class="terminal"><div class="terminal-head">Terminal</div><div class="terminal-output" id="ext-out">${(e.lines||[]).map(x=>`<div class="${x.kind||''}">${esc(x.text)}</div>`).join('')}</div><div class="terminal-row"><span class="prompt">alex@laptop:${esc(e.cwd||'~')}$</span><input id="ext-input" onkeydown="if(event.key==='Enter')runExt()" placeholder="git status"><button class="btn primary" onclick="runExt()">Enter</button></div></div><div class="btn-row" style="margin-top:14px"><button class="btn" onclick="extStep(-1)" ${e.step===0?'disabled':''}>${tx('上一課','Previous lesson')}</button><button class="btn blue" onclick="extStep(1)" ${e.step===extLessons.length-1?'disabled':''}>${tx('下一課','Next lesson')}</button></div></div></div></div>`}
function extStep(d){state.extension.step=Math.max(0,Math.min(extLessons.length-1,state.extension.step+d));save();topNow()}
function runExt(){const e=state.extension,input=document.getElementById('ext-input')?.value.trim();if(!input)return;e.lines.push({kind:'cmd',text:'$ '+input});let out='';if(input==='help')out='git --version | git config | git init | git status | git add . | git commit -m "..." | git remote add origin URL | git push | git switch -c NAME | git diff | git log --oneline | git pull | git restore | git revert';else if(input==='git --version')out='git version 2.48.1';else if(input.startsWith('git config'))out='設定已儲存';else if(input.startsWith('mkdir ')){e.cwd='~/'+input.slice(6);out='資料夾已建立'}else if(input.startsWith('cd ')){e.cwd='~/'+input.slice(3);out='已切換資料夾'}else if(input==='git init'){e.repo=true;out='Initialized empty Git repository'}else if(input==='git status')out=e.committed?'nothing to commit, working tree clean':e.staged?'Changes to be committed':'Untracked files: project files';else if(input==='git add .'){e.staged=true;out='已將目前修改加入暫存區'}else if(input.startsWith('git commit -m')){if(!e.staged)out='error: nothing added to commit';else{e.committed=true;e.staged=false;out='[main a1b2c3d] '+(input.match(/"(.+)"/)?.[1]||'commit')}}else if(input.startsWith('git remote add origin')){e.remote=true;out='遠端 origin 已設定'}else if(input.startsWith('git push')){if(!e.remote||!e.committed)out='error: 請先建立 Commit 並設定 remote';else{e.pushed=true;out='main -> origin/main'}}else if(input.startsWith('git switch -c ')){e.branch=input.slice(14);out='Switched to a new branch '+e.branch}else if(input==='git diff')out='diff --git a/file.md b/file.md\n+ 新增競爭者分析';else if(input==='git log --oneline')out=e.committed?'a1b2c3d 建立個案競賽專案':'尚未有 Commit';else if(input.startsWith('git switch main')){e.branch='main';out='Switched to branch main'}else if(input.startsWith('git pull'))out='Already up to date.';else if(input.startsWith('git restore'))out='工作目錄檔案已還原';else if(input.startsWith('git revert'))out='建立一筆反向 Commit，保留歷史';else out='找不到指令。輸入 help 查看支援的教學指令。';e.lines.push({kind:out.startsWith('error')?'err':'ok',text:out});save();setTimeout(()=>{const x=document.getElementById('ext-out');if(x)x.scrollTop=x.scrollHeight},0)}
/* modal generic */
function genericModal(m){const good=m.type==='ok';return `<div class="modal-wrap" role="presentation" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="generic-modal-title"><div class="modal-head"><h2 id="generic-modal-title">${tx(...m.title)}</h2><button class="modal-close" onclick="closeModal()" aria-label="Close">×</button></div><div class="modal-body"><div class="notice ${good?'success':'warn'}">${tx(...m.body)}</div><div class="btn-row" style="margin-top:16px"><button class="btn primary" onclick="closeModal()">${tx('了解','Continue')}</button></div></div></div></div>`}
function modalView(){if(!state.modal)return'';if(state.modal==='terms')return termsModal();if(state.modal==='extension')return extensionModal();if(typeof state.modal==='object')return genericModal(state.modal);return''}
function draw(){const app=document.getElementById('app');const content=state.phase===1?scenarioPage():state.phase===2?thinkingPage():state.phase===3?demoPage():state.phase===4?practicePage():challengePage();app.innerHTML=header()+content+modalView();requestAnimationFrame(()=>{if(state.modal){const first=document.querySelector('.modal button,.modal input,.modal textarea,.modal select');if(first)first.focus();return}if(focusRequested){const heading=document.querySelector('main h1,main h2');if(heading){heading.setAttribute('tabindex','-1');heading.focus()}focusRequested=false}})}
draw();
</script>
</body>
</html>
