<style id="legacy-styles" media="not all">

  --blue:#f54e00;--blue2:#fff0e8;--purple:#5a5852;--nav:#26251e;
  --radius:12px;--focus:0 0 0 3px rgba(245,78,0,.18);--header-height:64px;--sticky-top:80px
}

/* Course shell */

.header-main{height:100%;display:flex;align-items:center;gap:16px;padding:0 clamp(16px,2.4vw,40px)}
.brand{display:flex;align-items:center;gap:12px;min-width:250px}.brand-mark{width:34px;height:34px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:18px;font-weight:600}.brand-title{font-size:16px;font-weight:600;letter-spacing:-.01em}.brand-sub{font-size:11px;color:var(--muted);letter-spacing:.02em}
.header-spacer{flex:1}.header-actions{display:flex;align-items:center;gap:8px}.language-control{display:flex;align-items:center;gap:8px}.header-actions label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.header-actions select{height:40px;background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);border-radius:8px;padding:0 32px 0 12px}
.header-btn{min-height:40px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:8px;padding:0 14px;font-size:14px;font-weight:500}.header-btn:hover{border-color:var(--ink);background:var(--canvas-soft)}
.course-shell{display:flex;align-items:flex-start;min-height:calc(100dvh - var(--header-height))}.course-content{min-width:0;flex:1}
.course-rail{position:sticky;top:var(--header-height);z-index:30;flex:0 0 224px;width:224px;height:calc(100dvh - var(--header-height));display:flex;flex-direction:column;background:var(--canvas);border-right:1px solid var(--line);transition:width .18s ease,flex-basis .18s ease}
.course-rail.collapsed{flex-basis:72px;width:72px}.course-rail-head{padding:24px 20px 12px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}.course-rail .course-nav-list{padding:8px 12px;overflow:auto}.course-rail.collapsed .course-rail-head,.course-rail.collapsed .course-nav-item>span:last-child,.course-rail.collapsed .rail-collapse span:last-child{position:absolute;clip:rect(0 0 0 0);clip-path:inset(50%);width:1px;height:1px;overflow:hidden;white-space:nowrap}.course-rail.collapsed .course-nav-item{grid-template-columns:1fr;justify-items:center;padding-inline:8px}.rail-collapse{margin:auto 12px 16px;min-height:40px;border:0;border-top:1px solid var(--line);background:transparent;color:var(--muted);display:flex;align-items:center;gap:10px;padding:14px 8px 0;font-size:13px}.rail-collapse:hover{color:var(--ink)}
.course-nav-list{display:grid;gap:4px}.course-nav-item{position:relative;display:grid;grid-template-columns:28px minmax(0,1fr);align-items:center;gap:10px;width:100%;min-height:58px;border:0;border-left:3px solid transparent;border-radius:8px;background:transparent;color:var(--muted);padding:8px 8px 8px 5px;text-align:left}.course-nav-item:hover:not(:disabled){background:var(--line-soft);color:var(--ink)}.course-nav-item.current{background:var(--surface);color:var(--ink);border-left-color:var(--primary)}.course-nav-item.available{color:var(--ink)}.course-nav-item.done{color:var(--green)}.course-nav-item.locked{opacity:.45}.phase-no{width:26px;height:26px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;font-size:12px;flex:none}.course-nav-item.current .phase-no{border-color:var(--primary);color:var(--primary)}.course-nav-item b{display:block;font-size:13px;font-weight:600;letter-spacing:0}.course-nav-item small{display:block;color:var(--muted);font-size:11px;margin-top:1px}

/* Editorial workspace */
.page{width:min(100%,1320px);margin:0 auto;padding:32px clamp(20px,3vw,48px) 64px}.page.with-terms{display:block}.maincol{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:none}

.section-head{margin:56px 0 20px;display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,.45fr);gap:24px;align-items:end}.section-head h2{margin:0;font-size:30px;line-height:1.2}.section-head p{margin:0;color:var(--muted)}
.btn{min-height:40px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:8px;padding:0 16px;font-size:14px;font-weight:500}.btn:hover{border-color:var(--ink);background:var(--canvas-soft)}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.primary:hover{background:var(--primary-active);border-color:var(--primary-active)}.btn.blue{background:var(--ink);border-color:var(--ink);color:var(--canvas)}.btn.blue:hover{background:#3b3931}.btn.danger{background:var(--red);border-color:var(--red);color:#fff}.btn.link{min-height:36px;border:0;background:transparent;color:var(--ink);padding:0 4px;text-decoration:underline;text-underline-offset:3px}.btn-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn-block{width:100%}
.notice{border:1px solid var(--line-strong);border-left:3px solid var(--primary);background:var(--canvas-soft);padding:14px 16px;border-radius:8px}.notice.warn{border-left-color:var(--orange);background:var(--orange2)}.notice.danger{border-left-color:var(--red);background:var(--red2)}.notice.success{border-left-color:var(--green);background:var(--green2)}
.status-badge{display:inline-block;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--line-soft);color:var(--body)}.status-badge.green{background:var(--green2);color:var(--green)}.status-badge.orange{background:var(--orange2);color:var(--orange)}.status-badge.purple{background:var(--primary-soft);color:var(--primary)}
.en-only{display:block}

/* Terminology dock */
.terms-panel{margin-top:32px;overflow:hidden;background:transparent}.terms-head{min-height:48px;padding:0 4px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}.terms-head b{font-size:13px;font-weight:600;letter-spacing:.02em}.terms-body{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:12px 0 0}.term-card{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--surface)}.term-card.active{border-color:var(--primary);box-shadow:none}.term-card h3{font-size:14px;font-weight:600;letter-spacing:0;margin:0 0 5px}.term-card p{font-size:12px;color:var(--muted);margin:4px 0}.term-en{color:var(--ink);font-weight:600}.term-where{font-size:11px;background:var(--canvas);border-radius:6px;padding:6px 8px;margin-top:7px}.mobile-terms{display:none;position:fixed;right:16px;bottom:76px;z-index:70;border-radius:8px}

/* Phase 1 */
.story-layout{display:grid;grid-template-columns:minmax(360px,.85fr) minmax(460px,1.15fr);gap:24px;align-items:start}.phone{border:1px solid #3c3a34;border-radius:12px;background:#26251e;color:#fff;overflow:hidden}.phone-head{padding:14px 16px;background:#343229;border-bottom:1px solid #4b4940;font-weight:600;display:flex;justify-content:space-between}.chat{padding:16px;min-height:500px}.bubble{max-width:88%;padding:10px 12px;border-radius:8px;margin:9px 0;background:#3b3931}.bubble.me{margin-left:auto;background:#5b3a29}.bubble small{display:block;color:#d2cfc5;margin-bottom:3px}.file-bubble{border:1px solid #666258;padding:10px;border-radius:6px;margin-top:7px;background:#302f29;font-size:13px}
.problem-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.problem-card{padding:16px;text-align:left;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:126px;color:var(--ink)}.problem-card:hover{border-color:var(--ink)}.problem-card.found{border-color:var(--green);border-left-width:3px;padding-left:14px}.problem-card b{display:block;margin-bottom:6px;font-weight:600}.problem-card p{font-size:13px;color:var(--muted);margin:0}.problem-result{margin-top:12px;padding:20px}.problem-result h3{font-weight:600;letter-spacing:0}.progress-note{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}

/* Phase 2 */
.think-shell{display:grid;grid-template-columns:280px minmax(0,1fr);gap:24px}.pain-list{padding:8px}.pain-btn{width:100%;border:0;border-left:3px solid transparent;background:transparent;padding:12px;text-align:left;border-radius:6px;margin-bottom:2px;color:var(--ink)}.pain-btn:hover{background:var(--canvas)}.pain-btn.active{border-left-color:var(--primary);background:var(--primary-soft);box-shadow:none}.pain-btn.done{border-left-color:var(--green);background:transparent}.pain-btn b{font-weight:600}.need-options{display:grid;gap:8px;margin-top:16px}.need-option{min-height:48px;padding:12px 14px;text-align:left;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink)}.need-option:hover{border-color:var(--ink)}.concept-reveal{padding:20px;margin-top:16px}.concept-reveal h2{font-size:26px}.git-github{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.concept-box{padding:20px}.concept-box h3{margin:0 0 7px;font-weight:600}

/* Stage headers and teaching panels */

.demo-shell,.guided-layout{display:grid;grid-template-columns:minmax(280px,320px) minmax(0,1fr);gap:16px;align-items:start;min-width:0}.guided-layout>section,.challenge-layout>section{min-width:0}.demo-narrator,.mission{min-width:0;padding:20px;position:sticky;top:var(--sticky-top);align-self:start;display:flex;flex-direction:column;max-height:calc(100dvh - var(--sticky-top) - 16px);overflow:auto;scrollbar-gutter:stable}.demo-narrator h2,.mission h3{font-size:22px;margin:8px 0 8px}.demo-block{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.demo-block p{margin:4px 0}.demo-label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.08em;text-transform:uppercase}.demo-controls{display:flex;gap:8px;flex-wrap:wrap;position:sticky;bottom:0;z-index:2;margin-top:16px;padding:12px 0 0;background:var(--surface);border-top:1px solid var(--line)}.demo-progress{height:3px;background:var(--line);overflow:hidden;margin:10px 0}.demo-progress i{display:block;height:100%;background:var(--primary)}.demo-shield{position:absolute;inset:0;background:transparent;z-index:3}.demo-stage{position:relative;min-width:0}.demo-guide{display:flex;gap:10px;align-items:flex-start;margin:0 0 12px;padding:10px 12px;border:1px solid var(--primary);border-radius:8px;background:var(--primary-soft)}.demo-guide-no{flex:0 0 auto;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;font-weight:600}.demo-guide b{display:block;color:var(--primary);margin-bottom:3px}.demo-guide p{margin:0}.demo-focus{position:relative;z-index:1;outline:3px solid var(--primary)!important;outline-offset:2px;border-radius:7px}.demo-focus::after{content:'現在看這裡';position:absolute;right:0;top:-28px;padding:4px 7px;border-radius:5px 5px 0 0;background:var(--primary);color:#fff;font-size:12px;font-weight:600;white-space:nowrap}.spotlight{outline:3px solid rgba(245,78,0,.35);border-radius:7px}
.mission h3{font-weight:600;letter-spacing:0}.mission>p{margin-top:0}.predict{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.predict-option{display:block;width:100%;min-height:44px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;margin-top:7px;color:var(--ink)}.predict-option:hover{border-color:var(--ink)}.predict-option.correct{border-color:var(--green);background:var(--green2)}.predict-option.wrong{border-color:var(--red);background:var(--red2)}.hint-box{margin-top:12px;padding:12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--canvas);font-size:13px}.result-card,.reflection{padding:18px;margin-top:14px}.error-scene{padding:18px;margin-bottom:14px;border:1px solid var(--red);border-left-width:3px;background:var(--red2);border-radius:8px}.error-scene h3{margin:0 0 7px;color:var(--red);font-weight:600}.consequence{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.consequence>div{background:var(--surface);border:1px solid #e9a9b9;border-radius:8px;padding:12px}.step-done{border-color:var(--green);background:var(--green2)}

/* Phase 5 */
.challenge-brief.card{display:block}.challenge-brief::before{display:block;margin:0 0 12px}.challenge-brief h1{max-width:900px;margin:0 0 10px;font-size:36px;line-height:1.2}.challenge-brief>p{max-width:900px;margin:0 0 16px}.challenge-role{display:inline-flex;gap:8px;align-items:center;border-left:3px solid var(--primary);padding:5px 0 5px 10px}.challenge-role b{font-weight:600}.challenge-role span{color:var(--muted);font-size:13px}.stage-strip{display:flex;gap:6px;margin-top:16px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}.stage-chip{flex:0 0 132px;border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center;font-size:11px;background:var(--surface);color:var(--muted)}.stage-chip.done{border-color:var(--green);color:var(--green)}.stage-chip.current{border-color:var(--primary);border-bottom-width:3px;padding-bottom:6px;color:var(--ink)}.challenge-layout{display:grid;grid-template-columns:minmax(240px,280px) minmax(0,1fr);gap:16px;margin-top:16px;align-items:start}.objective-panel{padding:18px;position:sticky;top:var(--sticky-top);align-self:start;max-height:calc(100dvh - var(--sticky-top) - 16px);overflow:auto;scrollbar-gutter:stable}.objective-panel h3{margin:0 0 8px;font-size:21px;font-weight:600}.objective-list{padding-left:20px;color:var(--muted)}.challenge-score{font-size:30px;font-weight:400;color:var(--green)}.status-log{border-top:1px solid var(--line);padding:10px 0 0;margin-top:12px}.status-log li{margin:4px 0}.understanding-grid{display:grid;gap:12px;margin-top:14px}.understanding-card{border:1px solid var(--line);border-radius:8px;padding:14px}.field-help{font-size:13px;color:var(--muted);margin:5px 0 0}

/* GitHub simulator: intentionally preserves the previous visual language */
.gh-window{--surface:#fff;--ink:#1f2328;--muted:#59636e;--line:#d0d7de;--soft:#eef2f5;--blue:#0969da;--blue2:#ddf4ff;--green:#1a7f37;--green2:#dafbe1;--orange:#9a6700;--orange2:#fff8c5;--red:#cf222e;--red2:#ffebe9;--purple:#8250df;max-width:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden;min-height:480px}.gh-window p{color:inherit}.gh-global{background:#24292f;color:#fff;padding:9px 12px;display:flex;align-items:center;gap:12px}.gh-logo{width:30px;height:30px;border-radius:50%;background:#fff;color:#24292f;display:grid;place-items:center;font-weight:800}.gh-search{background:#0d1117;border:1px solid #57606a;border-radius:6px;color:#afb8c1;padding:6px 10px;min-width:220px}.gh-repohead{padding:12px 16px 0;border-bottom:1px solid var(--line);background:#f6f8fa}.repo-name{font-size:18px;color:var(--blue);font-weight:650}.gh-tabs{display:flex;gap:18px;margin-top:12px;overflow:auto}.gh-tab{border:0;background:transparent;padding:8px 2px;border-bottom:2px solid transparent;white-space:nowrap}.gh-tab.active{border-bottom-color:#fd8c73;font-weight:700}.gh-body{padding:14px}.gh-toolbar{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:12px}.branch-pill{border:1px solid var(--line);background:#f6f8fa;border-radius:7px;padding:7px 10px}.file-table{border:1px solid var(--line);border-radius:8px;overflow:hidden}.file-row{display:grid;grid-template-columns:minmax(0,1fr) 170px 90px;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px}.file-row:last-child{border-bottom:0}.file-name{color:var(--blue);font-weight:600}.gh-empty{text-align:center;padding:48px 20px;color:var(--muted)}.gh-form{max-width:720px}.field{margin-bottom:14px}.field label{display:block;font-weight:650;margin-bottom:6px}.input,.textarea,.select{width:100%;border:1px solid var(--line);border-radius:7px;background:#fff;padding:9px 10px}.textarea{min-height:130px;resize:vertical}.radio-stack{display:grid;gap:8px}.radio-card{display:flex;gap:10px;border:1px solid var(--line);border-radius:8px;padding:12px}.radio-card:has(input:checked){border-color:var(--blue);box-shadow:0 0 0 4px rgba(9,105,218,.18)}.upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.upload-item{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px}.upload-item.private{border-color:var(--orange);background:var(--orange2)}.commit-box{border:1px solid var(--line);background:#f6f8fa;border-radius:8px;padding:13px;margin-top:14px}.issue-row{border:1px solid var(--line);border-radius:8px;padding:13px;margin-bottom:9px}.issue-open{color:var(--green)}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;overflow:auto}.board-col{background:#f6f8fa;border:1px solid var(--line);border-radius:8px;padding:10px;min-height:240px}.board-card{background:#fff;border:1px solid var(--line);border-radius:7px;padding:10px;margin-top:8px}.diff{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;border:1px solid var(--line);border-radius:7px;overflow:hidden;font-size:13px}.diff-line{display:block;width:100%;padding:9px 10px;text-align:left;border:0;border-bottom:1px solid rgba(31,35,40,.08);font:inherit}.diff-line:last-child{border-bottom:0}.diff-line.add{background:#dafbe1}.diff-line.del{background:#ffebe9}.diff-line.selected{outline:3px solid var(--blue);outline-offset:-3px}.diff-scroll{max-width:100%;overflow:auto}.review-box{border:1px solid var(--line);border-radius:8px;padding:13px;margin-top:13px}.gh-window .status-badge{background:var(--soft);color:var(--ink);font-size:12px;font-weight:700;letter-spacing:0;text-transform:none}.gh-window .status-badge.green{background:var(--green2);color:var(--green)}.gh-window .status-badge.orange{background:var(--orange2);color:var(--orange)}.gh-window .status-badge.purple{background:#f .scenario-phone{height:auto;min-height:0;overflow:hidden;border:1px solid #3c3a34;border-radius:25px;background:#26251e;color:#fff}
.scenario-phone-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px;padding:12px 14px;border-bottom:1px solid #4b4940;background:#343229;font-size:12px;font-weight:600}
.scenario-conversation{height:calc(100% - 50px);overflow:auto;padding:12px 10px 18px;scrollbar-gutter:stable;scrollbar-width:thin;scrollbar-color:#807d72 #26251e}
.scenario-conversation::-webkit-scrollbar{width:8px}
.scenario-conversation::-webkit-scrollbar-track{border-left:1px solid #3c3a34;border-radius:8px;background:#26251e}
.scenario-conversation::-webkit-scrollbar-thumb{border:2px solid #26251e;border-radius:8px;background:#807d72}
.scenario-conversation::-webkit-scrollbar-thumb:hover{background:var(--primary)}
.scenario-message{position:relative;display:block;width:fit-content;max-width:86%;margin:8px 0;border:1px solid transparent;border-radius:13px;background:#3b3931;color:#fff;padding:9px 12px;text-align:left;transition:transform .16s ease,border-color .16s ease,opacity .16s ease,background .16s ease}
.scenario-message.self{margin-left:auto;background:#7c4328}
.scenario-message:hover{transform:translateY(-1px);border-color:#c9c4b8;background:#454238}
.scenario-message.self:hover{background:#8e4d2f}
.scenario-message:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.scenario-message-author{display:block;margin-bottom:3px;color:#d2cfc5;font-size:10px;line-height:1.2}
.scenario-message-body{display:block;color:#fff;font-size:12px;line-height:1.45}
.scenario-message-cue{display:block;margin-top:5px;color:#c8c2b5;font-size:9px;letter-spacing:.04em;opacity:.72}
.scenario-message.found{border-color:var(--green);opacity:.62}
.scenario-message.found .scenario-message-cue{color:#9fe0bf;font-weight:600}
.scenario-message.wrong{border-color:var(--red);animation:scenario-shake .48s ease both}
.scenario-message.wrong .scenario-message-cue{color:#ffb5c5;font-weight:600}
.scenario-file-stack{display:grid;gap:5px;margin-top:6px}
.scenario-file{display:grid;grid-template-columns:36px minmax(0,1fr);gap:6px;align-items:center;border:1px solid #666258;border-radius:6px;background:#302f29;padding:6px 7px;color:#fff;font-size:10px;line-height:1.3}
.scenario-feedback{min-height:44px;margin:10px 0 0;border-left:3px solid var(--primary);background:var(--canvas-soft);padding:10px 12px;color:var(--body);font-size:12px}
.scenario-feedback.wrong{border-left-color:var(--red);background:var(--red2);color:var(--red)}
.scenario-feedback.success{border-left-color:var(--green);background:var(--green2);color:var(--green)}
@keyframes scenario-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.scenario-collection-column{border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--canvas-soft);overflow:hidden}
.scenario-collection-head{display:block;padding:20px 20px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.scenario-collection-head .scenario-hunt-label{display:block;margin:0 0 4px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.scenario-collection-head h2{margin:0;font-size:25px;line-height:1.2}
.scenario-collection-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:14px}
.scenario-collection-card{min-height:158px;border:1px dashed var(--line-strong);border-radius:var(--radius-md);background:transparent;padding:16px;color:var(--muted)}
.scenario-collection-card.unlocked{border-style:solid;border-color:var(--primary);background:var(--surface);color:var(--ink)}
.scenario-lock-mark{margin-bottom:18px;color:var(--muted-soft);font-family:"JetBrains Mono","Fira Code",ui-monospace,Consolas,monospace;font-size:10px;letter-spacing:.12em}
.scenario-collection-card h3{margin:0 0 7px;font-size:16px;font-weight:600;letter-spacing:0}
.scenario-collection-card p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}
.scenario-card-state{margin-bottom:8px;color:var(--green);font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.scenario-collection-note{margin:0;padding:0 18px 16px;color:var(--muted);font-size:12px}
.scenario-glossary-toggle{position:fixed;right:0;bottom:calc(var(--action-h) + 18px);z-index:70;display:flex;align-items:center;gap:10px;min-height:44px;border:1px solid var(--ink);border-right:0;border-radius:8px 0 0 8px;background:var(--ink);color:var(--canvas);padding:0 14px;font-size:12px;font-weight:600}
.scenario-glossary-toggle:hover{border-color:var(--ink);background:#3b3931;color:var(--canvas)}
.scenario-glossary-toggle b{color:var(--primary);font-variant-numeric:tabular-nums}
.scenario-glossary-layer{position:fixed;inset:0;z-index:100;background:rgba(38,37,30,.34);animation:scenario-drawer-fade .18s ease both}
.scenario-glossary-drawer{position:absolute;top:0;right:0;width:min(360px,calc(100vw - 24px));height:100%;overflow:auto;border-left:1px solid var(--line-strong);background:var(--canvas);color:var(--ink);animation:scenario-drawer-in .22s ease both}
.scenario-glossary-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;border-bottom:1px solid var(--line);padding:0 18px}
.scenario-glossary-head h2{margin:0;font-size:20px;font-weight:400}
.scenario-glossary-close{display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);font-size:22px}
.scenario-glossary-body{display:grid;gap:10px;padding:16px}
.scenario-glossary-body .term-card{min-height:0;border:1px solid var(--line);border-radius:var(--radius-md);padding:14px;background:var(--surface)}
.scenario-glossary-body .term-card.active{border-color:var(--primary);box-shadow:inset 0 2px 0 var(--primary)}
.scenario-glossary-body .term-card h3{margin:0 0 5px;font-size:15px}
.scenario-glossary-body .term-card p{margin:0;font-size:12px;line-height:1.45}
@keyframes scenario-drawer-fade{from{opacity:0}to{opacity:1}}
@keyframes scenario-drawer-in{from{opacity:.4;transform:translateX(100%)}to{opacity:1;transform:translateX(0)}}
.card{border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);box-shadow:none}
.btn{min-height:40px;border:1px solid var(--line-strong);border-radius:var(--radius-md);background:var(--surface);color:var(--ink);padding:0 16px;font-size:14px;font-weight:500}
.btn:hover{border-color:var(--ink);background:var(--canvas-soft)}
.btn.primary{border-color:var(--primary);background:var(--primary);color:#fff}
.btn.primary:hover{border-color:var(--primary-active);background:var(--primary-active)}
.btn.blue{border-color:var(--ink);background:var(--ink);color:var(--canvas)}
.btn.danger{border-color:var(--red);background:var(--red);color:#fff}
.btn.link{border:0;background:transparent;padding-inline:3px;text-decoration:underline;text-underline-offset:3px}
.btn-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn-block{width:100%}
.notice{border:1px solid var(--line-strong);border-left:3px solid var(--primary);border-radius:var(--radius-md);background:var(--canvas-soft);padding:13px 15px}
.notice.warn{border-left-color:var(--warning);background:var(--warning-soft)}
.notice.danger{border-left-color:var(--red);background:var(--red-soft)}
.notice.success{border-left-color:var(--green);background:var(--green-soft)}

/* Stage 2: mapping decisions */
.mapping-workbench{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}
.problem-index{align-self:start;overflow:hidden}
.problem-index button{display:grid;grid-template-columns:28px 1fr;gap:10px;width:100%;min-height:68px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);padding:11px 13px;text-align:left}
.problem-index button:last-child{border-bottom:0}
.problem-index button.active{background:var(--primary-soft)}
.problem-index button.done .index-state{border-color:var(--green);color:var(--green)}
.index-state{display:grid;place-items:center;width:27px;height:27px;border:1px solid var(--line-strong);border-radius:50%;font-size:11px}
.problem-index b{display:block;font-size:13px;font-weight:600}
.problem-index small{display:block;margin-top:2px;color:var(--muted);font-size:11px}
.decision-canvas{display:grid;grid-template-columns:minmax(0,.78fr) minmax(0,1.22fr);column-gap:24px;align-items:start;padding:22px}
.decision-canvas .status-badge,.decision-canvas h2,.decision-canvas>p{grid-column:1}
.decision-canvas .status-badge{align-self:start}
.decision-canvas h2{margin:10px 0 7px;font-size:25px}
.decision-canvas>p{margin-bottom:0}
.decision-question{grid-column:2;grid-row:1;margin:0 0 10px;padding:0;border:0;align-self:end}
.need-options{display:grid;grid-column:2;grid-row:2 / span 3;grid-template-columns:1fr 1fr;gap:8px;margin:0}
.need-option,.predict-option{min-height:48px;border:1px solid var(--line-strong);border-radius:var(--radius-md);background:var(--surface);color:var(--ink);padding:11px 13px;text-align:left}
.need-option:hover,.predict-option:hover{border-color:var(--ink)}
.need-option.correct{border-color:var(--green);background:var(--green-soft);color:var(--ink)}
.need-option:disabled{cursor:default;opacity:1}
.predict-option{display:block;width:100%;margin-top:7px}
.predict-option.correct{border-color:var(--green);background:var(--green-soft)}
.predict-option.wrong{border-color:var(--red);background:var(--red-soft)}
.concept-mapping{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;margin-top:12px;border:1px solid var(--green);border-radius:var(--radius-md);background:var(--surface);padding:15px}
.concept-code{color:var(--green);font-family:ui-monospace,Consolas,monospace;font-size:11px;font-weight:600;letter-spacing:.08em}
.concept-mapping h3{margin:0 0 4px;font-size:20px;font-weight:600}
.concept-mapping p{margin:0}
.git-relation{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.relation-card{border:1px solid var(--line);border-radius:var(--radius-md);background:var(--canvas-soft);padding:15px}
.relation-card h3{margin:0 0 4px;font-size:18px;font-weight:600}
.relation-card p{margin:0;font-size:13px}

/* Stages 3–5: course workspace */
.course-workbench{display:grid;grid-template-columns:minmax(340px,380px) minmax(0,1fr);gap:12px;align-items:start}
.task-console{position:sticky;top:calc(var(--header-h) + 14px);display:flex;height:clamp(520px,calc(100dvh - var(--header-h) - var(--action-h) - 28px),606px);min-height:0;max-height:none;flex-direction:column;overflow:auto;padding:17px}
.task-console-header{padding-bottom:14px;border-bottom:1px solid var(--line)}
.task-console h2{margin:7px 0 0;font-size:23px;line-height:1.25;font-weight:600}
.task-section{padding:14px 0;border-bottom:1px solid var(--line)}
.task-section:last-of-type{border-bottom:0}
.task-label{margin-bottom:6px;color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}
.task-section p{margin:0;font-size:14px}
.task-checklist{margin:0;padding-left:19px;color:var(--body);font-size:13px}
.task-checklist li{margin:4px 0}
.task-console-actions{position:sticky;bottom:-17px;display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding:14px 0 1px;border-top:1px solid var(--line);background:var(--surface)}
.workspace-surface{position:relative;min-width:0}
.workspace-lock{display:grid;height:clamp(520px,calc(100dvh - var(--header-h) - var(--action-h) - 28px),606px);place-items:center;border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--canvas-soft);padding:28px;text-align:center}
.workspace-lock-inner{max-width:440px}
.workspace-lock-label{display:inline-block;margin-bottom:12px;color:var(--primary);font-family:ui-monospace,Consolas,monospace;font-size:11px;font-weight:600;letter-spacing:.08em}
.workspace-lock h2{margin-bottom:8px;font-size:25px}
.workspace-lock p{margin-bottom:0}
.demo-shield{position:absolute;inset:0;z-index:4;background:transparent}
.demo-guide{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;border:1px solid var(--primary);border-radius:var(--radius-md);background:var(--primary-soft);padding:9px 11px}
.demo-guide-no{display:grid;place-items:center;width:25px;height:25px;flex:none;border-radius:50%;background:var(--primary);color:#fff;font-size:12px;font-weight:600}
.demo-guide b{display:block;color:var(--primary)}
.demo-guide p{margin:1px 0 0;font-size:13px}
.demo-focus{position:relative;z-index:1;outline:3px solid var(--primary)!important;outline-offset:2px;border-radius:7px}
.demo-focus::after{content:'現在看這裡';position:absolute;right:0;top:-25px;border-radius:5px 5px 0 0;background:var(--primary);color:#fff;padding:3px 7px;font-size:11px;font-weight:600;white-space:nowrap}
.spotlight{outline:3px solid rgba(245,78,0,.32);border-radius:7px}
.predict{margin-top:12px}
.hint-box{margin-top:10px;border:1px solid var(--line-strong);border-radius:var(--radius-md);background:var(--canvas-soft);padding:11px;font-size:13px}
.error-scene{margin-bottom:10px;border:1px solid var(--red);border-left-width:3px;border-radius:var(--radius-md);background:var(--red-soft);padding:15px}
.error-scene h3{margin-bottom:6px;color:var(--red);font-size:18px;font-weight:600}
.consequence{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.consequence>div{border:1px solid #e9a9b9;border-radius:var(--radius-md);background:var(--surface);padding:11px}
.result-card,.reflection{margin-top:10px;padding:15px}
.step-done{border-color:var(--green);background:var(--green-soft)}
.challenge-role{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:13px}
.challenge-role b{border-radius:999px;background:var(--ink);color:var(--canvas);padding:4px 10px;font-weight:600}
.challenge-role span{color:var(--muted)}
.challenge-evidence{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.challenge-evidence summary{cursor:pointer;color:var(--ink);font-weight:600}
.status-log{margin-top:9px;color:var(--body);font-size:12px}
.status-log p{margin:4px 0}
.objective-list{padding-left:19px;color:var(--body)}
.challenge-score{color:var(--green);font-size:30px}
.understanding-grid{display:grid;gap:10px;margin-top:12px}
.understanding-card{border:1px solid var(--line);border-radius:var(--radius-md);padding:13px}
.field-help{margin:5px 0 0;color:var(--muted);font-size:12px}

/* Stage 4: optional text-entry shortcut. The real input stays editable. */
.practice-autofill-control{position:relative}
.practice-autofill-control>.input,.practice-autofill-control>.textarea{padding-right:94px}
.practice-autofill-button{position:absolute;z-index:2;top:5px;right:5px;min-height:32px;border:1px solid #24292f;border-radius:6px;background:#24292f;color:#fff;padding:0 10px;font:600 12px/1 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;white-space:nowrap}
.practice-autofill-button:hover{background:#3b4148}
.practice-autofill-button:focus-visible{outline:3px solid #0969da;outline-offset:2px}
.practice-autofill-button.filled{border-color:#1a7f37;background:#1a7f37}

/* Terminology deck */
.terms-panel{display:grid;grid-template-columns:120px minmax(0,1fr);min-height:64px;margin-top:12px;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--canvas-soft)}
.terms-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:62px;padding:0 14px;border-right:1px solid var(--line)}
.terms-head b{font-size:12px;font-weight:600}
.terms-head span{font-variant-numeric:tabular-nums;color:var(--muted)}
.terms-body{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
.term-card{min-width:0;border-right:1px solid var(--line);padding:8px 11px;background:var(--surface)}
.term-card:last-child{border-right:0}
.term-card.active{box-shadow:inset 0 2px 0 var(--primary)}
.term-card h3{margin:0 0 3px;font-size:12px;font-weight:600;letter-spacing:0}
.term-card p{display:-webkit-box;margin:0;overflow:hidden;color:var(--muted);font-size:10px;line-height:1.35;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.term-where{margin-top:5px;border-radius:var(--radius-sm);background:var(--canvas);padding:5px 6px;font-size:10px}
.mobile-terms{display:none;position:fixed;right:14px;bottom:calc(var(--action-h) + 12px);z-index:70}
.course-workbench .gh-window{height:clamp(520px,calc(100dvh - var(--header-h) - var(--action-h) - 28px),606px);min-height:0;overflow:auto}

/* Stage 1 desktop viewport: keep the whole exercise in view while allowing
   the evidence panels to handle their own overflow. The mobile layout keeps
   normal document scrolling. */
@media(min-width:1024px){
  html:has(.scenario-hunt-layout),body:has(.scenario-hunt-layout){overflow:hidden}
  .course-shell:has(.scenario-hunt-layout),.course-shell:has(.scenario-intro){min-height:calc(100dvh - var(--header-h) - var(--action-h))}
  .course-content:has(.scenario-hunt-layout){height:calc(100dvh - var(--header-h) - var(--action-h));overflow:hidden}
  .learning-page:has(.scenario-hunt-layout){height:100%;min-height:0;overflow:hidden;padding-bottom:18px}
  .learning-page:has(.scenario-hunt-layout) .lesson-main{height:100%;min-height:0}
  .scenario-hunt-layout{height:100%;min-height:0;align-items:stretch}
  .scenario-collection-area{display:flex;height:100%;min-height:0;flex-direction:column}
  .scenario-collection-area .stage-heading{flex:0 0 auto}
  .scenario-collection-column{display:flex;min-height:0;overflow:hidden;flex-direction:column}
  .scenario-collection-head{flex:0 0 auto;padding:clamp(12px,1.4vw,20px) clamp(14px,1.5vw,20px) clamp(10px,1.1vw,16px)}
  .scenario-collection-head h2{font-size:clamp(20px,2vw,25px)}
  .scenario-collection-grid{flex:1;min-height:0;grid-template-columns:1fr;grid-template-rows:repeat(5,minmax(0,1fr));gap:clamp(6px,.7vw,10px);padding:clamp(8px,1vw,14px)}
  .scenario-collection-card{min-height:0;overflow:hidden;padding:clamp(10px,1.1vw,16px)}
  .scenario-collection-card h3{font-size:clamp(13px,1.1vw,16px);line-height:1.25}
  .scenario-collection-card p{font-size:clamp(10px,.8vw,12px);line-height:1.35}
  .scenario-lock-mark{margin-bottom:clamp(8px,1vw,18px)}
  .scenario-card-state{margin-bottom:clamp(4px,.6vw,8px)}
  .scenario-collection-note{flex:0 0 auto;padding-bottom:clamp(8px,1vw,16px)}
  .scenario-phone-column{display:flex;height:100%;min-height:0;flex-direction:column}
  .scenario-device{height:auto;min-height:0;flex:1}
  .scenario-phone{height:auto;min-height:0}

  /* The introduction is a single slide on desktop as well. */
  html:has(.scenario-intro),body:has(.scenario-intro){overflow:hidden}
  .course-content:has(.scenario-intro){height:calc(100dvh - var(--header-h) - var(--action-h));overflow:hidden}
  .learning-page:has(.scenario-intro){height:100%;min-height:0;overflow:hidden;padding-bottom:18px}
  .learning-page:has(.scenario-intro) .lesson-main{height:100%;min-height:0}
  .scenario-intro{height:100%;min-height:0}
}

/* GitHub simulator: preserve its existing product visual language */
.gh-window{--surface:#fff;--ink:#1f2328;--muted:#59636e;--line:#d0d7de;--soft:#eef2f5;--blue:#0969da;--blue2:#ddf4ff;--green:#1a7f37;--green2:#dafbe1;--orange:#9a6700;--orange2:#fff8c5;--red:#cf222e;--red2:#ffebe9;--purple:#8250df;max-width:100%;min-height:520px;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif}
.gh-window p{color:inherit}.gh-global{display:flex;align-items:center;gap:12px;background:#24292f;color:#fff;padding:9px 12px}.gh-logo{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#fff;color:#24292f;font-weight:800}.gh-search{min-width:220px;border:1px solid #57606a;border-radius:6px;background:#0d1117;color:#afb8c1;padding:6px 10px}.gh-repohead{padding:12px 16px 0;border-bottom:1px solid var(--line);background:#f6f8fa}.repo-name{color:var(--blue);font-size:18px;font-weight:650}.gh-tabs{display:flex;gap:18px;margin-top:12px;overflow:auto}.gh-tab{border:0;border-bottom:2px solid transparent;background:transparent;padding:8px 2px;white-space:nowrap}.gh-tab.active{border-bottom-color:#fd8c73;font-weight:700}.gh-body{padding:14px}.gh-toolbar{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:12px}.branch-pill{border:1px solid var(--line);border-radius:7px;background:#f6f8fa;padding:7px 10px}.file-table{overflow:hidden;border:1px solid var(--line);border-radius:8px}.file-row{display:grid;grid-template-columns:minmax(0,1fr) 170px 90px;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px}.file-row:last-child{border-bottom:0}.file-name{color:var(--blue);font-weight:600}.gh-empty{text-align:center;padding:48px 20px;color:var(--muted)}.gh-form{max-width:720px}.field{margin-bottom:14px}.field label{display:block;margin-bottom:6px;font-weight:650}.input,.textarea,.select{width:100%;border:1px solid var(--line);border-radius:7px;background:#fff;padding:9px 10px}.textarea{min-height:130px;resize:vertical}.radio-stack{display:grid;gap:8px}.radio-card{display:flex;gap:10px;border:1px solid var(--line);border-radius:8px;padding:12px}.radio-card:has(input:checked){border-color:var(--blue);box-shadow:0 0 0 4px rgba(9,105,218,.18)}.upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.upload-item{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px}.upload-item.private{border-color:var(--orange);background:var(--orange2)}.commit-box{margin-top:14px;border:1px solid var(--line);border-radius:8px;background:#f6f8fa;padding:13px}.issue-row{margin-bottom:9px;border:1px solid var(--line);border-radius:8px;padding:13px}.issue-open{color:var(--green)}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;overflow:auto}.board-col{min-height:240px;border:1px solid var(--line);border-radius:8px;background:#f6f8fa;padding:10px}.board-card{margin-top:8px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:10px}.diff{overflow:hidden;border:1px solid var(--line);border-radius:7px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px}.diff-line{display:block;width:100%;padding:9px 10px;border:0;border-bottom:1px solid rgba(31,35,40,.08);text-align:left;font:inherit}.diff-line:last-child{border-bottom:0}.diff-line.add{background:#dafbe1}.diff-line.del{background:#ffebe9}.diff-line.selected{outline:3px solid var(--blue);outline-offset:-3px}.diff-scroll{max-width:100%;overflow:auto}.review-box{margin-top:13px;border:1px solid var(--line);border-radius:8px;padding:13px}.gh-window .status-badge{background:var(--soft);color:var(--ink);font-size:12px;font-weight:700;letter-spacing:0;text-transform:none}.gh-window .status-badge.green{background:var(--green2);color:var(--green)}.gh-window .status-badge.orange{background:var(--orange2);color:var(--orange)}.gh-window .status-badge.purple{background:#fbefff;color:var(--purple)}.gh-window .btn{min-height:44px;border:1px solid var(--line);border-radius:7px;background:#f6f8fa;color:var(--ink);padding:9px 13px;font-weight:650}.gh-window .btn:hover{background:#eef1f4}.gh-window .btn.primary{border-color:var(--green);background:var(--green);color:#fff}.gh-window .btn.primary:hover{background:#116329}.gh-window .btn.blue{border-color:var(--blue);background:var(--blue);color:#fff}.gh-window .btn.danger{border-color:var(--red);background:var(--red);color:#fff}.gh-window .btn.link{border:0;background:transparent;color:var(--blue);padding:4px 5px}.gh-window .notice{border-left:4px solid var(--blue);border-radius:7px;background:var(--blue2);padding:14px 16px}.gh-window .notice.warn{border-color:var(--orange);background:var(--orange2)}.gh-window .notice.danger{border-color:var(--red);background:var(--red2)}.gh-window .notice.success{border-color:var(--green);background:var(--green2)}

/* Modals and extension */
.modal-wrap{position:fixed;inset:0;z-index:110;display:grid;place-items:center;background:rgba(38,37,30,.55);padding:18px}.modal{width:100%;max-width:680px;max-height:88vh;overflow:auto;border:1px solid var(--line-strong);border-radius:var(--radius-lg);background:var(--surface)}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}.modal-head h2{margin:0;font-size:22px}.modal-body{padding:18px}.modal-close{min-width:44px;min-height:44px;border:0;background:transparent;font-size:24px}.terminal{overflow:hidden;border-radius:8px;background:#010409;color:#e6edf3;font-family:"JetBrains Mono","Fira Code",ui-monospace,Consolas,monospace}.terminal-head{padding:9px 12px;border-bottom:1px solid #30363d;background:#161b22}.terminal-output{min-height:250px;max-height:360px;overflow:auto;padding:12px;white-space:pre-wrap}.terminal-row{display:flex;gap:8px;padding:9px 12px;border-top:1px solid #30363d}.terminal-row input{flex:1;border:0;outline:0;background:transparent;color:#fff;font:inherit}.prompt,.ok{color:#7ee787}.cmd{color:#79c0ff}.err{color:#ff7b72}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
main h1[tabindex="-1"]:focus,main h2[tabindex="-1"]:focus{outline:none}

@media(max-width:1280px){
  :root{--rail-w:148px}
  .header-main{grid-template-columns:minmax(220px,1fr) auto auto;padding-inline:20px;gap:12px}
  .diagnosis-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .course-workbench{grid-template-columns:minmax(300px,340px) minmax(0,1fr)}
}
@media(max-width:1023px){
  .header-main{grid-template-columns:minmax(0,1fr) auto auto;gap:10px}
  .course-rail{display:none}
  .scenario-workbench{grid-template-columns:1fr}
  .scenario-hunt-layout{grid-template-columns:1fr}
  .scenario-device{height:520px;min-height:520px}
  .scenario-phone{height:auto;min-height:0}
  .scenario-phone-column{order:-1}
  .scenario-collection-area{order:0}
  .mapping-workbench{grid-template-columns:220px minmax(0,1fr)}
  .course-workbench{grid-template-columns:1fr}
  .task-console{position:static;height:auto;min-height:0;max-height:none;overflow:visible}
  .task-console-actions{position:static}
  .course-workbench .gh-window{height:auto;min-height:520px}
  .workspace-lock{height:auto;min-height:360px}
}
@media(max-width:760px){

  .brand-title{font-size:14px}
  .header-course-actions{justify-self:end;gap:5px}
  .header-course-actions .btn{min-height:36px;padding-inline:10px;font-size:12px}
  .header-course-actions .header-course-next{min-width:118px}
  .header-actions{display:none}
  .learning-page{padding:22px 12px calc(var(--action-h) + 28px)}
  .stage-heading{grid-template-columns:1fr;gap:14px}
  .stage-heading h1{font-size:28px}
  .stage-progress{min-width:0}
  .progress-segments{justify-content:flex-start}
  .editorial-hero{padding:24px 0}
  .editorial-hero h1{font-size:36px}
  .editorial-hero>p{font-size:15px}
  .scenario-intro{min-height:calc(100dvh - var(--header-h) - var(--action-h) - 20px);padding:42px 0 72px}
  .scenario-intro h1{font-size:40px;letter-spacing:-.035em}
  .scenario-intro-copy{font-size:15px}
  .scenario-intro-rule{margin-top:48px}
  .section-heading{display:block;margin-top:34px}
  .section-heading p{margin-top:7px}
  .scenario-hunt-layout{gap:16px}
  .scenario-device{height:500px;min-height:500px}
  .scenario-phone{height:auto;min-height:0}
  .scenario-collection-head{align-items:start;flex-direction:column;padding:16px}
  .scenario-collection-grid{grid-template-columns:1fr;padding:10px}
  .scenario-collection-card{min-height:142px}
  .scenario-collection-note{padding:0 14px 14px}
  .scenario-glossary-toggle{bottom:calc(var(--action-h) + 12px)}
  .scenario-evidence{height:360px}
  .scenario-cards-column .diagnosis-grid{height:auto;grid-template-rows:none}
  .scenario-cards-column .diagnosis-card{height:129px;min-height:129px;max-height:129px;padding:14px 12px;overflow:hidden}
  .scenario-cards-column .diagnosis-card-index{margin-bottom:13px;font-size:10px}
  .scenario-cards-column .diagnosis-card b{margin-bottom:6px;font-size:15px}
  .scenario-cards-column .diagnosis-card p{display:-webkit-box;overflow:hidden;font-size:12px;line-height:1.45;-webkit-box-orient:vertical;-webkit-line-clamp:1}
  .scenario-cards-column .diagnosis-card-status{padding-top:10px;font-size:10px}
  .scenario-impact-column .diagnosis-insight{min-height:180px}
  .scenario-workbench .terms-panel{min-height:0}
  .scenario-workbench .term-card{min-height:auto}
  .diagnosis-card:first-child{grid-column:auto;display:flex;min-height:118px}
  .diagnosis-card:first-child .diagnosis-card-index{grid-row:auto;padding-top:0}
  .diagnosis-card:first-child .diagnosis-card-status{align-self:auto;padding:10px 0 0;white-space:normal}
  .diagnosis-grid,.need-options,.git-relation{grid-template-columns:1fr}
  .mapping-workbench{grid-template-columns:1fr}
  .problem-index{display:flex;overflow:auto}
  .problem-index button{min-width:225px;border-right:1px solid var(--line);border-bottom:0}
  .course-workbench{gap:10px}
  .task-console{padding:15px}
  .task-console h2{font-size:21px}
  .gh-window{min-height:460px}
  .gh-search{display:none}
  .gh-body{padding:11px}
  .gh-tabs{gap:13px}
  .upload-grid{grid-template-columns:1fr}
  .file-row{grid-template-columns:1fr 72px}
  .file-row span:nth-child(2){display:none}
  .board{grid-template-columns:repeat(3,230px)}
  .consequence{grid-template-columns:1fr}
  .terms-panel{display:none}
  .mobile-terms{display:block}
  .modal-wrap{padding:10px}
  .modal{max-height:94vh}
}
@media(max-width:430px){
  .brand>div:last-child{display:none}
  .scenario-intro{padding-top:30px}
  .scenario-intro h1{font-size:35px}
  .scenario-intro-foot{display:block}
  .scenario-intro-foot .btn{margin-top:12px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}

/* Desktop fit: keep every lesson inside the viewport; only the glossary drawer may scroll. */
@media(min-width:1024px){
  html,body{height:100%;overflow:hidden}
  #app{height:125dvh;min-height:0;overflow:hidden;zoom:.8}
  .course-shell,.course-content{height:calc(125dvh - var(--header-h) - var(--action-h));min-height:0}
  .course-shell:has(.scenario-hunt-layout),.course-shell:has(.scenario-intro),.course-content:has(.scenario-hunt-layout),.course-content:has(.scenario-intro){height:calc(125dvh - var(--header-h) - var(--action-h));min-height:0}
  .course-rail{height:calc(125dvh - var(--header-h) - var(--action-h))}
  .course-content{overflow:hidden}
  .course-rail .course-nav-list{overflow:hidden}
  .learning-page{height:100%;min-height:0;display:flex;flex-direction:column;overflow:hidden;padding-bottom:18px}
  .learning-page>.lesson-main{height:100%;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .lesson-main>.stage-heading{flex:0 0 auto}
  .lesson-main>.scenario-hunt-layout,.lesson-main>.mapping-workbench,.lesson-main>.course-workbench{flex:1 1 auto;min-height:0;overflow:hidden}
  .mapping-workbench{height:auto;align-items:start}
  .course-workbench{height:auto;align-items:stretch}
  .mapping-workbench .decision-canvas{height:auto;align-self:start}
  .problem-index,.decision-canvas,.task-console,.workspace-surface{min-height:0}
  .problem-index,.decision-canvas{overflow:hidden}
  .task-console{position:relative;top:auto;height:100%;overflow:hidden}
  .course-workbench:has(.demo-shield) .task-console-actions{position:static;bottom:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:auto;padding:12px 0 0}
  .course-workbench:has(.demo-shield) .task-console-actions .btn{min-width:0;padding-inline:7px;font-size:13px;white-space:nowrap}
  .workspace-surface{display:flex;height:100%;flex-direction:column;overflow:hidden}
  .workspace-surface>.gh-window,.workspace-surface>.workspace-lock{height:auto;min-height:0;flex:1 1 auto;overflow:hidden}
  .workspace-surface>.gh-window{zoom:.82}
  .workspace-surface .textarea{min-height:153px;overflow:hidden;resize:none}
  .gh-window .gh-tabs,.gh-window .board,.gh-window .diff-scroll{overflow:hidden}
  .workspace-surface:has(.result-card){display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:10px;align-items:stretch}
  .workspace-surface:has(.result-card)>.gh-window{grid-column:1/-1;grid-row:1;height:100%;zoom:.73}
  .workspace-surface:has(.result-card)>.result-card,.workspace-surface:has(.result-card)>.reflection{min-width:0;min-height:0;margin:0;padding:11px;overflow:hidden}
  .workspace-surface:has(.result-card)>.result-card{grid-column:1;grid-row:2}
  .workspace-surface:has(.result-card)>.reflection{display:grid;grid-column:2;grid-row:2;grid-template-columns:1fr 1fr;gap:7px 8px;align-content:start}
  .workspace-surface:has(.result-card)>.reflection h3,.workspace-surface:has(.result-card)>.reflection .btn-row{grid-column:1/-1;margin:0!important}
  .workspace-surface:has(.result-card)>.reflection h3{font-size:14px;line-height:1.3}
  .workspace-surface:has(.result-card)>.reflection .predict-option{min-height:34px;margin:0;padding:7px 8px;font-size:12px;line-height:1.25}
  .workspace-surface:has(.result-card)>.reflection .btn{min-height:34px;padding-inline:10px}
  /* Validation feedback must not consume the simulator height or hide its
     bottom controls. It stays anchored to the current work surface instead. */
  .workspace-surface:has(.error-scene){display:block;position:relative}
  .workspace-surface:has(.error-scene)>.gh-window{height:100%;min-height:0}
  .workspace-surface:has(.error-scene)>.error-scene{position:absolute;z-index:6;top:12px;right:12px;width:min(360px,calc(100% - 24px));margin:0;padding:12px}

  /* Stage 4 starts as a compact decision gate, not an empty full-height panel. */
  .course-workbench:has(.workspace-lock) .workspace-surface{display:grid;place-items:center;background:transparent}
  .course-workbench:has(.workspace-lock) .workspace-lock{width:min(100%,460px);min-height:230px;flex:none;border-left:3px solid var(--primary);background:var(--surface);padding:28px}

  /* Stage 5 contains the densest forms. Give those controls their own compact
     desktop rhythm instead of letting a scaled mockup clip its final actions. */
  .course-workbench:has(.challenge-role){grid-template-columns:minmax(272px,304px) minmax(0,1fr);gap:16px}
  .course-workbench:has(.challenge-role) .task-console{padding:15px}
  .course-workbench:has(.challenge-role) .task-section{padding:11px 0}
  .course-workbench:has(.challenge-role) .gh-body{padding:11px}
  .course-workbench:has(.challenge-role) .field{margin-bottom:9px}
  .course-workbench:has(.challenge-role) .textarea{min-height:118px}
  .course-workbench:has(.challenge-role) .review-box{margin-top:8px;padding:10px}
  .course-workbench:has(.challenge-role) .gh-window .btn{min-height:38px;padding:7px 11px}
  .course-workbench:has(.challenge-role) .understanding-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:0}
  .course-workbench:has(.challenge-role) .understanding-card{padding:10px}
  .course-workbench:has(.challenge-role) .understanding-card h2{font-size:17px;line-height:1.25}
  .course-workbench:has(.challenge-role) .understanding-card p{font-size:12px;line-height:1.35}
  .course-workbench:has(.challenge-role) .understanding-card .textarea{min-height:76px}
   .scenario-conversation{overflow:hidden}

   /* Stage 5 adaptive review */
   .review-page{display:grid;gap:16px}
   .review-intro{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(280px,.95fr);gap:14px;align-items:stretch}
   .review-brief,.review-route-card,.review-surface,.review-report{border:1px solid var(--line);background:var(--surface);border-radius:8px}
   .review-brief{padding:20px 22px;border-top:3px solid var(--ink)}
   .review-brief h2{margin:0 0 8px;font-size:27px;line-height:1.18}
   .review-brief p{margin:0;color:var(--muted);line-height:1.65}
   .review-route-card{padding:16px 18px;display:grid;gap:8px;align-content:start}
   .review-route-card h3{margin:0;font-size:15px}
   .review-route-list{display:grid;gap:7px;margin:0;padding:0;list-style:none}
   .review-route-list li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;align-items:start;color:var(--muted);font-size:13px}
   .review-route-list li i{font-style:normal;color:var(--ink);font-variant-numeric:tabular-nums}
   .review-route-list li.active{color:var(--ink);font-weight:600}
   .review-route-list li.done{color:var(--green)}
   .review-route-list li.repair{padding-left:8px;border-left:2px solid var(--primary)}
   .review-workbench{display:grid;grid-template-columns:minmax(200px,.34fr) minmax(0,.66fr);gap:16px;align-items:start}
   .review-sidebar{display:grid;gap:10px;position:sticky;top:var(--sticky-top);align-self:start}
   .review-evidence-card,.review-sidebar-note{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:14px 16px}
   .review-evidence-card h3,.review-sidebar-note h3{margin:0 0 8px;font-size:15px}
   .review-evidence-card p,.review-sidebar-note p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}
   .review-domain-list{display:grid;gap:7px;margin:0;padding:0;list-style:none}
   .review-domain-list li{display:flex;gap:8px;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:8px;font-size:13px}
   .review-domain-list li:first-child{border-top:0;padding-top:0}
   .review-domain-status{color:var(--muted);font-size:12px;white-space:nowrap}
   .review-domain-status.weak{color:var(--primary);font-weight:600}
   .review-domain-status.ready{color:var(--green);font-weight:600}
   .review-surface{min-width:0;overflow:hidden}
   .review-surface-head{padding:18px 20px;border-bottom:1px solid var(--line)}
   .review-surface-head h2{margin:5px 0 6px;font-size:29px;line-height:1.15}
   .review-surface-head p{margin:0;color:var(--muted);line-height:1.55}
   .review-surface-body{padding:18px 20px;display:grid;gap:14px}
   .review-question{border-top:1px solid var(--line);padding-top:14px}
   .review-question:first-child{border-top:0;padding-top:0}
   .review-question h3{margin:0 0 8px;font-size:16px;line-height:1.4}
   .review-question>p{margin:0 0 10px;color:var(--muted);line-height:1.55}
   .review-field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
   .review-field{display:grid;gap:5px;min-width:0}
   .review-field label{font-size:12px;color:var(--muted);font-weight:600}
   .review-field select,.review-field input,.review-field textarea{width:100%;box-sizing:border-box}
   .review-choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
   .review-choice{min-height:46px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:10px 12px;color:var(--ink);font:inherit;cursor:pointer;transition:border-color .16s ease,background .16s ease}
   .review-choice:hover{border-color:var(--ink)}
   .review-choice:focus-visible,.review-diff-line:focus-visible,.review-check:focus-within{outline:2px solid var(--primary);outline-offset:2px}
   .review-choice.selected{border-color:var(--primary);background:var(--primary-soft)}
   .review-choice.correct{border-color:var(--green);background:var(--green-soft)}
   .review-check-list{display:grid;gap:7px}
   .review-check{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:7px;padding:9px 10px;color:var(--ink);font-size:13px;line-height:1.45}
   .review-check input{margin-top:3px;accent-color:var(--primary)}
   .review-inline-status{min-height:18px;color:var(--muted);font-size:13px}
   .review-feedback{border-left:3px solid var(--primary);background:var(--primary-soft);padding:10px 12px;color:var(--ink);line-height:1.5}
   .review-feedback.success{border-left-color:var(--green);background:var(--green-soft)}
   .review-feedback.error{border-left-color:var(--red);background:var(--red-soft)}
   .review-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:14px}
   .review-actions .field-help{margin:0;flex:1 1 220px}
   .review-pr-grid{display:grid;grid-template-columns:minmax(210px,.8fr) minmax(0,1.2fr);gap:12px}

   .review-timeline-item.warn{border-left-color:#f5a623}

   .review-diff-tab.selected{border-color:var(--primary);color:var(--primary);font-weight:600}

   .review-report h2{margin:0 0 6px;font-size:30px}

/* Desktop document scroll: at browser zoom 100%, the course may be taller
   than the viewport. Let the page reveal the complete lesson instead of
   clipping its outer panels; the GitHub mockup and phone remain bounded
   simulations with their own realistic scroll areas. */
@media(min-width:1024px){
  html,body{height:auto;min-height:100%;overflow-x:hidden;overflow-y:auto}
  html:has(.scenario-hunt-layout),body:has(.scenario-hunt-layout),html:has(.scenario-intro),body:has(.scenario-intro){height:auto;min-height:100%;overflow-x:hidden;overflow-y:auto}
  html{scroll-padding-top:calc(var(--header-h) + 16px)}
  #app{height:auto;min-height:100dvh;overflow:visible;zoom:.8}
  .course-shell,.course-content{height:auto;min-height:calc(100dvh - var(--header-h));overflow:visible}
  .course-shell:has(.scenario-hunt-layout),.course-shell:has(.scenario-intro),.course-content:has(.scenario-hunt-layout),.course-content:has(.scenario-intro){height:auto;min-height:0;overflow:visible}
  .course-rail{height:calc(100dvh - var(--header-h))}
  .course-rail .course-nav-list{overflow:auto}

  .learning-page,.learning-page>.lesson-main{height:auto;min-height:0;display:block;overflow:visible}
  .learning-page{padding-bottom:34px}
  .lesson-main>.scenario-hunt-layout,.lesson-main>.mapping-workbench,.lesson-main>.course-workbench{height:auto;min-height:0;display:grid;flex:none;overflow:visible}

  /* Stage 1: let both the heading and the complete collection book take
     their natural height. The phone keeps its bounded conversation viewport
     because that is part of the simulated mobile interface. */
  .scenario-hunt-layout{height:auto;min-height:0;align-items:start}
  .scenario-collection-area{display:block;height:auto;min-height:0}
  .scenario-collection-area .stage-heading{flex:none}
  .scenario-collection-column{display:block;height:auto;min-height:0;overflow:visible}
  .scenario-collection-grid{display:grid;flex:none;min-height:0;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:none;gap:8px;padding:10px}
  .scenario-collection-card{min-height:112px;overflow:visible;padding:11px 13px}
  .scenario-lock-mark,.scenario-card-state{margin-bottom:6px;font-size:12px;line-height:1.25}
  .scenario-collection-card h3{margin-bottom:6px;font-size:18px;line-height:1.3}
  .scenario-collection-card p{font-size:13px;line-height:1.45}
  .scenario-phone-column{display:block;height:auto;min-height:0}
  .scenario-device{width:min(100%,288px);height:auto;aspect-ratio:9 / 19.5;min-height:0;margin-inline:auto;flex:none}
  .scenario-phone{height:auto;min-height:0}
  .scenario-conversation{overflow:auto}
  .learning-page:has(.scenario-hunt-layout),.learning-page:has(.scenario-intro),.learning-page:has(.scenario-hunt-layout) .lesson-main,.learning-page:has(.scenario-intro) .lesson-main{height:auto;min-height:0;overflow:visible}
  .scenario-intro{height:auto;min-height:calc(100dvh - var(--header-h) - var(--action-h) - 48px)}

  /* Stages 2–5: expand the lesson-side panels in normal document flow. */
  .mapping-workbench,.course-workbench{height:auto;min-height:0}
  .problem-index,.decision-canvas,.task-console,.workspace-surface{height:auto;min-height:0;overflow:visible}
  .task-console{position:sticky;top:calc(var(--header-h) + 14px);max-height:none}
  .workspace-surface{display:flex;height:auto;min-height:0;flex-direction:column;overflow:visible}
  .workspace-surface>.gh-window,.workspace-surface>.workspace-lock{height:auto;min-height:520px;flex:none;overflow:auto}
  .workspace-surface>.gh-window{zoom:.82}
  .workspace-surface .textarea{min-height:153px;overflow:visible;resize:vertical}
  .gh-window .gh-tabs,.gh-window .board,.gh-window .diff-scroll{overflow:auto}
  .workspace-lock{height:auto;min-height:230px}
  .workspace-surface:has(.result-card){display:grid;height:auto;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto;overflow:visible}
  .workspace-surface:has(.result-card)>.gh-window{height:auto;min-height:520px;overflow:auto}
  .workspace-surface:has(.result-card)>.result-card,.workspace-surface:has(.result-card)>.reflection{min-height:0;overflow:visible}
  .workspace-surface:has(.error-scene){display:flex;height:auto;min-height:0;flex-direction:column;overflow:visible}
  .workspace-surface:has(.error-scene)>.gh-window{height:auto;min-height:520px;overflow:auto}
  .workspace-surface:has(.error-scene)>.error-scene{position:static;width:auto;margin:0 0 10px;padding:15px}
}

function inspectPain(id){state.scenarioSelected=id;if(!state.scenarioFound.includes(id))state.scenarioFound.push(id);save()}
function startScenarioInvestigation(){state.scenarioIntro=false;state.scenarioSelected=null;save();topNow()}
function showScenarioIntro(){state.scenarioIntro=true;save();topNow()}
/* stage 2 */
function selectThinking(id){state.thinkingCurrent=id;save()}
function shuffleNeeds(id){const current=pains.find(p=>p.id===id);const others=pains.filter(p=>p.id!==id).slice(0,3);return [current,...others].sort((a,b)=>a.id.localeCompare(b.id))}
function answerNeed(painId,answerId){if(painId===answerId){state.thinking[painId]=true;state.modal=null}else{const p=pains.find(x=>x.id===answerId);state.modal={type:'wrong',title:['再想一次','Try again'],body:[`你選的「${p.need[0]}」是在解決另一個問題，回頭看看目前情境再選一次。`,`“${p.need[1]}” addresses a different problem. Look at the current situation again and choose once more.`]}}save()}
function conceptReveal(p){const key=resolveTermKey(p.term),term=terms[key];if(!term)return `<article class="card concept-reveal"><div class="notice warn">${tx('名詞資料暫時無法載入，請切換題目後再試一次。','The terminology card could not be loaded. Switch questions and try again.')}</div></article>`;return `<article class="card concept-reveal"><span class="status-badge green">${tx('你已找到對應功能','Matching GitHub feature')}</span><h2>${esc(term.en)}｜${esc(term.zh)}</h2><p>${tx(esc(term.descZh),esc(term.descEn))}</p></article>`}
function gitGithubReveal(){return `<section class="git-github"><article class="card concept-box"><h3>Git</h3><p>${tx('Git 會記錄檔案怎麼改、什麼時候改。這門課先用網頁操作，指令之後再學。','Git records what changed in a file and when. This course starts with the web; commands come later.')}</p></article><article class="card concept-box"><h3>GitHub</h3><p>${tx('GitHub 把 Repository、Issue、Project、Pull Request 和 Review 集中在同一個協作網站裡。','GitHub brings repositories, issues, projects, pull requests, and reviews together in one collaboration site.')}</p></article></section>`}

let demoTimer=null;

function challengeStepNames(){return [
 ['建立 Repository','Create repository'],['準備檔案與 Commit','Prepare files and commit'],['建立 Issue','Create issue'],
 ['建立 Project，將卡片移到 In progress','Create a project and move the card to In progress'],['建立 Branch','Create branch'],
 ['在 Branch 上修改並建立 Commit','Edit on the branch and create a commit'],['建立自己的 PR','Open your PR'],['查看 Review 並修正','Read the review and fix the change'],
 ['合併自己的 PR','Merge your PR'],['開啟隊友的 PR','Open teammate PR'],['查看最新 Diff','View latest diff'],
 ['送出 Review 並要求修改','Submit a review and request changes'],['查看修正紀錄','Read the fix record'],['再次查看最新 Diff','Recheck the latest diff'],
 ['確認最新修正後 Approve','Approve after confirming the latest fix'],['Merge 隊友 PR','Merge teammate PR'],['把 Project 卡片移到 Done','Move the Project card to Done'],
 ['理解檢查','Understanding check'],['完成','Complete']
]}
function challengeStage(){const c=state.challenge,a=c.missionA,b=c.missionB;
 if(!a.repoCreated)return 0;if(!a.filesCreated)return 1;if(!a.issueCreated)return 2;
 if(!a.projectCreated||a.projectStatus==='todo')return 3;if(!a.branchCreated)return 4;
 if(!a.branchCommitSha)return 5;if(!a.prCreated)return 6;
 if(!a.reviewRead||!a.fixCommitSha)return 7;if(!a.jamieApproved||!a.merged)return 8;
 if(!b.prOpened)return 9;if(!b.jamieFixCommitSha&&(b.diffViewedSha!==b.currentHeadSha||b.selectedDiffLine!=='budget-line'||b.issueCategory!=='missing-currency'))return 10;
 if(!b.reviewComment||!b.changesRequested)return 11;if(!b.jamieFixCommitSha)return 12;
 if(b.latestDiffViewedSha!==b.currentHeadSha||!b.latestDiffLine||!b.fixVerified)return 13;
 if(!b.approved)return 14;if(!b.merged)return 15;if(!b.projectStatusVerified||!b.issueClosureVerified)return 16;
 if(!b.understanding.passed)return 17;return 18
}
function challengeRecord(type,data={}){const c=state.challenge;c.events.push({at:new Date().toISOString(),type,...data});c.progress=Math.min(100,Math.round((challengeStage()/18)*100));persist()}

function challengeErrorBox(){const e=state.challenge.error;if(!e)return'';return `<article class="error-scene" role="alert" aria-live="assertive"><h3>${tx(...e.title)}</h3><p>${tx(...e.body)}</p><button class="btn" onclick="challengeDismissError()">${tx('我知道了，回到目前步驟','Close and return to this step')}</button></article>`}

 const rows=[['Repository',a.repoCreated],['main 初始 Commit',a.initialCommitSha],['Issue #1',a.issueCreated],['Project 已手動移到 In progress',a.projectCreated&&['in_progress','done'].includes(a.projectStatus)],['Branch Commit',a.branchCommitSha],['自己的 PR 已 Merge',a.merged],['已查看隊友 PR 的最新 Diff',b.latestDiffViewedSha===b.currentHeadSha&&!!b.fixVerified],['隊友 PR 已核准並合併',b.merged],['Project 已完成',b.projectStatusVerified],['已確認 Issue 關閉',b.issueClosureVerified]];
 return `<ul class="objective-list status-log">${rows.map(([label,ok])=>`<li>${ok?'✓':'○'} ${label}</li>`).join('')}</ul>`}

 ];return `<p>${tx(...text[stage]||text[18])}</p><p class="field-help">${stage<18?`${stage+1}/18：${tx(...names[stage])}`:tx('18/18：完成','18/18: Complete')}</p>`}
